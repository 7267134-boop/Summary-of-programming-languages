    <script>
        let hoverCloseTimer = null;

        function clearCloseTimer() {
            if (hoverCloseTimer) {
                clearTimeout(hoverCloseTimer);
                hoverCloseTimer = null;
            }
        }

        function startCloseTimer() {
            if (tooltipState !== 3) return;
            clearCloseTimer();
            hoverCloseTimer = setTimeout(() => {
                closeModal(null, true);
            }, 300); // 300ms delay to allow mouse movement to modal
        }

        // Global click listener to close modal when clicking outside in click mode
        document.addEventListener('click', (event) => {
            const modal = document.getElementById('explanation-modal');
            const modalCard = document.getElementById('modal-card');

            if (!modal.classList.contains('hidden')) {
                // If the click is NOT inside the modal-card, and NOT on an interactive tooltip
                if (!modalCard.contains(event.target) && !event.target.closest('.interactive-tooltip')) {
                    closeModal(null, true);
                }
            }
        });
        const explanationsDict = {
            "step1_1": `אנחנו מגדירים משפחה חדשה של חוקים דקדוקיים בשם <code>type</code> (טיפוס). המפרש לומד כאן מילים חדשות.<br>אנחנו אומרים לו: בכל פעם שאתה קורא את הטקסט הטהור <code>"int"</code> (כמחרוזת, מילה בקוד), תארוז אותו לתוך קופסה מסוג <code>int-type</code> (שזה ה-AST Node, צומת בעץ התחביר המופשט). אותו הדבר לגבי <code>"bool"</code> שייארז כ-<code>bool-type</code>, וכו'. זה השלב שבו השפה שלנו מתחילה להבין שהיא שפה עם טיפוסים (Typed Language), ונוכל להשתמש בהצהרות האלה בהמשך.`,

            "step1_2": `זוהי תבנית התחביר (ה-Blueprint) של לולאת ה-<code>foreach</code>. אנחנו מגדירים כאן חוק חדש במשפחת ה-<code>expression</code> (הביטויים).<br>התבנית הזו מורכבת משרשרת מדויקת שהמתכנת <em>חייב</em> לכתוב כדי שהקוד יעבור הידור (Parsing) בהצלחה. בוא נפרק את רכיבי התבנית:<br>
<ol class="list-decimal list-inside space-y-1 mt-2">
<li><code>"foreach"</code> ו-<code>"("</code>: מילים שמורות ותווים שהמפרש מחפש כדי לדעת שהתחלנו לולאה. (ייזרקו לפח אחרי הזיהוי).</li>
<li><code>type</code>: כאן ה-Parser פונה לחוקים שהגדרנו למעלה. הוא מצפה למצוא כאן משהו שמוגדר כטיפוס (למשל <code>int</code>). (זה יישמר).</li>
<li><code>identifier</code>: מזהה, כלומר שם של משתנה (למשל <code>x</code>). זה יהיה משתנה האיטרציה שלנו. (יישמר).</li>
<li><code>"in"</code> ו-<code>"["</code>: עוד סימני פיסוק ומילות קישור לתחביר אנושי. (ייזרקו).</li>
<li><code>(separated-list expression ";")</code>: זהו קסם חזק של המפרש. במקום לצפות לביטוי אחד, אנחנו אומרים לו לאסוף רשימה של ביטויים (expressions) שמופרדים ביניהם בנקודה-פסיק (<code>;</code>). זהו המערך או הרשימה שהלולאה תרוץ עליהם! (יישמר כרשימה).</li>
<li><code>"]"</code> ו-<code>")"</code> ו-<code>"do"</code>: סגירת החלק ההצהרתי של הלולאה ומעבר לביצוע. (ייזרקו).</li>
<li><code>expression</code>: זהו גוף הלולאה. הפעולה שתתבצע על כל איבר. (יישמר).</li>
</ol>`,

            "step1_3": `נתינת שם לקופסה! זוהי שורת הסיום של החוק.<br>אנחנו אומרים למפרש: "אחרי שווידאת שהמתכנת כתב בדיוק לפי התבנית המפרכת שלמעלה, קח את כל החלקים החשובים שאספת (הטיפוס, המזהה, רשימת הביטויים, וגוף הלולאה), ותארוז אותם לתוך אובייקט (AST Node) יחיד בשם <code>foreach-exp</code>".<br>מהרגע הזה, כשפונקציית ה-<code>value-of</code> שלך תרוץ, היא כבר לא תתעסק עם טקסט, מירכאות או סוגריים מרובעים. היא תקבל ביד קופסה נקייה ומסודרת של <code>foreach-exp</code> שאפשר לחלץ ממנה בקלות את כל מה שצריך כדי להריץ את הלולאה.`,

            "step2_1": `כאן אנחנו מגדירים את ה-DNA של כל הערכים שהשפה שלנו יודעת להחזיק בזמן ריצה. אנחנו מגדירים טיפוס נתונים חדש ב-Scheme בשם <code>expval</code> (בעזרת <code>define-datatype</code>, כלי של הסביבה שלנו). אנחנו רואים את הקופסאות הקיימות: אריזה למספרים (<code>num-val</code>), אריזה לבוליאנים (<code>bool-val</code>) ואריזה לפרוצדורות/פונקציות (<code>proc-val</code>). כל אחת שומרת בתוכה את סוג המידע הספציפי שמתאים לה.`,

            "step2_2": `זו התוספת הקריטית. אנחנו יוצרים סוג חדש של קופסה במפעל: <code>list-val</code>.<br>שים לב היטב להגדרת התוכן שלה: <code>(list-of expval?)</code>. אנחנו <strong>לא</strong> אומרים שהיא שומרת סתם רשימה של איברים (כמו מספרים רגילים). אנחנו דורשים במפורש שזו תהיה רשימה שכל איבר בה הוא בעצמו קופסת <code>expval</code> חוקית!<br>זו בדיוק בבושקת הקופסאות מהמודל שלנו. אם יש לנו רשימה של מספרים <code>[1, 2]</code>, בפועל בזיכרון היא תיראה כך:<br><code>(list-val (list (num-val 1) (num-val 2)))</code>. זה מבטיח אחידות מוחלטת בכל רחבי המפרש.`,

            "step2_3": `אנחנו מתחילים להגדיר את "פותחן הקופסאות" החדש שלנו. הפונקציה הזו מקבלת קופסה סטנדרטית כלשהי ושומרת אותה במשתנה <code>v</code>.<br>פקודת ה-<code>cases</code> היא הדרך של Scheme לבדוק את ה"מדבקה" שעל הקופסה. המפרש בוחן את הערך <code>v</code> כדי לראות איזה סוג של <code>expval</code> הוא באמת.`,

            "step2_4": `במקרה הטוב, המדבקה על הקופסה היא אכן <code>list-val</code>. אם זה המצב, אנחנו "פותחים" את הקופסה, שולפים מתוכה את התוכן הפנימי (שהוא הרשימה של אובייקטי ה-<code>expval</code>), קוראים לו <code>lst</code>, ופשוט מחזירים אותו החוצה אל מי שקרא לפונקציה. חילצנו את המידע האמיתי מתוך עטיפת זמן-הריצה.`,

            "step2_5": `כאן נמצא מנגנון ההגנה על הקוד שלנו (Type checking בזמן ריצה). אם שלחנו לפותחן הקופסאות של הרשימות קופסה שעליה מדבקה של מספר (למשל <code>num-val</code>), ה-<code>cases</code> יגיע ל-<code>else</code>.<br>בשלב הזה הפונקציה עוצרת את התוכנית וזורקת שגיאה: "ניסית לחלץ רשימה מתוך ערך שהוא בכלל לא רשימה!". זה מה שמונע מהמפרש שלנו לקרוס בצורה לא נשלטת אם המתכנת כותב קוד חסר היגיון (כמו לנסות לעשות איטרציה על המספר 5 במקום על רשימה).`,

            "step3_1": `זוהי תבנית ה-<code>cases</code> בתוך <code>value-of</code>. המפרש מזהה שהוא עומד מול צומת מסוג <code>foreach-exp</code> (הקופסה שיצרנו מקודם ב-Parser). הוא פותח אותה ושולף מתוכה ארבעה רכיבים: הטיפוס המוצהר (<code>typ</code>), שם משתנה האיטרציה (<code>id</code>), רשימת הביטויים שעליהם נרוץ (<code>exps</code>), וגוף הלולאה (<code>body</code>). בשלב זה, <code>exps</code> הם עדיין חתיכות עץ תחביר שלא חושבו (AST Nodes).`,

            "step3_2": `זהו אחד השלבים החשובים ביותר בקוד – שלב ההערכה המוקדמת. אנחנו לא מתחילים את הלולאה מיד! במקום זאת, אנחנו משתמשים בפונקציית <code>map</code> של Scheme כדי לעבור על כל ביטוי (x) בתוך רשימת ה-<code>exps</code>, ושולחים אותו לפונקציה <code>value-of</code> כדי שיחושב בסביבה הנוכחית (<code>env</code>).<br>המשתנה החדש <code>vals</code> מחזיק כעת רשימה של <strong>ערכים אמיתיים</strong> (קופסאות <code>expval</code> כמו <code>num-val</code> או <code>bool-val</code>), ולא עצים מופשטים. כל הביטויים כבר "נפתרו".`,

            "step3_3": `תנאי עצירה מוקדם (Edge case). המפרש בודק – האם בכלל יש לי על מה לרוץ? אם רשימת הביטויים המקורית ריקה, הלולאה לא צריכה לקרות. אנחנו מיד מחזירים קופסת <code>list-val</code> שמכילה בתוכה רשימה ריקה של Scheme (<code>'()</code>), ובזה סיימנו.`,

            "step3_4": `בהנחה שיש איברים ברשימה, אנחנו פונים אל משתנה ה-<code>typ</code>. זוכר את משפחת ה-<code>type</code> שהגדרנו ב-<code>the-grammar</code>? כאן אנחנו עושים עליה <code>cases</code> כדי לנתב את המשך הביצוע (Type Dispatch).`,

            "step3_5": `אם המתכנת הצהיר שלולאת ה-<code>foreach</code> צריכה לרוץ על שלמים (<code>int</code>), אנחנו קוראים לפונקציית עזר ייעודית בשם <code>apply-only-num</code> (שכנראה מוגדרת בהמשך הקוד שלך ותפקידה לבדוק שכל איבר הוא באמת מספר לפני ביצוע הגוף).<br>שים לב לפרמטר האחרון והקריטי שאנחנו מעבירים לה: <code>(list-val '())</code>. זהו האוגר (Accumulator). אנחנו מוסרים לפונקציה "קופסת רשימה ריקה", כדי שבמהלך הריצה הרקורסיבית שלה על איברי הלולאה, היא תוכל לאסוף את כל תוצאות גוף הלולאה (<code>body</code>) לתוך הקופסה הזו, ולהחזיר אותה בסוף המהלך.`,

            "step3_6": `אותו היגיון בדיוק, רק עבור טיפוסים אחרים. אם הטיפוס הוא בוליאני, שולחים לפונקציה שאחראית על בוליאנים, ואם פונקציה – לפונקציה שאחראית על פונקציות. ההפרדה הזו מאפשרת אכיפת טיפוסים (Type Checking) קפדנית לכל סוג בנפרד במהלך האיטרציה.`,

            "step4_1": `אנחנו מגדירים את פונקציית המפקח שלנו לבדיקת מספרים, <code>is-Num-val?</code>. הפונקציה מקבלת פרמטר אחד <code>v</code>, שהוא קופסה תקנית כלשהי מסוג <code>expval</code> (שחושבה קודם לכן על ידי <code>value-of</code>).<br>המפקח מסתכל על הקופסה <code>v</code>. ה-<code>cases</code> בודק איזו "מדבקה" (Variant) מודבקת על גבי מבנה הנתונים הזה.`,

            "step4_2": `זהו מקרה ההצלחה. אם המפרש רואה שהמדבקה היא אכן <code>num-val</code>, הוא מזהה שיש בפנים מספר פנימי (שנקרא לו <code>n</code>). <strong>אבל שים לב:</strong> אנחנו בכלל לא עושים שום דבר עם <code>n</code>! לא מעניין אותנו איזה מספר יש בפנים (האם זה 5 או 100), מעניין אותנו רק שזה אכן מספר. לכן, אנחנו פשוט מחזירים מיד את הערך הבוליאני <code>#t</code> (True).`,

            "step4_3": `רשת הביטחון הקריטית. במקום ה-<code>cases</code> הרגיל של פונקציות החילוץ (ששם ה-<code>else</code> זרק שגיאת <code>expval-extractor-error</code>), כאן אנחנו משתמשים ב-<code>else</code> כדי להחזיר בשקט <code>#f</code> (False). אם הקופסה הייתה פונקציה (<code>proc-val</code>) או רשימה (<code>list-val</code>), הקוד פשוט יענה "לא, זה לא מספר" וימשיך הלאה.`,

            "step5_1": `הגדרת הפונקציה (הפועל שלנו). היא מקבלת את שם המשתנה (<code>id</code>), את רשימת הערכים שעליהם נרוץ (<code>vals</code>), את גוף הלולאה שמחכה לביצוע (<code>body</code>), את הסביבה הנוכחית של התוכנית שבה כל המשתנים האחרים שמורים (<code>env</code>), ואת האוגר שלנו שצובר את התוצאות (<code>lst</code>).`,

            "step5_2": `תנאי העצירה של הרקורסיה (המסוע ריק). אם אין יותר איברים ברשימת ה-<code>vals</code> שלנו, סיימנו את העבודה. אנחנו פשוט מחזירים את <code>lst</code> – העגלה שלנו, שכבר מכילה בתוכה את כל התוצאות שנאספו עד כה, ארוזות יפה בתוך <code>list-val</code>.`,

            "step5_3": `כאן אנחנו משתמשים בפונקציית המפקח מהקוד הקודם! אנחנו בודקים רק את האיבר הראשון שעומד בתור <code>(car vals)</code>. אם הוא אכן מספר (הפונקציה תחזיר <code>#t</code>), אנחנו נכנסים לבלוק הביצוע האמיתי.`,

            "step5_4": `זהו רגע קריטי של ניהול סביבות (Lexical Scoping). אנחנו לא משנים את הסביבה המקורית! אנחנו יוצרים "תא עבודה" חדש (<code>new-env</code>) שמרחיב את הסביבה הקיימת. בסביבה החדשה הזו, אנחנו קושרים את שם המשתנה של הלולאה (למשל <code>x</code>) לערך הנוכחי <code>(car vals)</code>. רק כך גוף הלולאה יידע מי זה <code>x</code> כשהוא ירוץ.`,

            "step5_5": `קריאה למנוע הביצוע. אנחנו שולחים את גוף הלולאה (<code>body</code>) לחישוב ב-<code>value-of</code>, אבל שים לב – אנחנו מעבירים לו את הסביבה החדשה שיצרנו (<code>new-env</code>)! מנוע הביצוע ירוץ, ימצא את הערך של <code>id</code>, ויחזיר לנו קופסת <code>expval</code> חדשה שהיא התוצאה של האיטרציה הזו. אנחנו שומרים אותה ב-<code>new-cell</code>.`,

            "step5_6": `ניהול העגלה. האוגר <code>lst</code> שלנו הוא כרגע קופסה סגורה מסוג <code>list-val</code>. אי אפשר להוסיף אליה איברים ישירות ב-Scheme. אז אנחנו משתמשים ב"פותחן" שלנו (<code>expval->list</code>) כדי להפוך אותה לרשימת Scheme רגילה (<code>temp-lst</code>). לאחר מכן, אנחנו משתמש בפקודה <code>append</code> כדי לשרשר את התוצאה החדשה שיצרנו (<code>new-cell</code>) לסוף הרשימה הקיימת, ושומרים את הרשימה המעודכנת ב-<code>up-list</code>.`,

            "step5_7": `ההתקדמות בלולאה. אנחנו קוראים לפונקציה של עצמנו שוב (רקורסיה). הפעם אנחנו מעבירים את שאר הרשימה <code>(cdr vals)</code>, ואנחנו אורזים מחדש את הרשימה המעודכנת שלנו לתוך קופסה תקנית <code>(list-val up-list)</code> כדי שהאוגר ימשיך לעבור בצורה תקינה. שים לב שאנחנו מעבירים את ה-<code>env</code> המקורי, לא את ה-<code>new-env</code>, כי כל איטרציה צריכה לקבל סביבה נקייה משלה!`,

            "step5_8": `זהו פרט תכנוני מרתק של השפה שלך. מה קורה אם האיבר הוא <em>לא</em> מספר? במקום לזרוק שגיאה ולעצור את התוכנית, בחרת כאן לממש מנגנון של <strong>סינון שקט</strong>. אם נכנסנו ל-<code>else</code>, אנחנו פשוט קוראים לרקורסיה עם המשך הרשימה <code>(cdr vals)</code>, ומעבירים הלאה את האוגר הקיים כפי שהוא (<code>lst</code>), מבלי לבצע את גוף הלולאה ומבלי להוסיף כלום. האיבר הלא-מתאים פשוט נעלם מהתוצאה הסופית.`

                mentalModelBefore: `<p class="mb-4">הקוד הזה לוקח אותנו אל השער הקדמי של השפה שלנו, אל תוך ה"מילון והתחביר" שלה (בתוך הגדרות ה-Parser, ככל הנראה באמצעות מנגנון כמו SLLGEN). לפני שהמפרש (Interpreter) בכלל יכול לחשב משהו, הוא חייב לדעת לקרוא את הטקסט שהמתכנת כתב ולהפוך אותו למבנה נתונים מסודר. הקוד הזה מגדיר בדיוק את החוקים האלה.</p>
                <p class="mb-4">הקוד מטפל בהרחבת השפה שלנו כך שתתמוך במערכת טיפוסים (Types) בסיסית, ובמבנה בקרה חדש ומורכב: לולאת <code>foreach</code>.</p>
                <p class="mb-4">כדי להבין מה קורה כאן, אנחנו חייבים לבנות את המודל המנטלי הנכון לפני שנצלול לשורות.</p>
                <h4 class="font-bold text-slate-800 mb-2">מפעל האריזה ופס הייצור (Abstract Syntax Tree)</h4>
                <p class="mb-2">תאר לעצמך מפעל שמקבל משאיות עמוסות באותיות וסמלים בתפזורת (קוד המקור שהמתכנת הקליד כטקסט). המטרה של המפעל היא לא <em>להפעיל</em> את המכונות, אלא למיין את החלקים לקופסאות מסודרות עם תוויות, כדי שהפועלים בהמשך פס הייצור (פונקציית <code>value-of</code> שכבר פגשת) יידעו בדיוק מה לעשות איתם.</p>
                <p class="mb-2">הקוד ששלחת הוא למעשה <strong>ספר ההוראות (Blueprints)</strong> של המפעל הזה. ספר ההוראות אומר למכונת המיון: "אם אתה רואה את המילה השמורה 'foreach', ואחריה סוגריים, ואז מזהה, וכן הלאה - אל תעביר את זה הלאה כטקסט! במקום זאת, קח קופסה גדולה, הדבק עליה מדבקה שכתוב עליה <code>foreach-exp</code>, ושים בתוכה רק את החלקים שבאמת חשובים לפועלים".</p>
                <p>הדבר הכי חשוב להבין כאן הוא ההפרדה בין <strong>תחביר קונקרטי</strong> (המילים כמו "do" או "in", וסוגריים - שקיימים רק כדי שלבני אדם יהיה נוח לקרוא) לבין <strong>תחביר מופשט</strong> (המידע האמיתי שהמפרש צריך, כמו המשתנה עצמו או גוף הלולאה). המפעל זורק לפח את המילים השמורות, ושומר רק את המהות.</p>`,

                mentalModelAfter: `<p>הקוד הזה לא מבצע שום חישוב מתמטי ולא מריץ שום לולאה בפועל (אנחנו לא בזמן ריצה). הקוד הזה בונה את הגשר בין הקוד שהמתכנת הקליד (מחרוזות חסרות משמעות) לבין המוח המחשב של המפרש (עץ תחביר מופשט). על ידי הגדרת הטיפוסים והתבנית של ה-<code>foreach</code>, לימדנו את המפרש כיצד נראה המבנה החדש, איזה מידע חשוב לשלוף מתוכו (טיפוס משתנה הלולאה, שמו, הרשימה לרוץ עליה, והגוף לביצוע), ואיך לקרוא לו (<code>foreach-exp</code>) כדי שנוכל לטפל בו בתוך שלב ה-<code>value-of</code> שבו מתרחש הקסם האמיתי של הלוגיקה.</p>`

;; ומשתמשות בפרדיקטים הרלוונטיים עבורן)`,
                mentalModelAfter: `<p>הפונקציה <code>apply-only-num</code> היא הלב הפועם של הלולאה המקוננת שיצרנו. היא רצה איבר-איבר מהסוף להתחלה בעזרת רקורסיה, בודקת באופן פעיל את טיפוס הנתונים כדי לסנן רעשים (Type Filtering), ומייצרת סביבת זיהוי משתנים נקייה וזמנית לכל ריצה וריצה בנפרד. במקביל, היא מנהלת אוגר (Accumulator) שאליו היא דוחפת את התוצאות אחת אחרי השנייה. כשהרקורסיה מסתיימת, מה שחוזר החוצה אל ה-<code>value-of</code> הראשי שלנו זו קופסה יחידה ומסודרת של <code>list-val</code> המכילה את כל התוצאות של הלולאה, מוכנה להמשך השימוש בתוכנית.</p>`
            },
            {
                id: "final",
                title: "הפתרון המלא ברצף",
                isFinal: true
            }
        ];

        let currentStep = 0;
        let tooltipState = 3; // 1 = none, 2 = click, 3 = hover

        const tooltipConfig = {
            1: { icon: "fa-code", text: "ללא הסברים", color: "text-slate-400", glow: "via-slate-500", glowOp: "opacity-30" },
            2: { icon: "fa-hand-pointer", text: "מופעל - בלחיצה", color: "text-emerald-400", glow: "via-emerald-400", glowOp: "opacity-70" },
            3: { icon: "fa-mouse-pointer", text: "מופעל - בריחוף", color: "text-primary", glow: "via-primary", glowOp: "opacity-70" }
        };

        const stepTitle = document.getElementById('step-title');
        const stepNumberBadge = document.getElementById('step-number-badge');
        const stepExplanation = document.getElementById('step-explanation');
        const codeContainer = document.getElementById('code-container');
        const codeBlock = document.getElementById('code-block');
        const fileName = document.getElementById('file-name');
        const stepAfterExplanation = document.getElementById('step-after-explanation');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const stepList = document.getElementById('step-list');
        const stepCounter = document.getElementById('step-counter');
        const contentContainer = document.getElementById('content-container');

        // Handle custom image upload for step 0
        document.addEventListener('change', function (e) {
            if (e.target && e.target.id === 'image-upload-input') {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (event) {
                        const img = document.getElementById('step-0-image');
                        img.src = event.target.result;
                        img.style.display = 'block';
                        document.getElementById('image-upload-fallback').style.display = 'none';
                        localStorage.setItem('q1_2025c_83_image', event.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            }
        });

        function updateCyclerUI() {
            const config = tooltipConfig[tooltipState];

            const btn = document.getElementById('tooltip-cycler');
            const icon = document.getElementById('cycler-icon');
            const text = document.getElementById('cycler-text');
            const glow = document.getElementById('cycler-glow');

            // Animation reset
            btn.classList.remove('cycler-anim');
            void btn.offsetWidth; // trigger reflow
            btn.classList.add('cycler-anim');

            icon.className = `fa-solid ${config.icon} text-3xl ${config.color} transition-transform group-hover:scale-110 drop-shadow-[0_0_8px_rgba(255,255,255,0.1)]`;
            text.textContent = config.text;

            glow.className = `absolute bottom-0 left-0 w-full h-[3px] bg-gradient-to-r from-transparent ${config.glow} to-transparent ${config.glowOp} transition-all duration-300`;

            initTooltips();
        }

        function cycleTooltipState() {
            tooltipState = tooltipState === 3 ? 1 : tooltipState + 1;
            localStorage.setItem('globalTooltipState', tooltipState);
            updateCyclerUI();
        }

        // Modal Functions
        function openModal(codeText, explanationHtml) {
            const modal = document.getElementById('explanation-modal');
            const modalCard = document.getElementById('modal-card');
            const modalCode = document.getElementById('modal-code');
            const modalExplanation = document.getElementById('modal-explanation');

            modalCode.textContent = codeText.replace(/^\n+|\n+$/g, '');
            Prism.highlightElement(modalCode);
            modalExplanation.innerHTML = explanationHtml;

            modal.classList.remove('hidden');
            // Trigger reflow for animation
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            modalCard.classList.remove('scale-95');
            modal.classList.add('flex');
        }

        function closeModal(event, force = false) {
            if (event && !force) {
                // If they clicked directly on the modal backdrop, close it.
                if (event.target !== document.getElementById('explanation-modal')) {
                    return;
                }
            }

            const modal = document.getElementById('explanation-modal');
            const modalCard = document.getElementById('modal-card');

            modal.classList.add('opacity-0');
            modalCard.classList.add('scale-95');

            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        function initTooltips() {
            // Reset state
            const marks = document.querySelectorAll('mark.interactive-tooltip');

            marks.forEach(m => {
                m.classList.remove('tooltip-active-style');
                m.style.pointerEvents = 'none';

                // Remove old listeners by cloning
                const newMark = m.cloneNode(true);
                m.parentNode.replaceChild(newMark, m);
            });

            if (tooltipState === 1) return;

            const freshMarks = document.querySelectorAll('mark.interactive-tooltip');
            freshMarks.forEach(m => {
                m.classList.add('tooltip-active-style');
                m.style.pointerEvents = 'auto';

                const explanationKey = m.getAttribute('data-key');
                const explanation = explanationsDict[explanationKey] || "הסבר חסר";
                const codeText = m.textContent;

                if (tooltipState === 2) {
                    m.addEventListener('click', () => openModal(codeText, explanation));
                } else if (tooltipState === 3) {
                    m.addEventListener('mouseenter', () => {
                        clearCloseTimer();
                        openModal(codeText, explanation);
                    });
                    m.addEventListener('mouseleave', () => {
                        startCloseTimer();
                    });
                }
            });
        }

        function toggleAccordion(id) {
            const content = document.getElementById('acc-content-' + id);
            const icon = document.getElementById('acc-icon-' + id);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                content.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        function renderSidebar() {
            stepList.innerHTML = '';
            steps.forEach((step, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${index === currentStep ? 'active-nav' : ''}`;
                btn.onclick = () => goToStep(index);
                btn.innerHTML = `<span>${step.id === 'final' ? '<i class="fa-solid fa-flag-checkered mr-2"></i> ' : (index) + ': '}${step.title}</span>`;
                stepList.appendChild(btn);
            });
        }

        function updateUI() {
            const step = steps[currentStep];

            stepNumberBadge.textContent = step.isFinal ? "שלב סופי" : ("תחנה " + currentStep);
            stepTitle.textContent = step.title;
            stepExplanation.innerHTML = '';
            stepAfterExplanation.innerHTML = '';
            codeContainer.classList.add('hidden');

            if (step.isImageOnly) {
                const savedImg = localStorage.getItem('q1_2025c_83_image');
                const imgSrc = savedImg ? savedImg : step.imageSrc;

                stepExplanation.innerHTML = `
                <div class="text-center">
                    <img id="step-0-image" src="${imgSrc}" class="max-w-full h-auto rounded-xl shadow-lg border border-slate-200 mx-auto" onerror="this.style.display='none'; document.getElementById('image-upload-fallback').style.display='block';">
                    <div id="image-upload-fallback" class="hidden mt-4 p-8 border-2 border-dashed border-slate-300 rounded-xl bg-slate-50">
                        <i class="fa-regular fa-image text-4xl text-slate-400 mb-3"></i>
                        <p class="text-slate-500 mb-4 font-bold text-lg">תמונת השאלה חסרה</p>
                        <p class="text-slate-400 mb-6 text-sm">אנא בחר את קובץ התמונה שהורדת כדי להציג אותו כאן. (התמונה תישמר בדפדפן שלך לתמיד!)</p>
                        <input type="file" id="image-upload-input" accept="image/*" class="block w-full max-w-xs mx-auto text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-blue-50 file:text-primary hover:file:bg-blue-100 cursor-pointer">
                    </div>
                </div>`;
            } else if (step.isFinal) {
                let html = '<div class="space-y-12">';
                steps.forEach(s => {
                    if (s.code && !s.isFinal) {
                        html += `
                        <div>
                            <h3 class="text-xl font-bold text-slate-800 mb-4">${s.title}</h3>
                            <div class="code-window">
                                <div class="code-window-header ltr" dir="ltr">
                                    <div class="mac-buttons">
                                        <div class="mac-btn mac-close"></div>
                                        <div class="mac-btn mac-min"></div>
                                        <div class="mac-btn mac-max"></div>
                                    </div>
                                    <div class="code-filename"><i class="fa-solid fa-code mr-2"></i>${s.filename}</div>
                                </div>
                                <div class="code-body ltr text-left" dir="ltr">
                                    <pre><code class="language-scheme">${s.code}</code></pre>
                                </div>
                            </div>
                        </div>
                        `;
                    }
                });
                html += '</div>';
                stepExplanation.innerHTML = html;
                Prism.highlightAllUnder(stepExplanation);
            } else {
                if (step.mentalModelBefore) {
                    stepExplanation.innerHTML = `
                    <button onclick="toggleAccordion('before')" class="accordion-btn rounded-xl bg-purple-50 text-purple-900 border-purple-200 hover:bg-purple-100 flex items-center justify-between p-4 w-full font-bold mb-6 border border-dashed border-purple-300 shadow-sm">
                       <span><i class="fa-solid fa-brain mr-2 ml-2"></i> מודל מנטלי לפני הקוד</span>
                       <i id="acc-icon-before" class="fa-solid fa-chevron-down transition-transform"></i>
                    </button>
                    <div id="acc-content-before" class="hidden bg-white border border-purple-100 p-6 rounded-xl shadow-sm mb-6 text-slate-700 leading-relaxed text-[1.05rem]">
                        ${step.mentalModelBefore}
                    </div>`;
                }

                if (step.code) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-solid fa-code mr-2"></i>${step.filename}`;
                    codeBlock.innerHTML = step.code;
                    Prism.highlightElement(codeBlock);

                    if (step.mentalModelAfter) {
                        stepAfterExplanation.innerHTML = `
                        <button onclick="toggleAccordion('after')" class="accordion-btn rounded-xl bg-indigo-50 text-indigo-900 border-indigo-200 hover:bg-indigo-100 flex items-center justify-between p-4 w-full font-bold mb-4 mt-8 border border-dashed border-indigo-300 shadow-sm">
                           <span><i class="fa-solid fa-lightbulb mr-2 ml-2"></i> סיכום לאחר הקוד</span>
                           <i id="acc-icon-after" class="fa-solid fa-chevron-down transition-transform"></i>
                        </button>
                        <div id="acc-content-after" class="hidden bg-white border border-indigo-100 p-6 rounded-xl shadow-sm mb-6 text-slate-700 leading-relaxed text-[1.05rem]">
                            ${step.mentalModelAfter}
                        </div>`;
                    }
                }
            }

            prevBtn.disabled = currentStep === 0;
            stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;

            if (currentStep === steps.length - 1) {
                nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
            } else {
                nextBtn.innerHTML = 'המשך <i class="fa-solid fa-arrow-left mr-2"></i>';
            }

            renderSidebar();

            setTimeout(() => {
                initTooltips();
            }, 50);

            contentContainer.classList.remove('fade-enter');
            contentContainer.classList.add('fade-enter-active');
        }

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-collapsed');
            const isCollapsed = document.body.classList.contains('sidebar-collapsed');
            localStorage.setItem('sidebarCollapsed', isCollapsed);

            // Update icon direction
            const icon = document.getElementById('sidebar-toggle-icon');
            if (isCollapsed) {
                icon.className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            } else {
                icon.className = 'fa-solid fa-chevron-right text-lg transition-transform duration-300';
            }
        }

        function init() {
            // Restore tooltip state from localStorage
            const savedState = localStorage.getItem('globalTooltipState');
            if (savedState) {
                tooltipState = parseInt(savedState);
            }
            updateCyclerUI();

            // Create and inject sidebar toggle button
            const toggleBtn = document.createElement('button');
            toggleBtn.id = 'sidebar-toggle-btn';
            toggleBtn.onclick = toggleSidebar;
            toggleBtn.innerHTML = '<i id="sidebar-toggle-icon" class="fa-solid fa-chevron-right text-lg transition-transform duration-300"></i>';
            document.body.appendChild(toggleBtn);

            // Load sidebar collapsed state from localStorage
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (isCollapsed) {
                document.body.classList.add('sidebar-collapsed');
                document.getElementById('sidebar-toggle-icon').className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            }

            updateUI();
        }

        init();
    </script>
    <script src="ai_widget.js"></script>
</body>

</html>
