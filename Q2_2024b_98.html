                    <p class="mb-4">במבחן זה (מועד א (98) 2024ב), אנו נדרשים להרחיב את שפת <strong>Implicit-Refs</strong> עם יכולות של <strong>מצביעים רב-מימדיים (Multidimensional Pointers)</strong> וגישה לנתונים דרכם.</p>

                        <h4 class="font-bold text-blue-900 text-base mb-2">דרישות השפה החדשות והתחביר:</h4>
                        <div class="bg-white p-3 rounded border border-blue-100 font-mono text-sm mb-4 ltr text-left">
Expression ::= { &amp; }+ (Expression) [multiptr-exp]<br>
Expression ::= { * }+ (Expression) [multistar-exp]<br>
Expression ::= option identifier = Expression [assign-exp]<br>
Option ::= &epsilon; | @
                        </div>
                        <ul class="list-disc list-inside text-sm text-blue-900 space-y-2">
                            <li><code>{ &amp; }+(data)</code>: יוצר מצביע רב-מימדי לנתון. כמות סימני ה-<code>&amp;</code> מציינת את מימד המצביע (מצביע למצביע וכו').</li>
                            <li><code>{ * }+(v)</code>: פונה לנתון המוצבע. כמות הכוכביות מציינת כמה שלבים להתקדם. מחזיר את הנתון או מצביע ביניים, או שגיאה אם חרגנו מהמימדיות.</li>
                            <li><code>set @ id = val</code>: מעדכן את הנתון המוצבע בקצה של המצביע הרב-מימדי <code>id</code>. אם ה-option ריק, מתפקד כ-set רגיל.</li>
                        </ul>
                    </div>

                    <h3 class="text-xl font-bold text-slate-800 mb-3 border-b pb-2">מה אנחנו מחפשים ומנתחים בשלב זה?</h3>
                    <ul class="space-y-3 text-slate-700">

                        </li>
                        <li>
                            <span class="font-semibold text-slate-900">2. ייצוג המצביע הרב-מימדי בזיכרון:</span> 
                            מצביע מיוצג בזמן ריצה כסוג ערך מבוטא (ExpVal) חדש שמכיל את תא הזיכרון (Reference) ואת מימדיות המצביע (Dimension).
                        </li>
                        <li>
                            <span class="font-semibold text-slate-900">3. עקרון ה-Mutation ב-assign-exp המעודכן:</span> 
                            כאשר ה-option הוא <code>@</code>, עלינו לעבור לאורך שרשרת המצביעים, לשלוף את ה-Reference הפנימי ביותר שמחזיק את המידע האמיתי, ולעדכן אותו עם <code>setref!</code>.

                    <p class="mb-4">נוסיף את חוקי הדקדוק למנתח התחבירי. נדרש פתרון יצירתי כדי לייצג את דרישת ה-"לפחות מופע אחד" (סימן ה-<code>+</code>).</p>
                    
                    <div class="template-box">

                        </p>
                    </div>

                    <h3 class="text-lg font-bold text-slate-800 mb-2">עקרונות הגדרת הדקדוק:</h3>
                    <ul class="list-disc list-inside text-sm text-slate-700 space-y-2 mb-4">
                        <li><strong>למה לא להשתמש ב-(arbno "&amp;") ישירות?</strong> אם היינו משתמשים ב-<code>(arbno "&amp;")</code> ישירות בביטוי, ה-Parser לא היה מייצר לנו ייצוג מופשט תחת AST של רשימת סימנים שניתן לחשב את אורכה. הפרדה לטיפוס עזר (כמו <code>ptr</code>) מאפשרת ל-Racket לאסוף אותם לרשימת עצים ולספור אותם בריצה.</li>
                        <li><strong>הגדרת מחרוזת ריקה (&epsilon;):</strong> מיוצגת בדקדוק על ידי חוק <code>option</code> ריק ללא תווים: <code>(option () default-opt)</code>.</li>
                    </ul>
                `,
                code: `(expression
  ("&" (arbno ptr) "(" expression ")")
  multiptr-exp)

(expression
  ("*" (arbno star) "(" expression ")")
  multistar-exp)

(ptr
  ("&")
  pptr)

(star
  ("*")
  sstar)

;; עדכון ביטוי ההשמה הקיים:
(expression
  ("set" option identifier "=" expression)
  assign-exp)

;; הגדרת ה-option:
(option
  ("@")
  ptr-opt)

(option
  ()
  default-opt)`
            },
            {
                id: 2,
                title: "שלב 2: עדכון מבני נתונים (data-structures.scm)",
                filename: "data-structures.scm",
                explanation: `
                    <p class="mb-4">אירוע יצירת מצביע רב-מימדי מחזיר ערך מטיפוס חדש בזמן ריצה. לכן עלינו להרחיב את ה-Expressed Values של השפה.</p>

                    </div>

                    <p class="text-slate-700 text-sm mb-4">
                        שדות ה-Variant החדש מוגדרים מפורשות. אנו זקוקים למחלצים <code>expval->ptr-ref</code> ו-<code>expval->ptr-dim</code> על מנת לקלף את האריזה בזמן ריצה ולבצע את פעולות ההתקדמות בשרשרת.
                    </p>
                `,
                code: `;; נוסיף ל- expval ב- data-structures.scm את ptr-val:
(define-datatype expval expval?
  ...
  (ptr-val
    (r reference?)
    (d number?)))

;; הגדרת מחלצי עזר (Extractors):
(define expval->ptr-ref
  (lambda (e)
    (cases expval e
      (ptr-val (r d) r)
      (else (eopl:error "Not a pointer" "~s" e)))))

(define expval->ptr-dim
  (lambda (e)
    (cases expval e
      (ptr-val (r d) d)
      (else (eopl:error "Not a pointer" "~s" e)))))`
            },

                id: 3,
                title: "שלב 3: עדכון מנוע ההערכה - multiptr-exp",
                filename: "interp.scm",
                explanation: `

                    <h3 class="text-lg font-bold text-slate-800 mb-3 border-b pb-2">דיון עיצובי חשוב: שרשרת הפניות לעומת ייצוג שטוח</h3>

                        <p><strong>גישת הייצוג השטוח (הערת הבודק):</strong></p>
                        <p>הבודק העיר בשוליים כי "לא באמת נחוץ ליצור שרשרת מצביעים לנתון. מספיק היה לשמור רפרנס יחיד לנתון המקורי, ולצידו מספר המייצג את המימד". בגישה השטוחה, <code>ptr-val</code> היה מחזיק הפניה ישירה לנתון האמיתי עם המימד $N$, וכל כוכבית הייתה פשוט מורידה את המספר $N$ ללא מעבר בזיכרון. המימוש הרקורסיבי של השרשרת מוכיח שליטה מעולה בהקצאות דינמיות ב-EOPL.</p>
                    </div>

    (let ((val (value-of data env)))

            (multiptr-exp (cdr ptrs) data) env))
           (dim (expval->ptr-dim next-ptr)))
      (ptr-val (newref next-ptr) (+ 1 dim)))))`

        (setref!
          (apply-env env id)
          (value-of newval env))

    (ptr-opt ()

             (get-underlying-ref

  (lambda (ref)
    (let* ((val (deref ref))
           (d (expval->ptr-dim val))
           (r (expval->ptr-ref val)))
      (if (= 1 d)

                btn.className = `nav-btn ${index === currentStep ? 'active-nav' : ''}`;
                btn.onclick = () => goToStep(index);
                btn.innerHTML = `<span>${index}: ${step.title}</span>`;
                stepList.appendChild(btn);
            });
        }

        function updateUI() {
            const step = steps[currentStep];

            // Fade out
            contentContainer.classList.remove('fade-enter-active');
            contentContainer.classList.add('fade-enter');

            setTimeout(() => {
                stepNumberBadge.textContent = "תחנה " + currentStep;
                stepTitle.textContent = step.title;
                stepExplanation.innerHTML = step.explanation;

                if (step.code && step.filename) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-regular fa-file-code ml-2"></i>${step.filename}`;
                    codeBlock.textContent = step.code;
                    if (window.Prism) {
                        Prism.highlightElement(codeBlock);
                    }
                } else {
                    codeContainer.classList.add('hidden');
                }

                prevBtn.disabled = currentStep === 0;
                stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;

                if (currentStep === steps.length - 1) {
                    nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
                } else {

                renderSidebar();

                // Fade in
                contentContainer.classList.remove('fade-enter');
                contentContainer.classList.add('fade-enter-active');
            }, 150);
        }

        function goToStep(index) { currentStep = index; updateUI(); }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
