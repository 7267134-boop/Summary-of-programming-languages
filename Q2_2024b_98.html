    <script>
        let hoverCloseTimer = null;

        function clearCloseTimer() {
            if (hoverCloseTimer) {
                clearTimeout(hoverCloseTimer);
                hoverCloseTimer = null;
            }
        }

        function startCloseTimer() {
            if (tooltipState !== 3) return;
            clearCloseTimer();
            hoverCloseTimer = setTimeout(() => {
                closeModal(null, true);
            }, 300); // 300ms delay to allow mouse movement to modal
        }

        // Global click listener to close modal when clicking outside in click mode
        document.addEventListener('click', (event) => {
            const modal = document.getElementById('explanation-modal');
            const modalCard = document.getElementById('modal-card');

            if (!modal.classList.contains('hidden')) {
                // If the click is NOT inside the modal-card, and NOT on an interactive tooltip
                if (!modalCard.contains(event.target) && !event.target.closest('.interactive-tooltip')) {
                    closeModal(null, true);
                }
            }
        });
        const explanationsDict = {
            
            "step1_1": `<div class="space-y-3">
                <p>כאן אנחנו מוסיפים תבנית חדשה למשפחת ה"ביטויים" (expression). התבנית הזו תזהה פקודה של <strong>יצירת מצביע (Reference)</strong>.</p>
                <p>המפרש מחפש תו חובה של <code>&amp;</code>. לאחר מכן הוא רואה את ההוראה <code>(arbno ptr)</code> – הפקודה <code>arbno</code> (קיצור של arbitrary number - מספר שרירותי) אומרת: "יכולים להופיע פה אפס או יותר מופעים של המושג ptr". זה מה שמאפשר לנו לעשות שרשרת, כמו <code>&amp;&amp;&amp;</code>. לבסוף הוא מחפש סוגריים פותחים, ביטוי כלשהו (ה-data שלנו), וסוגריים סוגרים. כשהוא מזהה את כל זה, הוא מאגד את זה בעץ התחביר לצומת שתיקרא <code>multiptr-exp</code>.</p>
            </div>`,
            
            "step1_2": `<div class="space-y-3">
                <p>זו הפעולה ההפוכה בדיוק – תבנית עבור <strong>משיכת ערך מתוך מצביע (Dereferencing)</strong>.</p>
                <p>החוקים זהים: כוכבית אחת לפחות היא חובה, אחריה יכולות לבוא עוד כוכביות ככל שנרצה <code>(arbno star)</code>, ואז ביטוי בתוך סוגריים. הזיהוי הזה, למשל של <code>***(p)</code>, ייארז בתוך צומת בשם <code>multistar-exp</code>. במודל הכספות שלנו, זה השלב שבו המתכנת כותב לקוד כמה כספות צריך לפתוח כדי להגיע ליהלום.</p>
            </div>`,
            
            "step1_3": `<div class="space-y-3">
                <p>אלו הן "אבני הבניין" (Tokens) של התבניות הקודמות. המנתח התחבירי לא מבין לבד ש-<code>ptr</code> מתכוון לסימן האמפרסנד וש-<code>star</code> מתכוון לכוכבית. בשורות אלו אנחנו ממש מצהירים: "כשאני משתמש במושג <code>ptr</code>, אני מתכוון לתו המחרוזת <code>&amp;</code>, וכשאני משתמש ב-<code>star</code>, אני מתכוון לתו <code>*</code>".</p>
            </div>`,
            
            "step1_4": `<div class="space-y-3">
                <p>שדרוג של פקודת ההשמה הרגילה בשפה. בעבר, השמה נראתה בערך כך: <code>set x = 5</code>. אבל עכשיו דחפנו "תחנת ביניים" בשם <code>option</code> בין המילה <code>set</code> לבין שם המשתנה (<code>identifier</code>). מעכשיו, הביטוי שייקרא <code>assign-exp</code> בעץ התחביר יצטרך להכיל לא רק את שם המשתנה ואת הערך, אלא גם את "סוג ההשמה" שהמתכנת בחר לעשות.</p>
            </div>`,
            
            "step1_5": `<div class="space-y-3">
                <p>אנחנו מסבירים למנתח התחבירי מה זה אותו <code>option</code> משורת ההשמה, ונותנים לו שתי אפשרויות זיהוי (פיצול נתיבים):</p>
                <ol class="list-decimal list-inside ml-4 space-y-1">
                    <li>אם הוא מזהה את התו <code>@</code>, הוא אורז את האופציה הזו תחת השם <code>ptr-opt</code>. משמעות הדבר היא שהמתכנת מבקש לבצע <strong>השמת מצביע מיוחדת</strong> (למשל: <code>set @ p = &amp;y</code>). מבחינה תפיסתית, זה לרוב אומר "אל תשנה את היהלום שבתוך הכספת, אלא תשנה את המפתח עצמו שיצביע לכספת אחרת".</li>
                    <li>אם הוא לא מזהה כלום במקום הזה (הסוגריים הריקים <code>()</code>), הוא אורז את זה תחת <code>default-opt</code>. כלומר, ברירת המחדל נשמרת. מתכנת שכותב <code>set x = 5</code> פשוט יפעיל השמה רגילה לחלוטין.</li>
                </ol>
            </div>`,
            
            "step2_1": `<div class="space-y-3">
                <p>כאן אנחנו מרחיבים את משפחת ה-<code>expval</code>. המפרש משתמש בספריה שנקראת <code>define-datatype</code> כדי להגדיר מבני נתונים. אנחנו אומרים לו: "מעכשיו, יש סוג חדש של ערך שהתוכנית יכולה להחזיק, ושמו <code>ptr-val</code>".</p>
                <p>כדי לייצר קופסת <code>ptr-val</code> חוקית, חובה להכניס לתוכה שני נתונים:</p>
                <ol class="list-decimal list-inside ml-4 space-y-1">
                    <li><code>r</code> (ה-Reference) - חייב לעבור את בדיקת <code>reference?</code>, כלומר הוא חייב להיות כתובת חוקית בזיכרון (Store) של המפרש.</li>
                    <li><code>d</code> (ה-Dimension) - חייב לעבור בדיקת <code>number?</code>, וזהו המספר השלם שמייצג את עומק המצביע (למשל, 1 עבור מצביע ישיר, 2 עבור מצביע למצביע).</li>
                </ol>
            </div>`,

            "step2_2": `<div class="space-y-3">
                <p>זהו "חולץ הפקקים" הראשון שלנו. הפונקציה הזו מקבלת קופסת נתונים כלשהי (<code>e</code>), ורוצה לשלוף מתוכה את כתובת הזיכרון בלבד.</p>
                <p>הפונקציה משתמשת ב-<code>cases</code> כדי לפתוח את הקופסה ולבדוק את הסוג שלה.</p>
                <ul class="list-disc list-inside ml-4 space-y-1">
                    <li><strong>מקרה ההצלחה:</strong> אם הקופסה היא אכן מסוג <code>ptr-val</code>, הפונקציה מפרקת אותה לשני המרכיבים שלה (<code>r</code> ו-<code>d</code>), ופשוט פולטת החוצה את <code>r</code> (הכתובת בזיכרון), תוך שהיא מתעלמת מהממד.</li>
                    <li><strong>מקרה הכישלון (else):</strong> אם נשלח לפונקציה הזו קופסה מסוג <code>num-val</code> (למשל המספר 5) ונגיד לה "תן לי את כתובת הזיכרון שלך", היא תקרוס ותדפיס שגיאה: "Not a pointer" (זה לא מצביע!). זהו מנגנון הגנה קריטי שמונע מהשפה להתבלבל בין סוגי נתונים בזמן ריצה.</li>
                </ul>

            "step2_3": `<div class="space-y-3">

            "step3_1": `<div class="space-y-3">

            "step3_2": `<div class="space-y-3">
                <p>זהו <strong>תנאי העצירה</strong> של הרקורסיה. המפרש שואל: "האם רוקנתי את כל רשימת המצביעים? האם הגעתי לתחתית השרשרת, אל היהלום עצמו?".</p>

            "step3_3": `<div class="space-y-3">

            "step3_4": `<div class="space-y-3">

            "step3_5": `<div class="space-y-3">

            "step3_6": `<div class="space-y-3">

            "step4_2": `<div class="space-y-3">

            "step4_5": `<div class="space-y-3">

            "step4_6": `<div class="space-y-3">

                } else if (tooltipState === 3) {
                    m.addEventListener('mouseenter', () => {
                        clearCloseTimer();
                        openModal(codeText, explanation);
                    });
                    m.addEventListener('mouseleave', () => {
                        startCloseTimer();
                    });
                }
            });
        }

        function toggleAccordion(id) {
            const content = document.getElementById('acc-content-' + id);
            const icon = document.getElementById('acc-icon-' + id);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                content.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        function renderSidebar() {
            stepList.innerHTML = '';
            steps.forEach((step, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${index === currentStep ? 'active-nav' : ''}`;
                btn.onclick = () => goToStep(index);
                btn.innerHTML = `<span>${step.id === 'final' ? '<i class="fa-solid fa-flag-checkered mr-2"></i> ' : (index) + ': '}${step.title}</span>`;
                stepList.appendChild(btn);
            });
        }

        function updateUI() {
            const step = steps[currentStep];

            stepNumberBadge.textContent = step.isFinal ? "שלב סופי" : ("תחנה " + currentStep);
            stepTitle.textContent = step.title;
            stepExplanation.innerHTML = '';
            stepAfterExplanation.innerHTML = '';
            codeContainer.classList.add('hidden');

            if (step.isImageOnly) {
                const savedImg = localStorage.getItem('q2_2024b_98_image');
                const imgSrc = savedImg ? savedImg : step.imageSrc;

                stepExplanation.innerHTML = `
                <div class="text-center">
                    <img id="step-0-image" src="${imgSrc}" class="max-w-full h-auto rounded-xl shadow-lg border border-slate-200 mx-auto" onerror="this.style.display='none'; document.getElementById('image-upload-fallback').style.display='block';">
                    <div id="image-upload-fallback" class="hidden mt-4 p-8 border-2 border-dashed border-slate-300 rounded-xl bg-slate-50">
                        <i class="fa-regular fa-image text-4xl text-slate-400 mb-3"></i>
                        <p class="text-slate-500 mb-4 font-bold text-lg">תמונת השאלה חסרה</p>
                        <p class="text-slate-400 mb-6 text-sm">אנא בחר את קובץ התמונה שהורדת כדי להציג אותו כאן. (התמונה תישמר בדפדפן שלך לתמיד!)</p>
                        <input type="file" id="image-upload-input" accept="image/*" class="block w-full max-w-xs mx-auto text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-blue-50 file:text-primary hover:file:bg-blue-100 cursor-pointer">
                    </div>
                </div>`;
            } else if (step.isFinal) {
                let html = '<div class="space-y-12">';
                steps.forEach(s => {
                    if (s.code && !s.isFinal) {
                        html += `
                        <div>
                            <h3 class="text-xl font-bold text-slate-800 mb-4">${s.title}</h3>
                            <div class="code-window">
                                <div class="code-window-header ltr" dir="ltr">
                                    <div class="mac-buttons">
                                        <div class="mac-btn mac-close"></div>
                                        <div class="mac-btn mac-min"></div>
                                        <div class="mac-btn mac-max"></div>
                                    </div>
                                    <div class="code-filename"><i class="fa-solid fa-code mr-2"></i>${s.filename}</div>
                                </div>
                                <div class="code-body ltr text-left" dir="ltr">
                                    <pre><code class="language-scheme">${s.code}</code></pre>
                                </div>
                            </div>
                        </div>
                        `;
                    }
                });
                html += '</div>';
                stepExplanation.innerHTML = html;
                Prism.highlightAllUnder(stepExplanation);
            } else {
                if (step.mentalModelBefore) {
                    stepExplanation.innerHTML = `
                    <button onclick="toggleAccordion('before')" class="accordion-btn rounded-xl bg-purple-50 text-purple-900 border-purple-200 hover:bg-purple-100 flex items-center justify-between p-4 w-full font-bold mb-6 border border-dashed border-purple-300 shadow-sm">
                       <span><i class="fa-solid fa-brain mr-2 ml-2"></i> מודל מנטלי לפני הקוד</span>
                       <i id="acc-icon-before" class="fa-solid fa-chevron-down transition-transform"></i>
                    </button>
                    <div id="acc-content-before" class="hidden bg-white border border-purple-100 p-6 rounded-xl shadow-sm mb-6 text-slate-700 leading-relaxed text-[1.05rem]">
                        ${step.mentalModelBefore}
                    </div>`;
                }

                if (step.code) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-solid fa-code mr-2"></i>${step.filename}`;
                    codeBlock.innerHTML = step.code;
                    Prism.highlightElement(codeBlock);

                    if (step.mentalModelAfter) {
                        stepAfterExplanation.innerHTML = `
                        <button onclick="toggleAccordion('after')" class="accordion-btn rounded-xl bg-indigo-50 text-indigo-900 border-indigo-200 hover:bg-indigo-100 flex items-center justify-between p-4 w-full font-bold mb-4 mt-8 border border-dashed border-indigo-300 shadow-sm">
                           <span><i class="fa-solid fa-lightbulb mr-2 ml-2"></i> סיכום לאחר הקוד</span>
                           <i id="acc-icon-after" class="fa-solid fa-chevron-down transition-transform"></i>
                        </button>
                        <div id="acc-content-after" class="hidden bg-white border border-indigo-100 p-6 rounded-xl shadow-sm mb-6 text-slate-700 leading-relaxed text-[1.05rem]">
                            ${step.mentalModelAfter}
                        </div>`;
                    }
                }
            }

            prevBtn.disabled = currentStep === 0;
            stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;

            if (currentStep === steps.length - 1) {
                nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
            } else {
                nextBtn.innerHTML = 'המשך <i class="fa-solid fa-arrow-left mr-2"></i>';
            }

            renderSidebar();

            setTimeout(() => {
                initTooltips();
            }, 50);

            contentContainer.classList.remove('fade-enter');
            contentContainer.classList.add('fade-enter-active');
        }

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-collapsed');
            const isCollapsed = document.body.classList.contains('sidebar-collapsed');
            localStorage.setItem('sidebarCollapsed', isCollapsed);

            // Update icon direction
            const icon = document.getElementById('sidebar-toggle-icon');
            if (isCollapsed) {
                icon.className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            } else {
                icon.className = 'fa-solid fa-chevron-right text-lg transition-transform duration-300';
            }
        }

        function init() {
            // Restore tooltip state from localStorage
            const savedState = localStorage.getItem('globalTooltipState');
            if (savedState) {
                tooltipState = parseInt(savedState);
            }
            updateCyclerUI();

            // Create and inject sidebar toggle button
            const toggleBtn = document.createElement('button');
            toggleBtn.id = 'sidebar-toggle-btn';
            toggleBtn.onclick = toggleSidebar;
            toggleBtn.innerHTML = '<i id="sidebar-toggle-icon" class="fa-solid fa-chevron-right text-lg transition-transform duration-300"></i>';
            document.body.appendChild(toggleBtn);

            // Load sidebar collapsed state from localStorage
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (isCollapsed) {
                document.body.classList.add('sidebar-collapsed');
                document.getElementById('sidebar-toggle-icon').className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            }

            updateUI();
        }

        init();
    </script>
    <script src="ai_widget.js"></script>
</body>

</html>
