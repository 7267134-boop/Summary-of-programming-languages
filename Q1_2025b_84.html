                        <div class="bg-white p-3 rounded border border-blue-100 font-mono text-sm mb-4 ltr text-left">
Expression ::= enum { {Identifier }+(,) }<br>
Expression ::= &lt; Expression . Identifier &gt;<br>
Expression ::= match [ Identifier :: Expression ] { ?identifier => Expression ; }+
                        </div>
                        <ul class="list-disc list-inside text-sm text-blue-900 space-y-2">
                            <li><code>enum { ids* }</code>: מגדיר טיפוס מנייה חדש ומחזיר ייצוג שלו בשפה (new expressed value).</li>
                            <li><code>&lt; enm.id &gt;</code>: מתייחס לאחד האיברים בתוך ה-enum ומחזיר אותו כערך מיוחד בשפה.</li>
                            <li><code>match [ enmid :: exp1 ] { ?clause => body ; }+</code>: בוחן את הערך שחזר מ-<code>exp1</code> (שהוא איבר ב-enum ששמו <code>enmid</code>) ומפעיל את גוף ההתאמה (body) המתאים.</li>

                            במבחן זה יש דרישה קריטית שנקראת <strong>Exhaustive Match (התאמה מלאה)</strong>. הבוחנים בודקים האם הסטודנט מוודא שרשימת סעיפי ההתאמה (clauses) תואמת <strong>בדיוק</strong> (בלי חוסרים ובלי עודפים) לכל האיברים שהוגדרו ב-Enum. <br>
                            בשפת EOPL אנו מיישמים זאת על ידי השוואת קבוצות (Set Equality) באמצעות בדיקה דו-כיוונית: שרשימת הסעיפים מוכלת בגרסאות ה-Enum ושגרסאות ה-Enum מוכלות ברשימת הסעיפים.

                    </div>

                    <h3 class="text-xl font-bold text-slate-800 mb-3 border-b pb-2">מה אנחנו מחפשים בכל שלב?</h3>
                    <ul class="space-y-3 text-slate-700">

                `,
                code: `;; --- מפת הדרכים הכללית לאלגוריתם ---

            },
            {
                id: 1,
                title: "שלב 1: עדכון הדקדוק (lang.scm)",

                explanation: `
                    <p class="mb-4">ה-Parser וה-Scanner צריכים לדעת לפרסר את הגדרת ה-Enum, איבר ה-Enum וביטוי ה-Match.</p>
                    
                    <div class="template-box">
                        <p class="text-emerald-900 font-medium">
                            "<strong>עדכון קובץ התחביר והדקדוק (lang.scm):</strong> נוסיף את שלושת כללי הגזירה. נשים לב לשגיאות התלמיד בכתב היד: 
                            1. בביטוי ה-match, התלמיד כתב סוגריים מסולסלים מילוליים <code>&quot;{&quot;</code> ו-<code>&quot;}&quot;</code> סביב התנאי, בזמן שהדקדוק הגדיר מפורשות סוגריים מרובעים <code>&quot;[&quot;</code> ו-<code>&quot;]&quot;</code>.
                            2. בביטוי ה-enum-elmt, התלמיד כתב נכון את הסימנים <code>&quot;&lt;&quot;</code> ו-<code>&quot;&gt;&quot;</code> כמחרוזות מילוליות שכן הם חלק מהקוד הפיזי שייכתב."
                        </p>
                    </div>

                    <h3 class="text-lg font-bold text-slate-800 mb-2">דגשים ודיוקים לוגיים:</h3>
                    <ul class="list-disc list-inside text-sm text-slate-700 space-y-2 mb-4">
                        <li><code>enum-exp</code>: מקבל רשימה מופרדת בפסיקים של מזהים.</li>
                        <li><code>enum-elmt-exp</code>: עטוף בסימני קטון-מגדול-מ מילוליים <code>&quot;&lt;&quot;</code> ו-<code>&quot;&gt;&quot;</code>.</li>
                        <li><code>match-exp</code>: משתמש ב-<code>arbno</code> של סעיפים המתחילים ב-<code>&quot;?&quot;</code> ומסתיימים בנקודה-פסיק <code>&quot;;&quot;</code>.</li>
                    </ul>
                `,
                code: `;; בקובץ lang.scm בתוך הגדרת the-grammar:

(expression
  ("enum" "{" (separated-list identifier ",") "}")
  enum-exp)

(expression
  ("<" expression "." identifier ">")
  enum-elmt-exp)

;; [תיקון שגיאת תלמיד - שימוש בסוגריים מרובעים כפי שהוגדר]:
(expression
  ("match" "[" identifier "::" expression "]" 
   (arbno "?" identifier "=>" expression ";"))
  match-exp)`
            },
            {
                id: 2,
                title: "שלב 2: עדכון מבני הנתונים (data-structures.scm)",
                filename: "data-structures.scm",
                explanation: `
                    <p class="mb-4">כדי לתמוך בטיפוס ה-Enum והאיברים שלו בזמן ריצה, עלינו להוסיף variants חדשים ל-Expressed Values.</p>
                    
                    <div class="template-box">
                        <p class="text-emerald-900 font-medium">
                            "<strong>עדכון מבני הנתונים והטיפוסים (data-structures.scm):</strong> נרחיב את ה-datatype <code>expval</code> באמצעות <code>identifier-val</code> (לייצוג איבר ה-Enum) ו-<code>enum-val</code> (לייצוג הגדרת ה-Enum). נשווה בין הדרך שבה בחר הסטודנט לייצג את ה-ADT לבין הדרך המומלצת."
                        </p>
                    </div>

                    <h3 class="text-lg font-bold text-slate-800 mb-2 font-mono">השוואת דרכי ייצוג ADT:</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4 text-sm">
                        <div class="bg-red-50 p-4 rounded-lg border border-red-200">
                            <strong class="text-red-800">❌ גרסת הסטודנט (מסורבלת):</strong>
                            <p class="font-mono mt-2 ltr text-left">
                                (define-datatype enumdt enumdt?<br>
                                &nbsp;&nbsp;(enum (vars (list-of identifier-val?))))
                            </p>
                            <p class="mt-2 text-red-950">התוצאה: אחסון רשימה של עטיפות <code>identifier-val</code> בתוך ה-enum. זה מאלץ אותנו לבצע המרת map מייגעת על פני כל הרשימה לצורך קבלת הסמלים (symbols) בזמן השוואת איברים.</p>
                        </div>
                        <div class="bg-green-50 p-4 rounded-lg border border-green-200">
                            <strong class="text-green-800">✅ הגרסה המומלצת (נקייה ותקנית):</strong>
                            <p class="font-mono mt-2 ltr text-left">
                                (define-datatype enumdt enumdt?<br>
                                &nbsp;&nbsp;(enum (vars (list-of symbol?))))
                            </p>
                            <p class="mt-2 text-green-950">התוצאה: שמירת רשימת הסמלים הגולמיים של ה-Enum באופן ישיר. מאפשר בדיקת שייכות וזהות מהירה מאוד בעזרת <code>member</code> גולמי ללא צורך במחלצים מרובים.</p>
                        </div>
                    </div>
                `,
                code: `;; בקובץ data-structures.scm:

(define-datatype enumdt enumdt?
  (enum (vars (list-of symbol?))))

;; נוסיף ל-expval:
  (identifier-val
    (v symbol?))
  (enum-val
    (v enumdt?))

;; מחלצים תואמים:
(define expval->enum
  (lambda (val)
    (cases expval val
      (enum-val (v) v)
      (else (eopl:error 'expval->enum "Not an enum: ~s" val)))))

(define expval->id
  (lambda (val)
    (cases expval val
      (identifier-val (v) v)
      (else (eopl:error 'expval->id "Not an identifier: ~s" val)))))`
            },
            {
                id: 3,
                title: "שלב 3: עדכון מנוע ההערכה (interp.scm)",
                filename: "interp.scm",
                explanation: `
                    <p class="mb-4">נוסיף ל-<code>value-of</code> את הלוגיקה בזמן ריצה עבור הגדרת Enum, שליפת איבר Enum וביטוי ה-Match.</p>
                    
                    <div class="template-box">
                        <p class="text-emerald-900 font-medium">
                            "<strong>עדכון מנוע ההערכה (value-of בקובץ interp.scm):</strong> 
                            1. ב-<code>enum-exp</code>, נבדוק שרשימת המשתנים אינה ריקה, שאין בה כפילויות, ונחזיר <code>enum-val</code>.
                            2. ב-<code>enum-elmt-exp</code>, נעריך את ביטוי ה-Enum, נוודא שהוא מייצג הגדרה תקינה של Enum, ושהמזהה המבוקש מופיע בתוך רשימת איברי ה-Enum. אם כן, נחזיר <code>identifier-val</code>.
                            3. ב-<code>match-exp</code>, נבצע בדיקת Exhaustiveness כפולה וחשובה: נוודא שרשימת הסעיפים להתאמה זהה לקבוצת האיברים המוגדרים ב-Enum, ללא כפילויות וללא חוסרים. לאחר מכן, נחלץ את אינדקס האיבר הפעיל ונבצע את הגוף התואם."
                        </p>
                    </div>

                    <h3 class="text-lg font-bold text-slate-800 mb-2">תהליך ה-Exhaustive Match:</h3>
                    <p class="text-slate-700 text-sm mb-4">
                        למה הבדיקה של הסטודנט בכתב היד היא נכונה? הסטודנט בדק: <br>
                        <code>(or (not (contain? fields pvars)) (not (contain? pvars fields)))</code> <br>
                        זוהי הגדרת <strong>שוויון קבוצות</strong> מתמטית: אם קבוצה א' מוכלת בב' וגם ב' מוכלת בא', סימן שהן זהות לחלוטין! זה מונע מצב שבו הסטודנט שכח לרשום את אחד המקרים (חסר) או רשם מקרה שלא קיים ב-Enum (עודף).
                    </p>
                `,
                code: `;; בקובץ interp.scm בתוך ה-cases של value-of:

(enum-exp (vars)
  (cond
    ((null? vars) (eopl:error 'enum-exp "empty list of vars"))
    ((has-dup? vars) (eopl:error 'enum-exp "enum has duplicates"))
    (else (enum-val (enum vars)))))

(enum-elmt-exp (enumexp var)
  (let ((enm (expval->enum (value-of enumexp env))))
    (cases enumdt enm
      (enum (vars)
        (if (not (member var vars))
            (eopl:error 'enum-elmt-exp "Not an enum var: ~s" var)
            (identifier-val var))))))

(match-exp (enumvar fieldexp fields exps)
  (let ((enumval (apply-env env enumvar)) ; שליפת הגדרת ה-Enum מהסביבה
        (fval (value-of fieldexp env)))   ; הערכת האיבר המושווה
    (cases expval enumval
      (enum-val (en)
        (cases enumdt en
          (enum (pvars)
            (let ((matched-var (expval->id fval)))
              (cond
                ((null? fields) 
                 (eopl:error 'match-exp "empty match fields list"))
                ((has-dup? fields) 
                 (eopl:error 'match-exp "duplicate match clauses not allowed"))
                ((not (member matched-var pvars)) 
                 (eopl:error 'match-exp "matched var not in enum definition"))
                ;; בדיקה דו-כיוונית שהרשימות זהות (Exhaustiveness Check)
                ((or (not (subset? fields pvars))
                     (not (subset? pvars fields)))
                 (eopl:error 'match-exp "match is not exhaustive or has invalid fields"))
                (else
                 (let ((idx (index-of matched-var fields 0)))
                   (value-of (list-ref exps idx) env))))))))
      (else (eopl:error 'match-exp "Not an enum definition: ~s" enumvar)))))`

                            2. <code>subset?</code> (המחליפה את <code>contain?</code> של התלמיד בכתב היד למניעת כפל סמלים) הבודקת האם רשימה אחת מוכלת ברשימה אחרת.

(define has-dup?
  (lambda (lst)
    (cond
      ((null? lst) #f)
      ((member (car lst) (cdr lst)) #t)
      (else (has-dup? (cdr lst))))))

(define subset?
  (lambda (lst1 lst2)
    (cond
      ((null? lst1) #t)
      ((member (car lst1) lst2) (subset? (cdr lst1) lst2))
      (else #f))))

(define index-of
  (lambda (element lst index)
    (cond
      ((null? lst) -1)
      ((equal? (car lst) element) index)
      (else (index-of element (cdr lst) (+ index 1))))))`

        function init() {
            renderSidebar();
            updateUI();
        }

        function renderSidebar() {
            stepList.innerHTML = '';
            steps.forEach((step, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${index === currentStep ? 'active-nav' : ''}`;
                btn.onclick = () => goToStep(index);
                btn.innerHTML = `<span>${index}: ${step.title}</span>`;
                stepList.appendChild(btn);
            });
        }

        function updateUI() {
            const step = steps[currentStep];
            
            // Fade out
            contentContainer.classList.remove('fade-enter-active');
            contentContainer.classList.add('fade-enter');
            
            setTimeout(() => {
                stepNumberBadge.textContent = "תחנה " + currentStep;
                stepTitle.textContent = step.title;
                stepExplanation.innerHTML = step.explanation;
                
                if (step.code && step.filename) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-regular fa-file-code ml-2"></i>${step.filename}`;
                    codeBlock.textContent = step.code;
                    if (window.Prism) {
                        Prism.highlightElement(codeBlock);
                    }
                } else {
                    codeContainer.classList.add('hidden');
                }

                prevBtn.disabled = currentStep === 0;
                stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;
                
                if (currentStep === steps.length - 1) {
                    nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
                } else {
                    nextBtn.innerHTML = 'המשך <i class="fa-solid fa-arrow-left mr-2"></i>';

                renderSidebar();
                
                // Fade in
                contentContainer.classList.remove('fade-enter');
                contentContainer.classList.add('fade-enter-active');
            }, 150);

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
