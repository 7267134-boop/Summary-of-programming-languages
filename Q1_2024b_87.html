                filename: "question_analysis.txt",
                explanation: `
                    <p class="mb-4">במבחן זה (מועד א 2024ב), אנו נדרשים לשדרג את שפת <strong>PROC (יישגור)</strong> כך שתתמוך ב-<strong>העמסת פרוצדורות (Overloading)</strong>.</p>
                    
                    <div class="bg-blue-50 p-6 rounded-lg border border-blue-200 mb-6 shadow-sm">
                        <h4 class="font-bold text-blue-900 text-base mb-2">דרישות השפה החדשות:</h4>
                        <div class="bg-white p-3 rounded border border-blue-100 font-mono text-sm mb-4 ltr text-left">
Expression ::= overload proc { [ {identifier}*(,) ] -> Expression ; }+<br>
Expression ::= (Expression { Expression }* )
                        </div>
                        <ul class="list-disc list-inside text-sm text-blue-900 space-y-2">
                            <li><code>overload proc { [ids*] -> body ; }+</code>: מאפשר הגדרת פרוצדורה עם מספר חתימות שונות של פרמטרים. לכל חתימה יש רשימת פרמטרים ייחודית וגוף ריצה משלה.</li>
                            <li><code>(rator rands*)</code>: ביטוי הפעלה משודרג המקבל מספר שרירותי של ארגומנטים ומפעיל את החתימה המתאימה לפי כמות הארגומנטים שנשלחו.</li>
                        </ul>
                    </div>

                    <div class="thought-box">
                        <p class="text-purple-900 font-medium">
                            <strong>הבנת המבנה הכללי באלגוריתם EOPL:</strong><br>
                            כאשר נדרש מאיתנו להגדיר מבנה המכיל "מספר מופעים" (כמו רשימת גרסאות של פרוצדורה), אנו נשמור ב-Datatype רשימה של רשימות מזהים (ids-list) ורשימה מקבילה של גופי ביטוי (bodies).
                            בזמן קריאה לפרוצדורה, נשלוף את רשימות המזהים והגופים הללו, ונשתמש בפונקציית סריקה רקורסיבית מותאמת כדי להתאים את כמות המזהים לכמות הארגומנטים.
                        </p>
                    </div>

                    <h3 class="text-xl font-bold text-slate-800 mb-3 border-b pb-2">מה אנו מחפשים ומנתחים בשלב זה?</h3>
                    <ul class="space-y-3 text-slate-700">
                        <li>
                            <span class="font-semibold text-slate-900">1. מבנה הנתונים השמור:</span>

                        </li>
                        <li>
                            <span class="font-semibold text-slate-900">2. לוגיקת ההערכה בזמן ריצה:</span> 
                            בביטוי הקריאה (Call), אנו מעריכים תחילה את ה-operator ואת כל ה-operands (ארגומנטים). לאחר מכן, אנו בודקים האם ה-operator הוא אכן ערך של פרוצדורה, ומפעילים לוגיקת בחירה רקורסיבית.

                        <li>
                            <span class="font-semibold text-slate-900">3. הרחבת הסביבה:</span> 
                            הפונקציה המובנית <code>extend-env</code> של EOPL מקבלת רשימת מזהים (symbols) ורשימת ערכים (ExpVals) ומקשרת ביניהם במכה אחת. לכן, ההנחה בפתרון התלמיד לגבי הרחבת הסביבה היא נכונה ותקנית.
                        </li>
                    </ul>
                `,
                code: `;; --- מפת הדרכים הכללית לאלגוריתם ---

;; 3. interp.scm: מימוש Cases בתוך value-of להגדרת ולקריאת הפרוצדורה.
;; 4. interp.scm (Helpers): כתיבת פונקציות העזר search-and-apply ו-validate-proc-input.`
            },
            {
                id: 1,
                title: "שלב 1: עדכון הדקדוק (lang.scm)",

                    <div class="template-box">
                        <p class="text-emerald-900 font-medium">
                            "<strong>עדכון קובץ התחביר והדקדוק (lang.scm):</strong> נחליף את ביטוי ה-proc הישן בביטוי החדש <code>overload-proc-exp</code>. נתקן את שגיאת התלמיד מהבחינה: התלמיד רשם את הביטוי התחבירי כך שגוף הביטוי מחוץ לסוגריים של רשימת החתימות, מה שהיה מאפשר להגדיר גוף ביטוי יחיד בלבד לכל הפרוצדורה. במקום זאת, נגדיר את הדקדוק כך שכל חתימה מקבלת גוף ריצה משלה, מופרדים באמצעות סימון ייעודי."
                        </p>
                    </div>

                    <h3 class="text-lg font-bold text-slate-800 mb-2">ההבדלים בין הגדרת התלמיד השגויה להגדרה התקנית:</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4 text-sm">
                        <div class="bg-red-50 p-4 rounded-lg border border-red-200">
                            <strong class="text-red-800">❌ גרסת התלמיד (שגויה):</strong>
                            <p class="font-mono mt-2 ltr text-left">
                                ("overload Proc"<br>
                                 (arbno "[" (separated-list identifier ",") "]")<br>
                                 "->" expression)
                            </p>
                            <p class="mt-2 text-red-950">התוצאה: ה-Parser מצפה לרשימה של סוגריים מרובעים עם מזהים, ורק בסוף חץ אחד וביטוי גוף אחד לכולם. לא ניתן להצמיד גוף שונה לכל גרסת פרמטרים!</p>
                        </div>
                        <div class="bg-green-50 p-4 rounded-lg border border-green-200">
                            <strong class="text-green-800">✅ הגרסה התקנית והמתוקנת:</strong>
                            <p class="font-mono mt-2 ltr text-left">
                                ("overload proc"<br>
                                 "{" (separated-list "[" (separated-list identifier ",") "]" "->" expression ";") "}")
                            </p>
                            <p class="mt-2 text-green-950">התוצאה: ה-Parser מפרש רשימת גרסאות שלמה בתוך סוגריים מסולסלים, כשכל גרסה מורכבת מרשימת פרמטרים מרובעת וחץ המוביל לביטוי הגוף שלה.</p>
                        </div>
                    </div>
                `,
                code: `;; בקובץ lang.scm בתוך הגדרת the-grammar:

(expression
  ("overload proc" "{" (separated-list "[" (separated-list identifier ",") "]" "->" expression ";") "}")
  overload-proc-exp)

(expression
  ("(" expression (arbno expression) ")")
  call-exp)`
            },
            {
                id: 2,
                title: "שלב 2: עדכון מבני הנתונים (data-structures.scm)",
                filename: "data-structures.scm",
                explanation: `
                    <p class="mb-4">בשלב זה אנו מגדירים כיצד נשמרת פרוצדורה מועמסת בזמן ריצה בתוך ה-Datatype <code>Proc</code>.</p>
                    
                    <div class="template-box">
                        <p class="text-emerald-900 font-medium">
                            "<strong>עדכון מבני הנתונים (data-structures.scm):</strong> נעדכן את ה-datatype של <code>proc</code>. במקום לשמור פרמטר בודד (symbol?) וגוף בודד (expression?), אנו צריכים לשמור רשימה של רשימות מזהים ורשימת גופי ביטוי תואמים. בנוסף, נשמור את הסביבה הלקסיקלית (environment?) שבה הפרוצדורה הוגדרה לצורך קישור דינמי תקין של משתנים."
                        </p>
                    </div>

                    <h3 class="text-lg font-bold text-slate-800 mb-2">מבנה הנתונים:</h3>
                    <ul class="list-disc list-inside text-sm text-slate-700 space-y-1 mb-4">
                        <li><code>ids-list</code>: רשימה של רשימות של symbols. כלומר, מטיפוס <code>(list-of (list-of symbol?))</code>.</li>

                        <li><code>env</code>: הסביבה שנסגרה (Closure environment).</li>
                    </ul>
                `,
                code: `;; בקובץ data-structures.scm:

(define-datatype proc proc?
  (procedure
    (ids-list (list-of (list-of symbol?)))
    (bodies (list-of expression?))
    (env environment?)))`
            },
            {
                id: 3,
                title: "שלב 3: עדכון מנוע ההערכה (interp.scm - value-of)",
                filename: "interp.scm",
                explanation: `
                    <p class="mb-4">בתוך פונקציית ההערכה <code>value-of</code>, נוסיף את הטיפול בשני המקרים החדשים: הגדרת הפרוצדורה המועמסת וביטוי הקריאה.</p>
                    
                    <div class="template-box">

                        </p>
                    </div>

                    <h3 class="text-lg font-bold text-slate-800 mb-2">דגשי מימוש חשובים:</h3>
                    <ul class="list-disc list-inside text-sm text-slate-700 space-y-2 mb-4">
                        <li><strong>הערכה עצלה מול הערכה מיידית:</strong> הארגומנטים הנשלחים לקריאה (rands) הם ביטויים תחביריים. עלינו להעריך אותם לערכים מבוטאים (ExpVals) בזמן הקריאה <strong>לפני</strong> שאנו מנסים להתאים ביניהם לבין הפרמטרים.</li>
                        <li><strong>שימוש ב-map:</strong> שימוש ב-map מאפשר להפעיל את <code>value-of</code> על רשימת ה-rands עם סביבת ההערכה הדינמית <code>env</code> של הקורא.</li>
                    </ul>

(overload-proc-exp (ids-list bodies)
  (begin
    (validate-proc-input ids-list bodies)
    (proc-val (procedure ids-list bodies env))))

(call-exp (rator rands)
  (let ((proc1 (expval->proc (value-of rator env)))
        (args (map (lambda (exp) (value-of exp env)) rands)))
    (cases proc proc1
      (procedure (ids-list bodies env1)
        (search-and-apply ids-list bodies env1 args)))))`

        const stepCounter = document.getElementById('step-counter');

        function init() {
            renderSidebar();
            updateUI();
        }

        function renderSidebar() {
            stepList.innerHTML = '';
            steps.forEach((step, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${index === currentStep ? 'active-nav' : ''}`;
                btn.onclick = () => goToStep(index);
                btn.innerHTML = `<span>${index}: ${step.title}</span>`;
                stepList.appendChild(btn);
            });
        }

        function updateUI() {
            const step = steps[currentStep];

            // Fade out
            contentContainer.classList.remove('fade-enter-active');
            contentContainer.classList.add('fade-enter');

            setTimeout(() => {
                stepNumberBadge.textContent = "תחנה " + currentStep;
                stepTitle.textContent = step.title;
                stepExplanation.innerHTML = step.explanation;

                if (step.code && step.filename) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-regular fa-file-code ml-2"></i>${step.filename}`;
                    codeBlock.textContent = step.code;
                    if (window.Prism) {
                        Prism.highlightElement(codeBlock);
                    }
                } else {
                    codeContainer.classList.add('hidden');
                }

                prevBtn.disabled = currentStep === 0;
                stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;

                if (currentStep === steps.length - 1) {
                    nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
                } else {
                    nextBtn.innerHTML = 'המשך <i class="fa-solid fa-arrow-left mr-2"></i>';
                }

                renderSidebar();

                // Fade in
                contentContainer.classList.remove('fade-enter');
                contentContainer.classList.add('fade-enter-active');
            }, 150);
        }

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        // Start initialization
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
