    <script>
        let hoverCloseTimer = null;

        function clearCloseTimer() {
            if (hoverCloseTimer) {
                clearTimeout(hoverCloseTimer);
                hoverCloseTimer = null;
            }
        }

        function startCloseTimer() {
            if (tooltipState !== 3) return;
            clearCloseTimer();
            hoverCloseTimer = setTimeout(() => {
                closeModal(null, true);
            }, 300); // 300ms delay to allow mouse movement to modal
        }

        // Global click listener to close modal when clicking outside in click mode
        document.addEventListener('click', (event) => {
            const modal = document.getElementById('explanation-modal');
            const modalCard = document.getElementById('modal-card');

            if (!modal.classList.contains('hidden')) {
                // If the click is NOT inside the modal-card, and NOT on an interactive tooltip
                if (!modalCard.contains(event.target) && !event.target.closest('.interactive-tooltip')) {
                    closeModal(null, true);
                }
            }
        });
        const explanationsDict = {
            
            "step1_1": `<p>אנחנו אומרים למפרש (לכלי הסריקה, לרוב <code>sllgen</code> בקורסים האלו): "שים לב, אני עומד להגדיר לך סוג חדש של ביטוי (expression) בשפה שלנו".</p>`,
            "step1_2": `<p>אלו הן ה"מילים השמורות" (Keywords) שהמפרש יחפש בטקסט. כדי שהטקסט יתאים לתבנית הזו, המתכנת חייב להקליד בדיוק את המילים <code>overload proc</code> ואחריהן לפתוח סוגריים מסולסלים <code>{</code>. זה אומר לקצין המיון: "הנה מתחילה הגדרה של פונקציה מועמסת".</p>`,
            "step1_3": `<p>זוהי השורה הקריטית והמורכבת ביותר. יש כאן מנגנון של רשימה בתוך רשימה. בוא נפרק אותה מהבפנים החוצה:</p><ol class="list-decimal list-inside ml-4 space-y-2 mb-4"><li><strong>הרשימה הפנימית - <code>(separated-list identifier ",")</code>:</strong> פה אנחנו מגדירים את <strong>הפרמטרים</strong> של הפונקציה. אנחנו אומרים למפרש לצפות לרשימה של שמות משתנים (identifiers), שמופרדים ביניהם בפסיק (<code>,</code>). לדוגמה: <code>x, y, z</code>.</li><li><strong>העטיפה של הפרמטרים - <code>"[" ... "]"</code>:</strong> הרשימה הפנימית הזו חייבת להיות עטופה בסוגריים מרובעים. לדוגמה: <code>[x, y, z]</code>.</li><li><strong>הגוף - <code>-&gt; expression</code>:</strong> אחרי הסוגריים המרובעים, חייב להופיע החץ <code>-&gt;</code>, ואחריו ביטוי כלשהו (<code>expression</code>), שזה בעצם הקוד שירוץ אם הפונקציה תקרא עם כמות הפרמטרים הזו.</li><li><strong>הרשימה החיצונית - <code>(separated-list ... ";")</code>:</strong> כל החבילה שהרכבנו עכשיו בשלבים 1-3 היא "מקרה" (Case) אחד של הפונקציה. הרשימה החיצונית אומרת שיכולים להיות לנו <strong>הרבה מקרים כאלה</strong>, ומה שיפריד ביניהם הוא התו נקודה-פסיק (<code>;</code>).</li></ol>`,
            "step1_4": `<p>התבנית מסתיימת. המתכנת חייב לסגור את הבלוק עם סוגריים מסולסלים <code>}</code>.</p>`,
            "step1_5": `<p>השורה הזו היא "שם הקופסה". אם הטקסט של המתכנת עבר את כל המסלול והתאים בדיוק לתבנית שהגדרנו למעלה, המפרש ייצר צומת (Node) בעץ התחביר ויקרא לו בשם <code>overload-proc-exp</code>. הצומת הזה יכיל בתוכו רשימה של רשימות של פרמטרים, ורשימה מקבילה של גופי פונקציה (ביטויים).</p>`,
            "step1_6": `<p>שוב, תבנית לביטוי חדש.</p><ul class="list-disc list-inside ml-4 space-y-2 mb-4"><li>אנחנו מתחילים בסוגריים עגולים <code>(</code>.</li><li>מיד אחר כך מופיע <code>expression</code> – זהו הביטוי הראשון בסוגריים, והוא מייצג את <strong>הפונקציה עצמה</strong> (האופרטור שאנחנו מפעילים).</li><li>לאחר מכן מופיע הקסם: <code>(arbno expression)</code>. המילה <code>arbno</code> (קיצור של Arbitrary Number - מספר שרירותי) אומרת למפרש: "מעכשיו ועד סוף התבנית, קבל כל כמות של ביטויים, מאפס ועד אינסוף". אלו הם <strong>הארגומנטים</strong> שאנחנו שולחים לפונקציה.</li><li>התבנית נסגרת עם <code>)</code>.</li></ul><p>לדוגמה, זה יתפוס קריאה כמו: <code>(my-func 1 2 3)</code>. הפונקציה היא <code>my-func</code>, והארגומנטים הם <code>1 2 3</code>.</p>`,
            "step1_7": `<p>אם התבנית התאימה, קצין המיון אורז את הביטוי הראשון כ"אופרטור" (הפונקציה) ואת כל שאר הביטויים כרשימה של "אופרנדים" (הארגומנטים), ומדביק על הקופסה את המדבקה <code>call-exp</code>.</p>`,

            "step2_1": `<p>אנחנו אומרים למפרש: "אני רוצה להגדיר טיפוס נתונים (Data Type) חדש וחוקי במערכת, ואני אקרא לו <code>proc</code>". על הדרך, הפקודה הזו מייצרת עבורנו אוטומטית פונקציית עזר (Predicate) בשם <code>proc?</code>. מתישהו בעתיד, כשנרצה לבדוק אם פיסת מידע מסוימת בזיכרון היא פונקציה או סתם מספר, נפעיל עליה את <code>proc?</code>. זה מקביל להגדרת <code>class</code> או <code>struct</code> בשפות עיליות.</p>`,
            "step2_2": `<p>הטיפוס <code>proc</code> יכול תיאורטית להכיל כמה גרסאות (Variants), אבל כאן אנחנו מגדירים לו צורה אחת ויחידה שנקראת <code>procedure</code>. זוהי ה"קופסה" עצמה, או ה"בנאי" (Constructor). כל פעם שהמפרש יצטרך ליצור פונקציה חדשה בזיכרון, הוא יארוז אותה בתוך קופסת <code>procedure</code> כזו. הקופסה הזו מכילה בדיוק שלושה שדות שמייצגים את האולר שלנו:</p>`,
            "step2_3": `<p>זהו השדה הראשון בקופסה, וזה מייצג את "הלהבים" של האולר. שים לב היטב למבנה: יש פה <strong>רשימה של רשימות</strong> (<code>list-of (list-of ...)</code>).<br>למה? בפונקציה רגילה היינו רואים רק רשימה אחת של סמלים (למשל <code>(x y)</code>). אבל בגלל שזו פונקציה מועמסת שיכולה לקבל לדוגמה או פרמטר אחד, או שניים, או שלושה - אנחנו חייבים לשמור את *כל* קומבינציות הפרמטרים האפשריות. השדה הזה יחזיק מבנה שנראה כך: <code>((x) (x y) (a b c))</code>. כל רשימה פנימית כזו מייצגת סט פרמטרים של "מקרה" (Case) אחד מתוך שלל המקרים שהפונקציה יכולה לטפל בהם.</p>`,
            "step2_4": `<p>זה השדה השני, והוא מחזיק את ההוראות עצמן (גופי הקוד). מכיוון שיש לנו כמה מקרים שונים של פרמטרים בשדה הקודם, אנחנו צריכים גם כמה מקרים שונים של קוד שירוץ!<br>אם <code>ids-list</code> החזיק 3 קבוצות שונות של פרמטרים, אז השדה <code>bodies</code> יחזיק רשימה של 3 ביטויים (Expressions). קיימת כאן התאמה של "אחד-לאחד" – האיבר הראשון ברשימת <code>bodies</code> הוא הקוד שירוץ כאשר יופעל האיבר הראשון ברשימת <code>ids-list</code>, וכן הלאה.</p>`,
            "step2_5": `<p>זה השדה השלישי והאחרון – "תרמיל הזיכרונות". ברגע שהמתכנת מגדיר את הפונקציה הזו בקוד, היא חייבת "לצלם מסך" של כל המשתנים (והערכים שלהם) שהיו באוויר באותו רגע – למשל משתנים גלובליים או משתנים מפונקציה עוטפת אחרת. הצילום הזה הוא ה-<code>environment</code>, והוא נשמר כאן תחת השדה <code>env</code>.<br>מתישהו בעתיד, כשמישהו יקרא לפונקציה ויפעיל אותה, היא עלולה לחפש משתנה שלא מופיע בפרמטרים שלה. איפה היא תחפש אותו? בדיוק בתוך ה-<code>env</code> הזה. זה המנגנון המפורסם שנקרא "סקופ לקסיקלי" (Lexical Scoping).</p>`,

            "step3_1": `<p>המפרש בודק את עץ התחביר שנוצר ב-<code>lang.scm</code> ומגלה שהוא עומד מול הגדרה של פונקציה מועמסת. הוא מחלץ מתוך הקופסה את שתי הרשימות שלנו: רשימת רשימות הפרמטרים (<code>ids-list</code>) ורשימת הביטויים/קוד (<code>bodies</code>).</p>`,
            "step3_2": `<p>הבלוק <code>begin</code> מאפשר לנו לבצע כמה פעולות ברצף. הפעולה הראשונה היא מחלקת בקרת האיכות (QA)!<br>אנחנו קוראים לפונקציית עזר בשם <code>validate-proc-input</code>. התפקיד שלה הוא לוודא שהמתכנת לא עשה שטויות. למשל, היא תוודא שאין לנו שני מקרים שונים שמקבלים בדיוק 2 פרמטרים – כי אז המפרש לא יידע איזה קוד להריץ כשישלחו אליו 2 ארגומנטים (תהיה כפילות או עמימות). אם יש בעיה, הפונקציה הזו כנראה תזרוק שגיאה ותעצור את התוכנית.</p>`,
            "step3_3": `<p>אם הבדיקה עברה בהצלחה, אנחנו אורזים את הכל למשלוח.<br>אנחנו קוראים לבנאי <code>procedure</code> (שהגדרנו מקודם ב-<code>data-structures.scm</code>). אנחנו דוחפים לתוכו את <code>ids-list</code>, את <code>bodies</code>, והכי חשוב – את <code>env</code>! ה-<code>env</code> (הסביבה הנוכחית) "נלכד" כעת בתוך הטיפוס ונשמר להמשך. לבסוף, אנחנו עוטפים הכל ב-<code>proc-val</code> כדי שזה יהפוך לערך חוקי בשפה (ExpVal) שניתן לשמור במשתנה או להחזיר.</p>`,
            "step3_4": `<p>המפרש מזהה שמישהו מנסה להפעיל פונקציה. הוא מחלץ מהעץ את <code>rator</code> (הביטוי שמייצג את הפונקציה עצמה) ואת <code>rands</code> (רשימת הביטויים שמייצגים את הארגומנטים). אבל שים לב – אלו עדיין רק "ביטויי טקסט" שלא חושבו.</p>`,
            "step3_5": `<p>הפועל הולך להביא את האולר מהמדף.<br>אנחנו שולחים את ה-<code>rator</code> לחישוב בתוך המפרש בעזרת <code>value-of</code>. אם ה-<code>rator</code> היה השם של המשתנה <code>my-func</code>, המפרש יחפש אותו בזיכרון. אחרי שהוא מוצא את קופסת ה-<code>proc-val</code>, אנחנו משתמשים בפונקציית החילוץ <code>expval-&gt;proc</code> כדי לקלף את העטיפה ולקבל את אובייקט ה-<code>procedure</code> הפנימי נטו, ושומרים אותו במשתנה <code>proc1</code>.</p>`,
            "step3_6": `<p>זהו תהליך "הכנת חומרי הגלם".<br>אנחנו עוברים על כל אחד מהארגומנטים שנשלחו (<code>rands</code>) באמצעות <code>map</code>, ושולחים כל אחד מהם לחישוב ב-<code>value-of</code>. המפרש ממיר את משוואות הטקסט לערכים אמיתיים.<br><strong>נקודה קריטית למודל המנטלי:</strong> החישוב של הארגומנטים מתבצע תחת <code>env</code> (הסביבה שבה *קראו* לפונקציה), ולא הסביבה שבה הפונקציה הוגדרה.</p>`,
            "step3_7": `<p>אנחנו "פותחים את קופסת האולר" שהבאנו.<br>הפקודה <code>cases</code> מסתכלת בתוך <code>proc1</code>, מוודאת שהוא אכן מסוג <code>procedure</code>, ומחלצת מתוכו את הרכיבים ששמרנו שם בעבר.<br>שים לב לשינוי השם הגאוני: הסביבה ששלפנו מתוך הפונקציה נקראת כאן <strong><code>env1</code></strong>. זה לא ה-<code>env</code> של השורות הקודמות! <code>env</code> היא הסביבה העכשווית, ואילו <code>env1</code> היא "תרמיל הזיכרונות" מהעבר, הסביבה שנלכדה כשהפונקציה הוגדרה.</p>`,
            "step3_8": `<p>אנחנו מוסרים את העבודה ל"מנהל העבודה" – פונקציית העזר <code>search-and-apply</code>.<br>אנחנו מוסרים לה את "הלהבים" (<code>ids-list</code>), את "גופי הקוד" (<code>bodies</code>), את תרמיל הזיכרונות האמיתי של הפונקציה (<code>env1</code>), ואת הערכים הסופיים שחישבנו כרגע (<code>args</code>).<br>מה ש-<code>search-and-apply</code> תעשה מאחורי הקלעים זה לספור כמה איברים יש ב-<code>args</code>, לרוץ על <code>ids-list</code> כדי למצוא רשימת פרמטרים באותו אורך, לקשור (Bind) את הפרמטרים לערכים (כדי ליצור סביבה חדשה שמרחיבה את <code>env1</code>), ולבסוף להפעיל <code>value-of</code> על גוף הקוד המדויק שנמצא ב-<code>bodies</code>.</p>`,

            "step4_1": `<p>זוהי מחלקת "בקרת האיכות". הפונקציה מקבלת את רשימת המקרים של הפונקציה (<code>ids-list</code>) ורשימת גופי הקוד המקבילים אליהם (<code>bodies</code>).</p>`,
            "step4_2": `<p>זוהי בדיקת המאבטח! כאן אני רוצה לתקן משהו קטן שאמרתי בהסבר הקודם: שם שיערתי שהפונקציה הזו תעשה בדיקה מורכבת כדי לוודא שאין כפילויות של פרמטרים. אבל עכשיו, כשאנחנו רואים את הקוד האמיתי של הקורס, מתברר שהבדיקה הרבה יותר בסיסית וקשוחה – היא רק בודקת שהמתכנת לא הגדיר פונקציה מועמסת *ריקה לגמרי*. היא נועדה למנוע מצב אבסורדי שבו מתכנת כותב את הקוד <code>overload proc {}</code> בלי שום התנהגות בפנים.</p>`,
            "step4_3": `<p>אם הרשימה אכן ריקה (המתכנת בא בידיים ריקות), המאבטח עוצר את כל הריצה וזורק שגיאה למסך: "חייבים להגדיר לפחות פונקציה אחת". אם הרשימה לא ריקה, הוא פשוט מחזיר <code>#t</code> (True) ונותן אור ירוק להמשיך ליצור את הפונקציה בזיכרון.</p>`,
            "step4_4": `<p>זהו הנתב במסוע! הוא מקבל את המקרים האפשריים (<code>ids-list</code>, <code>bodies</code>), את תרמיל הזיכרונות שנשמר כשהפונקציה הוגדרה (<code>env</code>), ואת הערכים הסופיים והאמיתיים שהמשתמש שלח ממש הרגע (<code>args</code>). שיטת הפעולה שלו היא רקורסיה קלאסית.</p>`,
            "step4_5": `<p>תנאי העצירה של הנתב. הוא שואל: "האם נגמרו לי המקרים לבדוק?"</p>`,
            "step4_6": `<p>זו האזעקה. אם הנתב עבר על כל רשימת <code>ids-list</code>, הגיע לסוף הרשימה (<code>null</code>) ולא מצא שום מקרה מתאים, זה אומר שהמתכנת ניסה לקרוא לפונקציה עם כמות פרמטרים שהיא פשוט לא מכירה. המפרש קורס ומדפיס הודעת שגיאה מפורטת שכוללת את מספר הארגומנטים השגוי שנשלח.</p>`,
            "step4_7": `<p>אם הרשימה לא ריקה (כלומר, אנחנו סורקים עכשיו מקרה פוטנציאלי), הנתב "שולף" את המקרה הראשון שעל הפרק. הוא לוקח את רשימת השמות של הפרמטרים במקרה הנוכחי ושומר אותה ב-<code>ids</code>, ואת גוף הקוד של המקרה הנוכחי ושומר אותו ב-<code>body</code>. שאר המקרים יחכו כרגע.</p>`,
            "step4_8": `<p>רגע האמת. הנתב סופר ושואל: "האם כמות הפרמטרים שהלהב הזה של האולר דורש, שווה בדיוק לכמות הארגומנטים (<code>args</code>) שהמשתמש הביא איתו?"</p>`,
            "step4_9": `<p>בינגו! יש התאמה! זוהי אחת השורות החשובות ביותר במפרש. כשיש התאמה בכמות, אנחנו צריכים סוף סוף להריץ את הקוד (<code>body</code>). אבל כדי להריץ אותו כמו שצריך, אנחנו משתמשים בפעולה <code>extend-env</code> (הרחבת סביבה). אנחנו לוקחים את ה-<code>env</code> המקורי של הפונקציה ("תרמיל הזיכרונות"), ומוסיפים לו שכבה חדשה: אנחנו אומרים למפרש לקשור (Bind) כל שם של משתנה מתוך <code>ids</code> לערך האמיתי המקביל שלו מתוך <code>args</code>. ברגע שהסביבה החדשה הזו מוכנה, אנחנו קוראים ל-<code>value-of</code> שתתחיל לחשב את גוף הפונקציה בתוכה.</p>`,
            "step4_10": `<p>המקרה הרקורסיבי (התא לא מתאים לחבילה). אם האורך של הפרמטרים לא תאם לכמות הארגומנטים, הנתב זורק לפח את המקרה שבדקנו עכשיו, ולוקח את "כל השאר" (<code>cdr ids-list</code> ו-<code>cdr bodies</code>). הוא מעביר אותם לקריאה רקורסיבית יחד עם ה-<code>env</code> וה-<code>args</code> המקוריים כדי להמשיך בחיפוש בתא הבא.</p>`

                        <p class="text-slate-500 mb-4 font-bold text-lg">תמונת השאלה חסרה</p>
                        <p class="text-slate-400 mb-6 text-sm">אנא בחר את קובץ התמונה שהורדת כדי להציג אותו כאן. (התמונה תישמר בדפדפן שלך לתמיד!)</p>
                        <input type="file" id="image-upload-input" accept="image/*" class="block w-full max-w-xs mx-auto text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-blue-50 file:text-primary hover:file:bg-blue-100 cursor-pointer">
                    </div>
                </div>`;
            } else if (step.isFinal) {
                let html = '<div class="space-y-12">';
                steps.forEach(s => {
                    if (s.code && !s.isFinal) {
                        html += `
                        <div>
                            <h3 class="text-xl font-bold text-slate-800 mb-4">${s.title}</h3>
                            <div class="code-window">
                                <div class="code-window-header ltr" dir="ltr">
                                    <div class="mac-buttons">
                                        <div class="mac-btn mac-close"></div>
                                        <div class="mac-btn mac-min"></div>
                                        <div class="mac-btn mac-max"></div>
                                    </div>
                                    <div class="code-filename"><i class="fa-solid fa-code mr-2"></i>${s.filename}</div>
                                </div>
                                <div class="code-body ltr text-left" dir="ltr">
                                    <pre><code class="language-scheme">${s.code}</code></pre>
                                </div>
                            </div>
                        </div>
                        `;
                    }
                });
                html += '</div>';
                stepExplanation.innerHTML = html;
                Prism.highlightAllUnder(stepExplanation);
            } else {
                if (step.mentalModelBefore) {
                    stepExplanation.innerHTML = `
                    <button onclick="toggleAccordion('before')" class="accordion-btn rounded-xl bg-purple-50 text-purple-900 border-purple-200 hover:bg-purple-100 flex items-center justify-between p-4 w-full font-bold mb-6 border border-dashed border-purple-300 shadow-sm">
                       <span><i class="fa-solid fa-brain mr-2 ml-2"></i> מודל מנטלי לפני הקוד</span>
                       <i id="acc-icon-before" class="fa-solid fa-chevron-down transition-transform"></i>
                    </button>
                    <div id="acc-content-before" class="hidden bg-white border border-purple-100 p-6 rounded-xl shadow-sm mb-6 text-slate-700 leading-relaxed text-[1.05rem]">
                        ${step.mentalModelBefore}
                    </div>`;
                }

                if (step.code) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-solid fa-code mr-2"></i>${step.filename}`;
                    codeBlock.innerHTML = step.code;
                    Prism.highlightElement(codeBlock);

                    if (step.mentalModelAfter) {
                        stepAfterExplanation.innerHTML = `
                        <button onclick="toggleAccordion('after')" class="accordion-btn rounded-xl bg-indigo-50 text-indigo-900 border-indigo-200 hover:bg-indigo-100 flex items-center justify-between p-4 w-full font-bold mb-4 mt-8 border border-dashed border-indigo-300 shadow-sm">
                           <span><i class="fa-solid fa-lightbulb mr-2 ml-2"></i> סיכום לאחר הקוד</span>
                           <i id="acc-icon-after" class="fa-solid fa-chevron-down transition-transform"></i>
                        </button>
                        <div id="acc-content-after" class="hidden bg-white border border-indigo-100 p-6 rounded-xl shadow-sm mb-6 text-slate-700 leading-relaxed text-[1.05rem]">
                            ${step.mentalModelAfter}
                        </div>`;
                    }
                }
            }

            prevBtn.disabled = currentStep === 0;
            stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;

            if (currentStep === steps.length - 1) {
                nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
            } else {
                nextBtn.innerHTML = 'המשך <i class="fa-solid fa-arrow-left mr-2"></i>';
            }

            renderSidebar();

            setTimeout(() => {
                initTooltips();
            }, 50);

            contentContainer.classList.remove('fade-enter');
            contentContainer.classList.add('fade-enter-active');
        }

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-collapsed');
            const isCollapsed = document.body.classList.contains('sidebar-collapsed');
            localStorage.setItem('sidebarCollapsed', isCollapsed);

            // Update icon direction
            const icon = document.getElementById('sidebar-toggle-icon');
            if (isCollapsed) {
                icon.className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            } else {
                icon.className = 'fa-solid fa-chevron-right text-lg transition-transform duration-300';
            }
        }

        function init() {
            // Restore tooltip state from localStorage
            const savedState = localStorage.getItem('globalTooltipState');
            if (savedState) {
                tooltipState = parseInt(savedState);
            }
            updateCyclerUI();

            // Create and inject sidebar toggle button
            const toggleBtn = document.createElement('button');
            toggleBtn.id = 'sidebar-toggle-btn';
            toggleBtn.onclick = toggleSidebar;
            toggleBtn.innerHTML = '<i id="sidebar-toggle-icon" class="fa-solid fa-chevron-right text-lg transition-transform duration-300"></i>';
            document.body.appendChild(toggleBtn);

            // Load sidebar collapsed state from localStorage
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (isCollapsed) {
                document.body.classList.add('sidebar-collapsed');
                document.getElementById('sidebar-toggle-icon').className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            }

            updateUI();
        }

        init();
    </script>
</body>

</html>
