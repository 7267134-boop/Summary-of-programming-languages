                    <div class="bg-blue-50 p-6 rounded-lg border border-blue-200 mb-6 shadow-sm">
                        <h4 class="font-bold text-blue-900 text-base mb-2">דרישות השפה החדשות:</h4>
                        <div class="bg-white p-3 rounded border border-blue-100 font-mono text-sm mb-4 ltr text-left">
Expression ::= &lt; { Expression }+(,) &gt;<br>
Expression ::= let temps = Expression in Expression<br>
temps ::= identifier | [ { identifier }+(,) ]
                        </div>
                        <ul class="list-disc list-inside text-sm text-blue-900 space-y-2">
                            <li><code>&lt;1, 2, 3&gt;</code>: מגדיר tuple המכיל רשימת ערכים מבוטאים (expvals).</li>
                            <li><code>let [x, _, y] = &lt;1, 2, 3&gt; in body</code>: הגדרת מספר משתנים זמניים המקבלים ערכים מחילוץ מרכיבים מתוך ה-tuple. משתמש ב-<code>_</code> (קו תחתון) כדי להתעלם ממרכיבים.</li>

                    <ul class="space-y-3 text-slate-700">
                        <li>
                            <span class="font-semibold text-slate-900">1. lang.scm:</span> 
                            הגדרת הדקדוק של ה-tuple-exp והשדרוג של ה-let-exp לשימוש ב-temps.
                        </li>
                        <li>
                            <span class="font-semibold text-slate-900">2. data-structures.scm:</span> 
                            מימוש ה-datatype של <code>tuple-val</code> ופונקציות העזר לבדיקת סוג והוצאת ערך.

                        <li>

                            הוספת המקרים של let-exp ו-tuple-exp למנוע ההערכה.

                        </li>
                    </ul>
                `,
                code: `;; --- מפת הדרכים הכללית לאלגוריתם ---
;; 1. lang.scm: עדכון הדקדוק ל-tuple-exp ו-let-exp מורחב

            },
            {
                id: 1,
                title: "שלב 1: עדכון הדקדוק (lang.scm)",
                filename: "lang.scm",
                explanation: `
                    <p class="mb-4">ה-Parser וה-Scanner צריכים לזהות את אופן ההגדרה והקריאה החדש של ה-tuple ושל ה-let המורחב.</p>
                    
                    <div class="template-box">
                        <p class="text-emerald-900 font-medium">
                            "<strong>עדכון קובץ התחביר והדקדוק (lang.scm):</strong> נעדכן את הכללים הקיימים. נגדיר את <code>let-exp</code> המקבל <code>temps</code> במקום <code>identifier</code>. נוסיף את הכלל של <code>tuple-exp</code> עם סוגריים משולשים ופסיק מפריד. נגדיר את <code>temps</code> ואת <code>optional-identifier</code> כדי לתפוס את הקו התחתון (ignore)."
                        </p>
                    </div>
                `,
                code: `;; בקובץ lang.scm בתוך הגדרת the-grammar:

(expression
  ("let" temps "=" expression "in" expression)
  let-exp)

(expression
  ("<" (separated-list expression ",") ">")
  tuple-exp)

(temps
  (identifier)
  one-temp)

(temps
  ("[" (separated-list optional-identifier ",") "]")
  many-temp)

(optional-identifier
  ("_")
  ignore)

(optional-identifier
  (identifier)
  id)`
            },
            {
                id: 2,
                title: "שלב 2: עדכון מבני הנתונים (data-structures.scm)",
                filename: "data-structures.scm",
                explanation: `
                    <p class="mb-4">כדי לשמור ולשלוף ערכי tuples, עלינו לעדכן את מבנה הנתונים <code>expval</code> בשפה.</p>
                    
                    <div class="template-box">
                        <p class="text-emerald-900 font-medium">
                            "<strong>עדכון מבני הנתונים (data-structures.scm):</strong> נגדיר פרדיקט <code>tuple?</code> שמוודא שכל האיברים ברשימה הם אכן expval חוקיים. נרחיב את ה-datatype של <code>expval</code> עם בנאי חדש <code>tuple-val</code> ונוסיף extractor ייעודי <code>expval->tuple</code>."
                        </p>
                    </div>
                `,
                code: `;; בקובץ data-structures.scm:

(define (tuple? lst)
  (if (pair? lst)
      (and (expval? (car lst)) 
           (if (null? (cdr lst)) #t (tuple? (cdr lst))))
      #f))

(define-datatype expval expval?
  ;; ...... num-val, bool-val, proc-val ......
  (tuple-val
    (tuple tuple?)))

(define expval->tuple
  (lambda (v)
    (cases expval v
      (tuple-val (tuple) tuple)
      (else (expval-extractor-error 'tuple v)))))`
            },
            {
                id: 3,
                title: "שלב 3: עדכון מנוע ההערכה (interp.scm - value-of)",
                filename: "interp.scm",
                explanation: `
                    <p class="mb-4">בתוך <code>value-of</code>, נעדכן את אופן יצירת ה-tuple ופירוק המשתנים ב-let.</p>
                    
                    <div class="template-box">

                            "<strong>עדכון מנוע ההערכה (interp.scm):</strong> 
                            1. ב-<code>let-exp</code>, נבצע הערכה של ביטוי המקור. לאחר מכן נשתמש ב-<code>cases temps</code> כדי להבדיל בין השמה רגילה לבין פירוק tuple (קריאה ל-<code>apply-let</code>).
                            2. ב-<code>tuple-exp</code>, נבצע הערכה של כל איברי ה-tuple. נוסיף ולידציה שמונעת יצירת tuple ריק."
                        </p>
                    </div>
                `,
                code: `;; בקובץ interp.scm בתוך ה-cases של value-of:

(let-exp (var exp1 body)
  (let* ((val1 (value-of exp1 env))
         (body-env (cases temps var
                     (one-temp (id) (extend-env id val1 env))
                     (many-temp (opt-ids) (apply-let opt-ids (expval->tuple val1) env)))))
    (value-of body body-env)))

(tuple-exp (exps)
  (let ((vals (map (lambda (x) (value-of x env)) exps)))
    (if (= (length vals) 0)
        (eopl:error 'value-of "tuple can't be empty")
        (tuple-val vals))))`

                            הפונקציה <code>apply-let</code> מוודאת שמספר המזהים זהה למספר האיברים ב-tuple. היא קוראת לפונקציית עזר פנימית <code>apply-let-impl</code> עם מונה <code>count</code> שעוקב אחר מספר המזהים האמיתיים שנקשרו (על מנת למנוע מצב שבו כולם קו תחתון). הקישור מתבצע משמאל לימין, כך שמשתנה בעל שם זהה שנמצא בימין ידרוס את המשתנה השמאלי בסביבה."
                        </p>
                    </div>
                `,
                code: `;; פונקציות עזר מחוץ ל-value-of בקובץ interp.scm:

(define (apply-let vars vals env)
  (define (apply-let-impl vars vals env count)
    (if (= (length vars) (length vals))
        (if (null? vars)
            (if (zero? count)
                (eopl:error 'apply-let "Empty tmps in let is disallowed")
                env)
            (cases optional-identifier (car vars)
              (ignore () (apply-let-impl (cdr vars) (cdr vals) env count))
              (id (var) (apply-let-impl (cdr vars) (cdr vals) 
                                       (extend-env var (car vals) env) 
                                       (+ count 1)))))
        (eopl:error 'apply-let "mismatch between amount of identifiers and values")))
  (apply-let-impl vars vals env 0))`

                            </div>
                            
                            <div class="bg-white p-3 rounded-lg border border-red-100">
                                <strong class="text-red-950 block mb-1">❌ מלכודת 3: מניעת tuple ריק בעת יצירה</strong>
                                יש לוודא שאי אפשר להגדיר <code>&lt;&gt;</code>. שמנו לב לכך ב-<code>tuple-exp</code> על ידי בדיקה האם אורך הרשימה <code>vals</code> הוא 0 וזריקת שגיאה מתאימה.
                            </div>
                        </div>
                    </div>
                `,
                code: `;; הגדרות וטיפים לפתרון נכון:
;; 1. וודאו שה-tuple-exp בודק vals ריק
;; 2. וודאו ש-apply-let סופר משתנים (count > 0)
;; 3. השתמשו בסביבה (extend-env var (car vals) env) העוברת משמאל לימין`
            }
        ];

        let currentStep = 0;
        const stepTitle = document.getElementById('step-title');
        const stepNumberBadge = document.getElementById('step-number-badge');
        const stepExplanation = document.getElementById('step-explanation');
        const codeContainer = document.getElementById('code-container');
        const codeBlock = document.getElementById('code-block');
        const fileName = document.getElementById('file-name');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const stepList = document.getElementById('step-list');
        const stepCounter = document.getElementById('step-counter');
        const contentContainer = document.getElementById('content-container');

        function init() {
            renderSidebar();
            updateUI();
        }

        function renderSidebar() {
            stepList.innerHTML = '';
            steps.forEach((step, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${index === currentStep ? 'active-nav' : ''}`;
                btn.onclick = () => goToStep(index);
                btn.innerHTML = `<span>${index}: ${step.title}</span>`;
                stepList.appendChild(btn);
            });
        }

        function updateUI() {
            const step = steps[currentStep];

            // Fade out
            contentContainer.classList.remove('fade-enter-active');
            contentContainer.classList.add('fade-enter');

            setTimeout(() => {
                stepNumberBadge.textContent = "תחנה " + currentStep;
                stepTitle.textContent = step.title;
                stepExplanation.innerHTML = step.explanation;

                if (step.code && step.filename) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-regular fa-file-code ml-2"></i>${step.filename}`;
                    codeBlock.textContent = step.code;
                    if (window.Prism) {
                        Prism.highlightElement(codeBlock);
                    }
                } else {
                    codeContainer.classList.add('hidden');
                }

                prevBtn.disabled = currentStep === 0;
                stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;

                if (currentStep === steps.length - 1) {
                    nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
                } else {
                    nextBtn.innerHTML = 'המשך <i class="fa-solid fa-arrow-left mr-2"></i>';
                }

                renderSidebar();

                // Fade in
                contentContainer.classList.remove('fade-enter');
                contentContainer.classList.add('fade-enter-active');
            }, 150);
        }

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        // Start initialization
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>

</html>
