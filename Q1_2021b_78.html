            {

                    <div class="template-box">

                code: `;; בקובץ lang.scm בתוך הגדרת the-grammar:

  ("(" expression (separated-list identifier "=" expression ",") ")")

            {
                id: 2,
                title: "שלב 2: עדכון מבני הנתונים (data-structures.scm)",
                filename: "data-structures.scm",
                explanation: `
                    <p class="mb-4">כדי לשמור את ערכי ברירת המחדל המוערכים, עלינו לעדכן את מבנה הנתונים <code>procedure</code>.</p>
                    
                    <div class="template-box">

    (ids (list-of symbol?))

                    <div class="template-box">
                        <p class="text-emerald-900 font-medium">
                            "<strong>עדכון מנוע ההערכה (interp.scm):</strong> 
                            1. ב-<code>proc-exp</code>, נבצע הערכה מיידית של כל ביטויי ברירת המחדל (defs) בסביבה הנוכחית <code>env</code> באמצעות <code>map</code>, ונשמור את רשימת ה-expvals שהתקבלה (defs1) בתוך בנאי הפרוצדורה.
                            2. ב-<code>call-exp</code>, נעריך את הארגומנטים שנשלחו על ידי הקורא (exps) בסביבת ההערכה הדינמית לקבלת רשימת ה-args, ולאחר מכן נעביר את רשימת שמות הפרמטרים המבוקשים (parms) וערכיהם לפונקציה <code>apply-procedure</code>."
                        </p>
                    </div>
                `,
                code: `;; בקובץ interp.scm בתוך ה-cases של value-of:

(proc-exp (ids defs body)
  (let ((defs1 (map (lambda (exp) (value-of exp env)) defs))) ; הערכה בזמן הגדרה
    (proc-val (procedure ids defs1 body env))))

(call-exp (rator parms exps)
  (let ((proc (expval->proc (value-of rator env)))
        (args (map (lambda (exp) (value-of exp env)) exps))) ; הערכת הארגומנטים
    (apply-procedure proc parms args)))`
            },
            {
                id: 4,
                title: "שלב 4: פונקציות עזר (interp.scm - helpers)",
                filename: "interp.scm",
                explanation: `
                    <p class="mb-4">כעת נממש את פונקציות העזר מחוץ ל-<code>value-of</code>, תוך תיקון שתי המלכודות הקשות שנתגלו בפתרון המקורי.</p>

                            "<strong>מימוש פונקציות העזר:</strong>

                            לאחר מכן, נבצע הרחבה רקורסיבית מבוססת <code>extend-multi</code>: עבור כל מזהה רשמי ב-ids, נבדוק האם הוא הועבר ב-params. אם כן, נשלוף את ערכו מהאינדקס התואם ב-args. אחרת, נשתמש בערך ברירת המחדל מתוך defs."
                        </p>
                    </div>
                `,
                code: `;; פונקציות עזר מחוץ ל-value-of בקובץ interp.scm:

(define apply-procedure
  (lambda (proc1 params args)
    (cases proc proc1
      (procedure (ids defs body saved-env)
        ;; [תיקון שגיאות בודק - אימות מזהים וריקון]:
        (cond
          ((not (subset? params ids))
           (eopl:error 'apply-procedure "passed invalid parameter names: ~s" params))
          ((has-dup? params)
           (eopl:error 'apply-procedure "duplicate parameter bindings in call: ~s" params))
          (else
           (value-of body (extend-multi ids defs params args saved-env))))))))

(define extend-multi
  (lambda (ids defs params args env)
    (if (null? ids)
        env
        (let ((index (index-of (car ids) params)))
          (if (= index -1)
              ;; הפרמטר לא הועבר בקריאה -> משתמשים בערך ברירת המחדל
              (extend-multi (cdr ids) (cdr defs) params args
                            (extend-env (car ids) (car defs) env))
              ;; הפרמטר הועבר בקריאה -> משתמשים בערך שהועבר מהקורא
              (extend-multi (cdr ids) (cdr defs) params args
                            (extend-env (car ids) (list-ref args index) env)))))))`

                            <div class="bg-white p-3 rounded-lg border border-red-100">
                                <strong class="text-red-950 block mb-1">❌ מלכודת 1: היעדר אימות של משתנים שאינם מוגדרים (הערת בודק)</strong>
                                בפתרון המודפס המקורי, אם הקורא העביר פרמטר שלא מוגדר בפרוצדורה (למשל, קריאה ל-<code>(myproc z=3)</code> כאשר הפרוצדורה מוגדרת כ-<code>proc(x=1,y=2)</code>), הקוד התעלם ממנו לחלוטין ולא זרק שגיאה! <br>
                                <strong>התיקון:</strong> חובה לבצע בדיקת הכלה <code>(subset? params ids)</code> לפני ביצוע הקישורים, על מנת למנוע קבלת פרמטרים פיקטיביים.
                            </div>
                            
                            <div class="bg-white p-3 rounded-lg border border-red-100">
                                <strong class="text-red-950 block mb-1">❌ מלכודת 2: זמן הערכת ערכי ברירת המחדל (Definition time)</strong>
                                ביטויי ה-Default מוגדרים בעת כתיבת הפרוצדורה. לכן, עלינו להעריך אותם מיידית ב-<code>value-of</code> של <code>proc-exp</code> בסביבת ההגדרה <code>env</code>. <br>
                                טעות נפוצה היא לשמור את הביטויים (expressions) כפי שהם, ולהעריך אותם רק בזמן הקריאה ב-<code>apply-procedure</code>, מה שיגרום להערכה שגויה בסביבה הדינמית של הקורא!
                            </div>
                            
                            <div class="bg-white p-3 rounded-lg border border-red-100">
                                <strong class="text-red-950 block mb-1">❌ מלכודת 3: בלבול בסדר הארגומנטים של list-ref</strong>
                                הסטודנט בפתרון ציין שאינו זוכר את סדר הפרמטרים של <code>list-ref</code>. <br>
                                <strong>זכרו:</strong> ב-Scheme/EOPL, החתימה היא <code>(list-ref lst index)</code> (קודם הרשימה ולאחר מכן האינדקס).
                            </div>
                        </div>
                    </div>
                    <p class="mt-6 text-slate-700 font-medium">
                        שמירה על בדיקות שלמות הסביבה (Exhaustive scope checks) היא ההבדל בין ציון טוב לציון מושלם במבחן!
                    </p>
                `,
                code: `;; פונקציות העזר לבדיקת הכלה וכפילויות:

(define subset?
  (lambda (lst1 lst2)
    (cond
      ((null? lst1) #t)
      ((member (car lst1) lst2) (subset? (cdr lst1) lst2))
      (else #f))))

(define has-dup?
  (lambda (lst)
    (cond
      ((null? lst) #f)
      ((member (car lst) (cdr lst)) #t)
      (else (has-dup? (cdr lst))))))

(define index-of
  (lambda (element lst)
    (letrec ((helpr (lambda (e l idx)
                      (cond
                        ((null? l) -1)
                        ((equal? (car l) e) idx)
                        (else (helpr e (cdr l) (+ 1 idx)))))))
      (helpr element lst 0))))`
            }
        ];

        let currentStep = 0;
        const stepTitle = document.getElementById('step-title');
        const stepNumberBadge = document.getElementById('step-number-badge');
        const stepExplanation = document.getElementById('step-explanation');
        const codeContainer = document.getElementById('code-container');
        const codeBlock = document.getElementById('code-block');
        const fileName = document.getElementById('file-name');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const stepList = document.getElementById('step-list');
        const stepCounter = document.getElementById('step-counter');
        const contentContainer = document.getElementById('content-container');

        function init() {
            renderSidebar();
            updateUI();
        }

        function renderSidebar() {
            stepList.innerHTML = '';
            steps.forEach((step, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${index === currentStep ? 'active-nav' : ''}`;
                btn.onclick = () => goToStep(index);
                btn.innerHTML = `<span>${index}: ${step.title}</span>`;
                stepList.appendChild(btn);
            });
        }

        function updateUI() {
            const step = steps[currentStep];

            // Fade out
            contentContainer.classList.remove('fade-enter-active');
            contentContainer.classList.add('fade-enter');

            setTimeout(() => {
                stepNumberBadge.textContent = "תחנה " + currentStep;
                stepTitle.textContent = step.title;
                stepExplanation.innerHTML = step.explanation;

                if (step.code && step.filename) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-regular fa-file-code ml-2"></i>${step.filename}`;
                    codeBlock.textContent = step.code;
                    if (window.Prism) {
                        Prism.highlightElement(codeBlock);
                    }
                } else {
                    codeContainer.classList.add('hidden');
                }

                prevBtn.disabled = currentStep === 0;
                stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;

                if (currentStep === steps.length - 1) {
                    nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
                } else {
                    nextBtn.innerHTML = 'המשך <i class="fa-solid fa-arrow-left mr-2"></i>';
                }

                renderSidebar();

                // Fade in
                contentContainer.classList.remove('fade-enter');
                contentContainer.classList.add('fade-enter-active');
            }, 150);
        }

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        // Start initialization
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
