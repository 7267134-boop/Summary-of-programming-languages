    <script>
        let hoverCloseTimer = null;

        function clearCloseTimer() {
            if (hoverCloseTimer) {
                clearTimeout(hoverCloseTimer);
                hoverCloseTimer = null;
            }
        }

        function startCloseTimer() {
            if (tooltipState !== 3) return;
            clearCloseTimer();
            hoverCloseTimer = setTimeout(() => {
                closeModal(null, true);
            }, 300); // 300ms delay to allow mouse movement to modal
        }

        // Global click listener to close modal when clicking outside in click mode
        document.addEventListener('click', (event) => {
            const modal = document.getElementById('explanation-modal');
            const modalCard = document.getElementById('modal-card');

            if (!modal.classList.contains('hidden')) {
                // If the click is NOT inside the modal-card, and NOT on an interactive tooltip
                if (!modalCard.contains(event.target) && !event.target.closest('.interactive-tooltip')) {
                    closeModal(null, true);
                }
            }
        });
        const explanationsDict = {
            
            "step1_1": `<div class="space-y-3">
                <p>זהו עדכון גרסה לפקודת ה-<code>proc</code> הוותיקה שלנו.<br>בעבר, התבנית הייתה <code>"proc" "(" identifier ")" expression</code>. עכשיו הכנסנו לתבנית שחקן חדש: <code>type</code>.<br>הפרסר שלנו מחייב מעכשיו את המתכנת לכתוב את סוג הנתון <em>לפני</em> שם המשתנה (למשל: <code>proc (int x) +(x, 1)</code>). כשהפרסר יקרא את הטקסט הזה, הוא יארוז אותו לצומת (AST node) מסוג <code>proc-exp</code> ששומר בתוכו גם את המידע על הטיפוס הנדרש. החוזה נחתם כבר בשלב קריאת הקוד.</p>

            "step1_3": `<div class="space-y-3">
                <p>זהו הקסם של העמסת פונקציות. הוספנו ביטוי (שהוא תחת הקטגוריה <code>expression</code> ולכן מייצר פעולה) עם תחביר מאוד ספציפי וארוך:</p>
                <ol class="list-decimal list-inside ml-4">
                <li><code>"overload"</code> - מילת המפתח שמפעילה את המנגנון.</li>
                <li><code>identifier</code> (הראשון) - השם של הפונקציה הקיימת שאנחנו רוצים "לשדרג" או להוסיף לה יכולת (למשל פונקציה בשם <code>my-func</code>).</li>

                <li><code>expression</code> - גוף הפונקציה החדש שיתבצע במקרה הזה.</li>
                </ol>
                <p>הפרסר ייקח את כל המשפט הארוך הזה, למשל: <code>overload my-func with (bool flag) if flag...</code>, ויארוז אותו לתוך קופסה חכמה שנקראת <code>overload-exp</code>.</p>
            </div>`,

            "step2_1": `<div class="space-y-3">

            "step2_2": `<div class="space-y-3">

            </div>`,

            "step3_1": `<div class="space-y-3">
                <p>המפרש קורא ביטוי של יצירת פונקציה רגילה (למשל <code>proc (int x) x</code>). בעבר, השורה הזו הייתה פשוט מעבירה את <code>typ</code>, <code>var</code> ו-<code>body</code> ישירות לתוך קופסת ה-<code>procedure</code>.<br>עכשיו, אנחנו עוטפים כל אחד מהם ב-<code>(list ...)</code>. זה בדיוק קניית "ארונית התיוק". אנחנו אומרים למפרש: "תיצור את הפונקציה, אבל אל תשמור את הנתונים כערכים בודדים, אלא כרשימות באורך 1". זה מבטיח שהפונקציה תתאים למבנה הנתונים החדש שדורש <code>(list-of type?)</code> וכו', ושיהיה אפשר להרחיב אותה בעתיד.</p>
            </div>`,

            "step3_2": `<div class="space-y-3">
                <p>כאן מתחיל הקסם של העדכון. כשהמפרש רואה פקודת <code>overload</code>, הדבר הראשון שהוא חייב לעשות זה <strong>למצוא את הפונקציה הקיימת</strong>.<br>
                <ul>
                <li><code>(apply-env env p-name)</code>: הוא מחפש בסביבה באיזו "כתובת זיכרון" יושבת הפונקציה ששמה <code>p-name</code> (למשל, חדר 104).</li>
                <li><code>(deref ...)</code>: פעולה קריטית! הוא ניגש פיזית לזיכרון (Store) ושולף משם את הערך האמיתי שנמצא בתא הזה.</li>
                <li><code>(expval->proc ...)</code>: הוא "מקלף" את עטיפת ה-<code>proc-val</code> הרגילה, ונשאר עם מבנה ה-<code>procedure</code> עצמו, ושומר אותו במשתנה <code>proc1</code>.</li>
                </ul></p>
            </div>`,

            "step3_3": `<div class="space-y-3">
                <p>המפרש פותח את ארונית התיוק הקיימת (<code>proc1</code>). בעזרת ה-<code>cases</code>, הוא שולף החוצה את כל הרשימות שהיו קיימות שם עד עכשיו: רשימת הטיפוסים הישנה (<code>types</code>), שמות המשתנים (<code>vars</code>), גופי הפונקציה (<code>bodies</code>), ואת סביבת ההולדה המקורית (<code>saved-env</code>).</p>
            </div>`,

            "step3_4": `<div class="space-y-3">
                <p>בניית הרשימות החדשות. המפרש משתמש בפקודה <code>cons</code>, שתפקידה לקחת איבר בודד ולחבר אותו <strong>לתחילת</strong> הרשימה.<br>למשל, הוא לוקח את הטיפוס החדש שהגיע בפקודת ה-overload (<code>typ</code>), ומחבר אותו לתחילת רשימת הטיפוסים הקיימת (<code>types</code>).<br><em>הערה חשובה:</em> העובדה שמשתמשים ב-<code>cons</code> (הוספה להתחלה) אומרת שאם יש התנגשות טיפוסים (למשל פעמיים הגדירו התנהגות ל-<code>int</code>), <strong>ההגדרה החדשה ביותר תנצח</strong>, כי היא תהיה הראשונה ברשימה כשהמפרש יחפש בה!</p>
            </div>`,

            "step3_5": `<div class="space-y-3">
                <div class="bg-red-50 p-3 rounded border border-red-100 text-red-900">
                    הפקודה <code>setref!</code> (Set Reference) היא פקודה אגרסיבית שמשנה מצב (Side effect).<br>היא הולכת לאותה כתובת זיכרון בדיוק שבה מצאנו את הפונקציה קודם (<code>apply-env env p-name</code>), ו<strong>דורסת</strong> את התוכן של תא הזיכרון הזה. מה היא שמה במקום? את הפונקציה שלנו עטופה מחדש ב-<code>proc-val</code>, רק שהפעם היא מכילה את הרשימות המעודכנות והארוכות יותר (<code>new-types</code>, <code>new-vars</code>, <code>new-bodies</code>).<br>הסביבה המקורית (<code>saved-env</code>) נשמרת כמו שהיא.
                </div>
            </div>`,

            "step3_6": `<div class="space-y-3">
                <p>למה מחזירים את המספר 27?<br>בקורסי שפות תכנות (כמו זה שמבוסס על EOPL), לפעמים יש פקודות שכל המטרה שלהן היא <strong>השפעת צד</strong> (Side effect) ולא תוצאה חשבונית. הפקודה <code>overload</code> רק באה לעדכן את הזיכרון, היא לא אמורה להחזיר תוצאה שאפשר לעשות איתה חיבור או חיסור. ובכל זאת, כל ביטוי במפרש <em>חייב</em> להחזיר <code>expval</code> חוקי. המספר 27 הפך לבדיחה פנימית/מוסכמה בספרות המקצועית עבור "הפעולה בוצעה בהצלחה ואין לי באמת מה להחזיר לך". זה היה יכול להיות גם <code>(num-val 0)</code> או פשוט ערך "Void" אם היה מוגדר כזה.</p>
            </div>`,

            "step4_1": `<div class="space-y-3">
                <p>שתי הפונקציות האלו פותרות בעיה ארכיטקטונית חשובה במפרשים: <strong>איך משווים בין שני דברים שנראים שונה בזיכרון?</strong><br>
                <ul>
                <li>הארגומנט שהמשתמש שלח (<code>arg</code>) הוא ערך ריצה מסוג <code>expval</code> (למשל, קופסה סגורה של <code>(num-val 5)</code>).</li>
                <li>הטיפוס ששמרנו בארונית התיוק (<code>typ</code>) הוא מבנה תחבירי מסוג <code>type</code> (למשל, קופסה ריקה של <code>(int-type)</code>).</li>
                </ul><br>
                אי אפשר להשוות ביניהם ישירות עם <code>equal?</code> כי הם סוגי נתונים (Datatypes) שונים לחלוטין במפרש שלנו. לכן, שתי הפונקציות האלו משמשות כ"מתרגמות": הן לוקחות את שני המבנים השונים ומנרמלות אותם ל<strong>סמל פשוט של Scheme</strong> (כמו <code>'int</code>, <code>'bool</code> או <code>'func</code>). כעת, כשיש לנו שני סמלים פשוטים, המפרש יכול להשוות ביניהם בקלות.</p>
            </div>`,

            "step4_2": `<div class="space-y-3">
                <p>זוהי פונקציית הלוגיקה המרכזית. היא מקבלת את שלוש הרשימות המקבילות ששמרנו בתוך ה-<code>procedure</code> (רשימת הטיפוסים המוצהרים, רשימת שמות הפרמטרים, ורשימת גופי הפונקציות), יחד עם הסביבה והארגומנט האמיתי.<br><strong>תנאי העצירה:</strong> אם המפרש סרק את כל רשימת הטיפוסים (<code>(null? types)</code>) והגיע לסופה בלי לעצור, המשמעות היא שהמתכנת ניסה להריץ את הפונקציה עם טיפוס נתון שלא הוגדר עבורה אף overload. המפרש עוצר את הריצה וזורק שגיאה חמורה: <code>"no matching overload"</code>.</p>
            </div>`,

            "step4_3": `<div class="space-y-3">
                <p>אם הרשימה לא ריקה, המפרש מבצע את הבדיקה. הוא לוקח את הטיפוס הראשון ברשימה (<code>(car types)</code>), מתרגם אותו לסמל, ולוקח את הארגומנט האמיתי (<code>arg</code>), מתרגם אותו לסמל, ומשווה ביניהם בעזרת <code>equal?</code>.<br><br><strong>אם יש התאמה (המקרה המנצח):</strong> הגענו אל הפקיד הנכון! כעת צריך להריץ את גוף הפונקציה המתאים:<br>
                <ol>
                <li><code>(car bodies)</code>: המפרש שולף את גוף הפונקציה שנמצא באותו אינדקס בדיוק ברשימת הגופים.</li>
                <li><code>(extend-env (car vars) (newref arg) env)</code>: המפרש מייצר את סביבת הריצה עבור הגוף הזה. הוא לוקח את שם המשתנה הספציפי שמתאים לגרסה הזו (<code>(car vars)</code>), קושר אותו לתא זיכרון חדש שמכיל את הארגומנט האמיתי (<code>(newref arg)</code>), ומלביש את זה על הסביבה הנוכחית.</li>
                <li><code>value-of</code>: המפרש מריץ את הגוף בתוך הסביבה המורחבת ומחזיר את תוצאת החישוב.</li>
                </ol></p>
            </div>`,

            "step4_4": `<div class="space-y-3">
                <p>אם הטיפוס הראשון לא מתאים, המפרש עובר לשורה הבאה בטבלה. הוא מפעיל קריאה רקורסיבית, כאשר הוא "חותך" את ראש הרשימות בעזרת <code>cdr</code> ומעביר את שאר האיברים (<code>(cdr types)</code>, <code>(cdr vars)</code>, <code>(cdr bodies)</code>). החיפוש נמשך באופן סינכרוני ומקביל על פני כל הרשימות עד למציאת הגרסה הנכונה.</p>
            </div>`,

            "step4_5": `<div class="space-y-3">
                <div class="bg-emerald-50 p-3 rounded border border-emerald-100 text-emerald-900">
                    זהו עדכון לפונקציית הליבה של המפרש, הפונקציה שמזוקקת לתוך כל קריאה לפונקציה בשפה שלנו. כשהמפרש נתקל בביטוי של הפעלה (כמו <code>(f 5)</code>), הוא מגיע לכאן.<br>הוא פותח את קופסת ה-<code>proc1</code>, שולף ממנה את רשימות הנתונים המקבילות, ופשוט "מזניק" את נתב השיחות החכם שלנו (<code>apply-correct-proc</code>) עם הארגומנט שסופק.
                </div>
            </div>`

<h4>המודל המנטלי: משרד הקבלה והמוקד החכם</h4>
<p><strong>סוכנות התעסוקה (פונקציות וטיפוסים):</strong><br>עד עכשיו, כשכתבת פונקציה בשפה, פשוט אמרת "אני צריך עובד שיקראו לו x" (למשל, <code>proc (x)</code>). לא היה אכפת לך מאיזה רקע הוא בא – האם הוא יביא איתו מספר, ערך בוליאני או פונקציה אחרת. גילית את זה רק כשהוא התחיל לעבוד.<br>מעכשיו, משרד הקבלה דורש תעודת מקצוע מראש: "אני צריך עובד מסוג 'מספר' שיקראו לו x" (<code>proc (int x)</code>). זהו חוזה התקשרות ברור. כדי שהמשרד ידע לקרוא את התעודות האלו, אנחנו חייבים להוסיף אותן לקטלוג של המשרד.</p>
<p><strong>המוקד החכם (Overload):</strong><br>תאר לך שיש לך מוקד שירות לקוחות בשם "הדפסה". עד היום, המוקדן ידע לעשות רק דבר אחד קבוע. עכשיו, אתה משדרג את המוקד לנתב שיחות חכם: אתה אומר למערכת "אם מתקשר אליך לקוח שמציג תעודת 'בוליאני', תנתב אותו לפקיד אחר, ותן לפקיד הזה את קלסר ההוראות הבא". אנחנו בעצם מוסיפים יכולות חדשות לאותו השם (העמסת פונקציות - Overloading), כשהניתוב נקבע אך ורק על פי <em>סוג</em> הלקוח.</p>`,

<p>ההפרדה הזו לשתי משפחות (<code>expression</code> לעומת <code>type</code>) היא הבסיס שמאפשר לנו ליצור כלים מתקדמים. בעזרת צומת ה-<code>overload-exp</code> שנייצר כאן, בשלבים הבאים של הקורס – כאשר המפרש יגיע לשלב הריצה (<code>value-of</code>) או לשלב בדיקת הטיפוסים (<code>type-of</code>) – הוא יוכל להסתכל על עץ התחביר הזה ולומר: "אה! אני רואה שיש לפונקציה הזו כמה גרסאות. בוא נבדוק מה הטיפוס שהמשתמש העביר, וננתב את הקוד בדיוק ללוגיקה הנכונה!".</p>`

<p>השינוי הזה הוא התוצאה הישירה של תחביר ה-<code>overload</code> שהוספנו בשלב הקודם. אם קודם רק לימדנו את השפה <em>לקרוא</em> את המילה overload, כאן אנחנו בונים את הכלי הפיזי בזיכרון שידע <em>לאחסן</em> את המשמעות שלה.</p>
<p>כדי להבין בדיוק למה המבנה הזה השתנה מרמת היחיד לרמת הרשימה, נבנה את המודל המנטלי.</p>
<h4>המודל המנטלי: ממפעל של איש אחד, למחלקה שלמה</h4>
<p>תאר לעצמך שפונקציה עד היום הייתה עובד אחד שמבצע משימה אחת. כשהגדרת פונקציה, המפרש יצר "קלסר" (Closure) ובו שמר שלושה דברים בלבד:</p>
<ol class="list-decimal list-inside ml-4">
<li>מה שם העובד שיבצע את העבודה (<code>var</code>).</li>
<li>דף הוראות אחד בודד (<code>body</code>).</li>
<li>סביבת העבודה שבה העובד נמצא (<code>env</code>).</li>

            const btn = document.getElementById('tooltip-cycler');
            const icon = document.getElementById('cycler-icon');
            const text = document.getElementById('cycler-text');
            const glow = document.getElementById('cycler-glow');

            // Animation reset
            btn.classList.remove('cycler-anim');
            void btn.offsetWidth; // trigger reflow
            btn.classList.add('cycler-anim');

            icon.className = `fa-solid ${config.icon} text-3xl ${config.color} transition-transform group-hover:scale-110 drop-shadow-[0_0_8px_rgba(255,255,255,0.1)]`;
            text.textContent = config.text;

            glow.className = `absolute bottom-0 left-0 w-full h-[3px] bg-gradient-to-r from-transparent ${config.glow} to-transparent ${config.glowOp} transition-all duration-300`;

            initTooltips();
        }

        function cycleTooltipState() {
            tooltipState = tooltipState === 3 ? 1 : tooltipState + 1;
            localStorage.setItem('globalTooltipState', tooltipState);
            updateCyclerUI();
        }

        // Modal Functions
        function openModal(codeText, explanationHtml) {
            const modal = document.getElementById('explanation-modal');
            const modalCard = document.getElementById('modal-card');
            const modalCode = document.getElementById('modal-code');
            const modalExplanation = document.getElementById('modal-explanation');

            modalCode.textContent = codeText.replace(/^\n+|\n+$/g, '');
            Prism.highlightElement(modalCode);
            modalExplanation.innerHTML = explanationHtml;

            modal.classList.remove('hidden');
            // Trigger reflow for animation
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            modalCard.classList.remove('scale-95');
            modal.classList.add('flex');
        }

        function closeModal(event, force = false) {
            if (event && !force) {
                // If they clicked directly on the modal backdrop, close it.
                if (event.target !== document.getElementById('explanation-modal')) {
                    return;
                }
            }

            const modal = document.getElementById('explanation-modal');
            const modalCard = document.getElementById('modal-card');

            modal.classList.add('opacity-0');
            modalCard.classList.add('scale-95');

            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        function initTooltips() {
            // Reset state
            const marks = document.querySelectorAll('mark.interactive-tooltip');

            marks.forEach(m => {
                m.classList.remove('tooltip-active-style');
                m.style.pointerEvents = 'none';

                // Remove old listeners by cloning
                const newMark = m.cloneNode(true);
                m.parentNode.replaceChild(newMark, m);
            });

            if (tooltipState === 1) return;

            const freshMarks = document.querySelectorAll('mark.interactive-tooltip');
            freshMarks.forEach(m => {
                m.classList.add('tooltip-active-style');
                m.style.pointerEvents = 'auto';

                const explanationKey = m.getAttribute('data-key');
                const explanation = explanationsDict[explanationKey] || "הסבר חסר";
                const codeText = m.textContent;

                if (tooltipState === 2) {
                    m.addEventListener('click', () => openModal(codeText, explanation));
                } else if (tooltipState === 3) {
                    m.addEventListener('mouseenter', () => {
                        clearCloseTimer();
                        openModal(codeText, explanation);
                    });
                    m.addEventListener('mouseleave', () => {
                        startCloseTimer();
                    });
                }
            });
        }

        function toggleAccordion(id) {
            const content = document.getElementById('acc-content-' + id);
            const icon = document.getElementById('acc-icon-' + id);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                content.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        function renderSidebar() {
            stepList.innerHTML = '';
            steps.forEach((step, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${index === currentStep ? 'active-nav' : ''}`;
                btn.onclick = () => goToStep(index);
                btn.innerHTML = `<span>${step.id === 'final' ? '<i class="fa-solid fa-flag-checkered mr-2"></i> ' : (index) + ': '}${step.title}</span>`;
                stepList.appendChild(btn);
            });
        }

        function updateUI() {
            const step = steps[currentStep];

            stepNumberBadge.textContent = step.isFinal ? "שלב סופי" : ("תחנה " + currentStep);
            stepTitle.textContent = step.title;
            stepExplanation.innerHTML = '';
            stepAfterExplanation.innerHTML = '';
            codeContainer.classList.add('hidden');

            if (step.isImageOnly) {
                const savedImg = localStorage.getItem('q1_2025c_83_image');
                const imgSrc = savedImg ? savedImg : step.imageSrc;

                stepExplanation.innerHTML = `
                <div class="text-center">
                    <img id="step-0-image" src="${imgSrc}" class="max-w-full h-auto rounded-xl shadow-lg border border-slate-200 mx-auto" onerror="this.style.display='none'; document.getElementById('image-upload-fallback').style.display='block';">
                    <div id="image-upload-fallback" class="hidden mt-4 p-8 border-2 border-dashed border-slate-300 rounded-xl bg-slate-50">
                        <i class="fa-regular fa-image text-4xl text-slate-400 mb-3"></i>
                        <p class="text-slate-500 mb-4 font-bold text-lg">תמונת השאלה חסרה</p>
                        <p class="text-slate-400 mb-6 text-sm">אנא בחר את קובץ התמונה שהורדת כדי להציג אותו כאן. (התמונה תישמר בדפדפן שלך לתמיד!)</p>
                        <input type="file" id="image-upload-input" accept="image/*" class="block w-full max-w-xs mx-auto text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-blue-50 file:text-primary hover:file:bg-blue-100 cursor-pointer">
                    </div>
                </div>`;
            } else if (step.isFinal) {
                let html = '<div class="space-y-12">';
                steps.forEach(s => {
                    if (s.code && !s.isFinal) {
                        html += `
                        <div>
                            <h3 class="text-xl font-bold text-slate-800 mb-4">${s.title}</h3>
                            <div class="code-window">
                                <div class="code-window-header ltr" dir="ltr">
                                    <div class="mac-buttons">
                                        <div class="mac-btn mac-close"></div>
                                        <div class="mac-btn mac-min"></div>
                                        <div class="mac-btn mac-max"></div>
                                    </div>
                                    <div class="code-filename"><i class="fa-solid fa-code mr-2"></i>${s.filename}</div>
                                </div>
                                <div class="code-body ltr text-left" dir="ltr">
                                    <pre><code class="language-scheme">${s.code}</code></pre>
                                </div>
                            </div>
                        </div>
                        `;
                    }
                });
                html += '</div>';
                stepExplanation.innerHTML = html;
                Prism.highlightAllUnder(stepExplanation);
            } else {
                if (step.mentalModelBefore) {
                    stepExplanation.innerHTML = `
                    <button onclick="toggleAccordion('before')" class="accordion-btn rounded-xl bg-purple-50 text-purple-900 border-purple-200 hover:bg-purple-100 flex items-center justify-between p-4 w-full font-bold mb-6 border border-dashed border-purple-300 shadow-sm">
                       <span><i class="fa-solid fa-brain mr-2 ml-2"></i> מודל מנטלי לפני הקוד</span>
                       <i id="acc-icon-before" class="fa-solid fa-chevron-down transition-transform"></i>
                    </button>
                    <div id="acc-content-before" class="hidden bg-white border border-purple-100 p-6 rounded-xl shadow-sm mb-6 text-slate-700 leading-relaxed text-[1.05rem]">
                        ${step.mentalModelBefore}
                    </div>`;
                }

                if (step.code) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-solid fa-code mr-2"></i>${step.filename}`;
                    codeBlock.innerHTML = step.code;
                    Prism.highlightElement(codeBlock);

                    if (step.mentalModelAfter) {
                        stepAfterExplanation.innerHTML = `
                        <button onclick="toggleAccordion('after')" class="accordion-btn rounded-xl bg-indigo-50 text-indigo-900 border-indigo-200 hover:bg-indigo-100 flex items-center justify-between p-4 w-full font-bold mb-4 mt-8 border border-dashed border-indigo-300 shadow-sm">
                           <span><i class="fa-solid fa-lightbulb mr-2 ml-2"></i> סיכום לאחר הקוד</span>
                           <i id="acc-icon-after" class="fa-solid fa-chevron-down transition-transform"></i>
                        </button>
                        <div id="acc-content-after" class="hidden bg-white border border-indigo-100 p-6 rounded-xl shadow-sm mb-6 text-slate-700 leading-relaxed text-[1.05rem]">
                            ${step.mentalModelAfter}
                        </div>`;
                    }
                }
            }

            prevBtn.disabled = currentStep === 0;
            stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;

            if (currentStep === steps.length - 1) {
                nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
            } else {
                nextBtn.innerHTML = 'המשך <i class="fa-solid fa-arrow-left mr-2"></i>';
            }

            renderSidebar();

            setTimeout(() => {
                initTooltips();
            }, 50);

            contentContainer.classList.remove('fade-enter');
            contentContainer.classList.add('fade-enter-active');
        }

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-collapsed');
            const isCollapsed = document.body.classList.contains('sidebar-collapsed');
            localStorage.setItem('sidebarCollapsed', isCollapsed);

            // Update icon direction
            const icon = document.getElementById('sidebar-toggle-icon');
            if (isCollapsed) {
                icon.className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            } else {
                icon.className = 'fa-solid fa-chevron-right text-lg transition-transform duration-300';
            }
        }

        function init() {
            // Restore tooltip state from localStorage
            const savedState = localStorage.getItem('globalTooltipState');
            if (savedState) {
                tooltipState = parseInt(savedState);
            }
            updateCyclerUI();

            // Create and inject sidebar toggle button
            const toggleBtn = document.createElement('button');
            toggleBtn.id = 'sidebar-toggle-btn';
            toggleBtn.onclick = toggleSidebar;
            toggleBtn.innerHTML = '<i id="sidebar-toggle-icon" class="fa-solid fa-chevron-right text-lg transition-transform duration-300"></i>';
            document.body.appendChild(toggleBtn);

            // Load sidebar collapsed state from localStorage
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (isCollapsed) {
                document.body.classList.add('sidebar-collapsed');
                document.getElementById('sidebar-toggle-icon').className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            }

            updateUI();
        }

        init();
    </script>
    <script src="ai_widget.js"></script>
</body>

</html>
