                explanation: `
                    <p class="mb-4">במבחן זה (ממועד א2 2025ב), אנו נדרשים להוסיף תמיכה ב-<strong>העמסת פרוצדורות (Procedure Overloading)</strong> בשפת Implicit-Refs.</p>
                    <div class="bg-blue-50 p-6 rounded-lg border border-blue-200 mb-6 shadow-sm">
                        <h4 class="font-bold text-blue-900 text-base mb-2">דרישות השפה החדשות:</h4>
                        <div class="bg-white p-3 rounded border border-blue-100 font-mono text-sm mb-4 ltr text-left">
Expression ::= proc (Type identifier) Expression [proc-exp]<br>
Expression ::= overload identifier with (Type identifier) Expression [overload-exp]<br>
Type ::= int | bool | func
                        </div>
                        <ul class="list-disc list-inside text-sm text-blue-900 space-y-2">
                            <li>שינוי הגדרת <code>proc</code> כך שתכלול הגדרת טיפוס עבור המשתנה.</li>
                            <li>ביטוי <code>overload</code> המקבל שם פרוצדורה קיימת, טיפוס פרמטר, שם פרמטר וגוף חדש, ומעמיס אותה.</li>
                        </ul>
                    </div>

                    <h3 class="text-xl font-bold text-slate-800 mb-3 border-b pb-2">מה אנחנו מחפשים ומנתחים בשלב זה?</h3>
                    <ul class="space-y-3 text-slate-700">
                        <li>
                            <span class="font-semibold text-slate-900">1. מבנה הנתונים של פרוצדורה:</span> 
                            פרוצדורה כבר לא מכילה פרמטר יחיד וגוף יחיד, אלא רשימה של חתימות מועמסות. אנו נשתמש ב-<strong>רשימות מקבילות</strong> עבור הטיפוסים, המשתנים והגופים של הפונקציות המועמסות.
                        </li>
                        <li>
                            <span class="font-semibold text-slate-900">2. השפעת Implicit-Refs:</span> 
                            מכיוון שאנו עובדים בשפה עם הפניות משתמעות (Implicit-Refs), כאשר מתבצע overload, אנו לא משנים את הסביבה אלא <strong>מעדכנים את תא הזיכרון (Reference) הקיים</strong> שבו שמורה הפרוצדורה בעזרת <code class="bg-slate-100 px-1 rounded text-primary">setref!</code>.
                        </li>
                        <li>
                            <span class="font-semibold text-slate-900">3. בדיקת טיפוסים דינמית:</span>

                `,

;; 1. lang.scm: עדכון הגדרת proc והוספת overload וטיפוסים.
;; 2. data-structures.scm: עדכון datatype proc לרשימות מקבילות.
;; 3. interp.scm (value-of): מימוש proc-exp ו-overload-exp (שימוש ב-setref!).

            },
            {
                id: 1,
                title: "שלב 1: עדכון התחביר (lang.scm)",
                filename: "lang.scm",
                explanation: `
                    <p class="mb-4">ראשית, עלינו לעדכן את הדקדוק כדי לאפשר קליטה של סוגי טיפוסים וכן ביטויי proc ו-overload עם טיפוסים.</p>
                    
                    <div class="template-box">
                        <p class="text-emerald-900 font-medium">
                            "<strong>עדכון קובץ התחביר והדקדוק (lang.scm):</strong> נוסיף את כללי הגזירה החדשים לתוך הגדרת הדקדוק (the-grammar). פעולה זו תאפשר ל-Scanner ול-Parser לזהות את המילים השמורות החדשות שנוספו לשפה, לבנות מהן צמתים תואמים בעץ התחביר המופשט (AST), ולייצר עבורם פונקציות בנאי ושליפה אוטומטיות."
                        </p>
                    </div>

                    <h3 class="text-lg font-bold text-slate-800 mb-2">דגשים חשובים לעדכון התחביר:</h3>
                    <ul class="list-disc list-inside text-sm text-slate-700 space-y-2 mb-4">
                        <li><strong>עדכון proc-exp הקיים:</strong> שימו לב שביטוי proc משתנה וכעת הוא מצפה לפרמטר מסוג טיפוס <code>type</code> לפני ה-identifier.</li>
                        <li><strong>הגדרת משפחת הטיפוסים החדשה:</strong> נוסיף את שלושת הטיפוסים היסודיים של השפה (<code>int</code>, <code>bool</code>, <code>func</code>) כדי שהמנתח התחבירי ידע לייצר מהם עצים מוגדרים.</li>
                        <li><strong>הגדרת ביטוי ההעמסה:</strong> נגדיר את צומת ה-<code>overload-exp</code> המקבל את שם הפונקציה להעמסה, ואת חתימת הטיפוס, הפרמטר והגוף החדש שנוספו.</li>
                    </ul>
                `,
                code: `;; שינוי proc exp הקיים:
(expression
  ("proc" "(" type identifier ")" expression)
  proc-exp)

;; הוספת הטיפוסים החדשים:
(type
  ("int")
  int-type)

(type
  ("bool")
  bool-type)

(type
  ("func")
  func-type)

;; הוספת overload:
(expression
  ("overload" identifier "with" "(" type identifier ")" expression)
  overload-exp)`
            },
            {
                id: 2,
                title: "שלב 2: עדכון מבני נתונים (data-structures.scm)",
                filename: "data-structures.scm",
                explanation: `
                    <p class="mb-4">אנו נדרשים לשנות את המבנה הפנימי של פרוצדורה בזיכרון.</p>
                    
                    <div class="template-box">
                        <p class="text-emerald-900 font-medium">
                            "<strong>עדכון מבני הנתונים (data-structures.scm):</strong> נבחן האם התוספת לשפה דורשת שינוי במבנה הערכים בזיכרון. בשאלה זו, הפרוצדורה (proc) עצמה משנה את ייצוגה הפנימי. במקום לשמור פרמטר בודד וגוף בודד, עלינו לשמור רשימה של חתימות. נעדכן את ה-datatype <code>proc</code> כך שיחזיק שלוש רשימות מקבילות: רשימת טיפוסים, רשימת שמות משתנים, ורשימת ביטויי גוף, בנוסף לסביבה לקראת קריאה."
                        </p>
                    </div>

                    <h3 class="text-lg font-bold text-slate-800 mb-2">דגשי המבנה ומבנה הרשימות המקבילות:</h3>
                    <ul class="list-disc list-inside text-sm text-slate-700 space-y-2 mb-4">
                        <li><strong>מבנה רשימות מקבילות:</strong> פתרון זה משתמש ב-<code>(list-of type?)</code>, <code>(list-of symbol?)</code>, ו-<code>(list-of expression?)</code>. זוהי דרך נקייה מאוד שמונעת יצירת datatype מורכב נוסף ומאפשרת טיפול רקורסיבי מהיר ופשוט.</li>
                        <li><strong>שימור הסביבה הלקסית:</strong> הפרוצדורה ממשיכה להחזיק את הסביבה בה היא הוגדרה (הסביבה הסגורה) לצורך קישור משתנים חופשיים בעת קריאה.</li>
                    </ul>
                `,
                code: `;; בקובץ data-structures נעדכן את proc datatype:
(define-datatype proc proc?
  (procedure
    (types (list-of type?))
    (vars (list-of symbol?))
    (bodies (list-of expression?))
    (env environment?)))`
            },
            {
                id: 3,
                title: "שלב 3: עדכון מנוע ההערכה (interp.scm - value-of)",
                filename: "interp.scm",
                explanation: `
                    <p class="mb-4">כעת אנו מגיעים לביצוע בזמן ריצה בתוך הפונקציה <code>value-of</code>.</p>
                    
                    <div class="template-box">
                        <p class="text-emerald-900 font-medium">
                            "<strong>עדכון פונקציית ההערכה (value-of בקובץ interp.scm):</strong> נוסיף טיפול בשני הביטויים החדשים. עבור <code>proc-exp</code>, ניצור פרוצדורה חדשה עם רשימות בעלות איבר בודד (האיבר הנוכחי). עבור <code>overload-exp</code>, נשלוף את ה-Reference של המשתנה בעזרת apply-env, נחלץ את ערכו ב-deref, ונוודא שהוא אכן פרוצדורה בעזרת expval->proc. לאחר מכן, נחלץ את הרשימות המקבילות הקיימות ונוסיף להן את המידע החדש בראשן (cons). נעדכן את תא הזיכרון הקיים בעזרת setref! ונחזיר ערך מבוטא סתמי."
                        </p>
                    </div>

                    <h3 class="text-lg font-bold text-slate-800 mb-2">דגשים קריטיים על ניהול הזיכרון בריצה:</h3>
                    <ul class="list-disc list-inside text-sm text-slate-700 space-y-2 mb-4">
                        <li><strong>מדוע נדרש setref! ומתי:</strong> בסביבת Implicit-Refs, המשתנים מופנים לתאי זיכרון. כדי להבטיח שהעמסת פונקציה תשפיע על כל חלקי הקוד שמשתמשים בה (כולל קריאות רקורסיביות או קוד מרוחק), אנו חייבים לבצע שינוי של ערך התא הקיים במקום (In-place Mutation), ולא ליצור סביבה מורחבת חדשה.</li>
                        <li><strong>ערך החזרה:</strong> ביטוי השמה כמו <code>overload-exp</code> אינו מפיק ערך לוגי חדש, אך המפרש דורש לקבל חזרה <code>ExpVal</code>. לכן הקוד מחזיר ערך סתמי כגון <code>(num-val 27)</code> כדי למנוע קריסה.</li>
                    </ul>
                `,
                code: `;; בקובץ interp.scm : נוסיף ל- value-of:

(overload-exp (p-name typ var body)
  (let ((proc1 (expval->proc (deref (apply-env env p-name)))))
    (cases proc proc1
      (procedure (types vars bodies saved-env)
        (let ((new-types (cons typ types))
              (new-vars (cons var vars))
              (new-bodies (cons body bodies)))
          (begin
            (setref!
              (apply-env env p-name)
              (proc-val (procedure new-types new-vars
                                  new-bodies saved-env)))
            (num-val 27)
          ))))))

;; נשנה את proc-exp (גם ב- value-of):
(proc-exp (typ var body)
  (proc-val (procedure (list typ) (list var) (list body) env)))`

(define get-type-str
  (lambda (typ)
    (cases type typ
      (int-type () 'int)
      (bool-type () 'bool)
      (func-type () 'func)
    )))

(define apply-correct-proc
  (lambda (types vars bodies env arg)
    (if (null? types) (eopl:error "no matching overload")
      (if (equal? (get-type-str (car types)) (get-arg-type-str arg))
        (value-of (car bodies) (extend-env (car vars)
                                  (newref arg) env))
        (apply-correct-proc (cdr types) (cdr vars) (cdr bodies) env arg)
    ))))

(define apply-procedure
  (lambda (proc1 arg)
    (cases proc proc1
      (procedure (types vars bodies env)
        (apply-correct-proc types vars bodies env arg)
    ))))`

        let currentStep = 0;
        const stepTitle = document.getElementById('step-title');
        const stepNumberBadge = document.getElementById('step-number-badge');
        const stepExplanation = document.getElementById('step-explanation');
        const codeContainer = document.getElementById('code-container');
        const codeBlock = document.getElementById('code-block');
        const fileName = document.getElementById('file-name');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const stepList = document.getElementById('step-list');
        const stepCounter = document.getElementById('step-counter');
        const contentContainer = document.getElementById('content-container');

        function init() {
            renderSidebar();
            updateUI();
        }

        function renderSidebar() {
            stepList.innerHTML = '';
            steps.forEach((step, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${index === currentStep ? 'active-nav' : ''}`;
                btn.onclick = () => goToStep(index);
                btn.innerHTML = `<span>${index}: ${step.title}</span>`;
                stepList.appendChild(btn);
            });
        }

        function updateUI() {
            const step = steps[currentStep];

            // Fade out
            contentContainer.classList.remove('fade-enter-active');
            contentContainer.classList.add('fade-enter');

            setTimeout(() => {
                stepNumberBadge.textContent = "תחנה " + currentStep;
                stepTitle.textContent = step.title;
                stepExplanation.innerHTML = step.explanation;

                if (step.code && step.filename) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-regular fa-file-code ml-2"></i>${step.filename}`;
                    codeBlock.textContent = step.code;
                    if (window.Prism) {
                        Prism.highlightElement(codeBlock);
                    }
                } else {
                    codeContainer.classList.add('hidden');
                }

                prevBtn.disabled = currentStep === 0;
                stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;

                if (currentStep === steps.length - 1) {
                    nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
                } else {
                    nextBtn.innerHTML = 'המשך <i class="fa-solid fa-arrow-left mr-2"></i>';
                }

                renderSidebar();

                // Fade in
                contentContainer.classList.remove('fade-enter');
                contentContainer.classList.add('fade-enter-active');
            }, 150);
        }

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        // Start initialization
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
