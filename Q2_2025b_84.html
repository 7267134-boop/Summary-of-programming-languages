Guard ::= break : Expression

                    <p class="mb-4">כאן אנו מעדכנים את <code>value-of</code> ומממשים את הלולאה. נשווה בין דרכי המימוש של הסטודנט לדרכים המומלצות.</p>

                        </p>
                    </div>

                    <h3 class="text-lg font-bold text-slate-800 mb-2">1. הערכת גארדים: עצלה (Lazy) מול מיידית (Eager)</h3>
                    <div class="text-sm text-slate-700 space-y-2 mb-4">

                    <div class="text-sm text-slate-700 space-y-2 mb-4 font-mono">
                        <p>הסטודנט ביצע רקורסיה על ידי יצירת צומת AST חדש וקריאה מחדש ל-<code>value-of</code>:</p>

                        <p>זוהי לוגיקה נכונה למבחן ומאוד מקובלת, אך היא מסורבלת ומייצרת צמתים זמניים במפרש. הדרך התעשייתית היא להגדיר פונקציית עזר רקורסיבית מבוססת Scheme שמריצה את האיטרציות באופן ישיר.</p>

                code: `;; בקובץ interp.scm בתוך cases של value-of:

(forproc-exp (loopvar pvars pbodies guards body)
  (cond
    ((not (= (length pvars) (length pbodies)))
     (eopl:error 'forproc-exp "Not same length lists"))
    ((= 0 (length pvars))
     (num-val 27)) ; החזרת ערך דאמי תקין
    (else
      ;; בכל איטרציה מייצרים רפרנס חדש עבור משתנה הלולאה
      (let* ((new-env (extend-env loopvar
                        (newref (proc-val (procedure
                          (car pvars) (car pbodies) env))) env))
             ;; חילוץ הביטויים של הגארדים
             (exps (map (lambda (g)

                            (skip-guard (v) v)
                            (break-guard (v) v))) guards))

             (vals (map (lambda (e) (value-of e new-env)) exps))
             (i (index-of (bool-val #t) vals)))
        (cond
          ((= -1 i) ; אין אף גארד שהתקיים -> מבצעים את הגוף וממשיכים
           (begin
             (value-of body new-env)
             (value-of (forproc-exp loopvar
               (cdr pvars) (cdr pbodies) guards body) env)))
          (else
           (let ((act (action-of i guards)))
             (if (string=? act "skip") ; גארד מסוג skip -> מדלגים על הגוף וממשיכים
                 (value-of (forproc-exp loopvar (cdr pvars)
                             (cdr pbodies) guards body) env)
                 ; גארד מסוג break -> עוצרים מיד ומחזירים ערך דאמי

      (cases guard g
        (skip-guard (v) "skip")
        (break-guard (v) "break")))))

(define index-of
  (lambda (e lst)
    (letrec ((helpr (lambda (element list idx)
                      (cond
                        ((null? list) -1)
                        ((equal? (car list) element) idx)
                        (else (helpr element (cdr list) (+ 1 idx)))))))

                        </h3>
                        <p class="text-sm leading-relaxed">
                            בשאלות של לולאות וניהול הפניות ב-IMPLICIT-REFS, מומלץ להיזהר מהמלכודות הבאות:
                        </p>
                        
                        <div class="space-y-3 text-sm">
                            <div class="bg-white p-3 rounded-lg border border-red-100">
                                <strong class="text-red-950 block mb-1">❌ מלכודת 1: הקצאת רפרנס (newref) עבור משתנה הלולאה</strong>
                                בשפת IMPLICIT-REFS, כל קשירת משתנה חדש בסביבה דורשת הקצאת רפרנס. 
                                אם תבצעו <code>(extend-env loopvar (proc-val ...) env)</code> ללא שימוש ב-<code>newref</code>, מנוע הזיכרון יקרוס או שפעולת השמה (mutation) עתידית עליו תיכשל. 
                                חובה לכתוב <code>(newref (proc-val ...))</code>.
                            </div>
                            
                            <div class="bg-white p-3 rounded-lg border border-red-100">
                                <strong class="text-red-950 block mb-1">❌ מלכודת 2: סביבת הגדרת הפרוצדורה (Lexical scoping)</strong>
                                כשבונים את הפרוצדורה בכל איטרציה, יש להעביר את הסביבה הלקסיקלית שבה הלולאה מוגדרת <code>env</code> ולא את הסביבה המורחבת של האיטרציה הבודדת <code>new-env</code>. 
                                קשירת הפרוצדורה ל-new-env עלולה לגרום ללולאה אינסופית או לקריסה עקב מעגליות לא רצויה.
                            </div>
                            
                            <div class="bg-white p-3 rounded-lg border border-red-100">
                                <strong class="text-red-950 block mb-1">❌ מלכודת 3: החזרת ערך דאמי בסיום הלולאה וב-Break</strong>
                                ללולאה אין ערך חישוב מוחזר רשמי בשפה, אך כל ביטוי במפרש EOPL חייב להחזיר ערך מסוג <code>expval</code>. 
                                הקפידו להחזיר ערך דאמי תקין כמו <code>(num-val 27)</code> הן בסיום הלולאה והן בעצירתה עקב גארד מסוג break.
                            </div>
                        </div>
                    </div>
                    <p class="mt-6 text-slate-700 font-medium">
                        זכרו: הקפדה על חוקי ניהול המחסן של IMPLICIT-REFS תבטיח לכם פתרון תקין ומלא!
                    </p>
                `,
                code: `;; --- ריכוז נקודות תורפה וטיפים למבחן ---
;; 1. קשירת משתנה דורשת שימוש ב-newref בשפת IMPLICIT-REFS.
;; 2. רקורסיית לולאה מתקדמת בסביבה הלקסיקלית env.
;; 3. הקפדה על ערך החזרה דאמי (num-val 27) בכל נקודות היציאה מהלולאה.`
            }
        ];

        let currentStep = 0;
        const stepTitle = document.getElementById('step-title');
        const stepNumberBadge = document.getElementById('step-number-badge');
        const stepExplanation = document.getElementById('step-explanation');
        const codeContainer = document.getElementById('code-container');
        const codeBlock = document.getElementById('code-block');
        const fileName = document.getElementById('file-name');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const stepList = document.getElementById('step-list');
        const stepCounter = document.getElementById('step-counter');
        const contentContainer = document.getElementById('content-container');

        function init() {
            renderSidebar();
            updateUI();
        }

        function renderSidebar() {
            stepList.innerHTML = '';
            steps.forEach((step, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${index === currentStep ? 'active-nav' : ''}`;
                btn.onclick = () => goToStep(index);
                btn.innerHTML = `<span>${index}: ${step.title}</span>`;
                stepList.appendChild(btn);
            });
        }

        function updateUI() {
            const step = steps[currentStep];
            
            // Fade out
            contentContainer.classList.remove('fade-enter-active');
            contentContainer.classList.add('fade-enter');
            
            setTimeout(() => {
                stepNumberBadge.textContent = "תחנה " + currentStep;
                stepTitle.textContent = step.title;
                stepExplanation.innerHTML = step.explanation;
                
                if (step.code && step.filename) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-regular fa-file-code ml-2"></i>${step.filename}`;
                    codeBlock.textContent = step.code;
                    if (window.Prism) {
                        Prism.highlightElement(codeBlock);
                    }
                } else {
                    codeContainer.classList.add('hidden');
                }

                prevBtn.disabled = currentStep === 0;
                stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;
                
                if (currentStep === steps.length - 1) {
                    nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
                } else {
                    nextBtn.innerHTML = 'המשך <i class="fa-solid fa-arrow-left mr-2"></i>';
                }

                renderSidebar();
                
                // Fade in
                contentContainer.classList.remove('fade-enter');
                contentContainer.classList.add('fade-enter-active');
            }, 150);
        }

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        // Start initialization
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
