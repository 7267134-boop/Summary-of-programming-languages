    <script>
        let hoverCloseTimer = null;

        function clearCloseTimer() {
            if (hoverCloseTimer) {
                clearTimeout(hoverCloseTimer);
                hoverCloseTimer = null;
            }
        }

        function startCloseTimer() {
            if (tooltipState !== 3) return;
            clearCloseTimer();
            hoverCloseTimer = setTimeout(() => {
                closeModal(null, true);
            }, 300); // 300ms delay to allow mouse movement to modal
        }

        // Global click listener to close modal when clicking outside in click mode
        document.addEventListener('click', (event) => {
            const modal = document.getElementById('explanation-modal');
            const modalCard = document.getElementById('modal-card');

            if (!modal.classList.contains('hidden')) {
                // If the click is NOT inside the modal-card, and NOT on an interactive tooltip
                if (!modalCard.contains(event.target) && !event.target.closest('.interactive-tooltip')) {
                    closeModal(null, true);
                }
            }
        });
        const explanationsDict = {
            
            "step1_1": `<p>אנחנו אומרים למפרש: "אני עומד להוסיף לך עכשיו חוק חדש לקטגוריה הכללית שנקראת <code>expression</code> (ביטוי)". ביטוי זה כל דבר שמחזיר ערך (כמו מספר, משתנה, חיבור, או פונקציה).</p>`,
            "step1_2": `<p>זוהי <strong>התבנית (Concrete Syntax)</strong>. אנחנו אומרים ל"עיניים" של המפרש בדיוק אילו תווים לחפש במסוע:</p><ol class="list-decimal list-inside ml-4 space-y-2 mb-4"><li>חפש את התו המדויק <code>&lt;</code>.</li><li>אחריו, חפש משהו שמתאים לקטגוריה חדשה שנקראת <code>type</code> (נגדיר אותה בהמשך).</li><li>אחריו, חפש את התו <code>&gt;</code>.</li><li>אחריו, חפש את התו <code>(</code>.</li><li>אחריו, חפש משהו שהוא בעצמו <code>expression</code> (זה אומר שאפשר לשים פה כל ביטוי מורכב, אפילו עוד Casting! זה הקסם של הרקורסיה בדקדוק).</li><li>בסוף, חפש את התו <code>)</code>.</li></ol><p><em>לדוגמה, הטקסט <code>&lt;int&gt;(+ 2 3)</code> מתאים בדיוק לתבנית הזו.</em></p>`,
            "step1_3": `<p>זהו <strong>שם הקופסה (Abstract Syntax)</strong>. אנחנו מסבירים למפעל האריזה מה לעשות כשהוא מוצא טקסט שמתאים לתבנית: "קח את מה שמצאת, ותארוז אותו בקופסה פנימית שנקראת <code>cast-exp</code>".<br><strong>הסוד של SLLGEN:</strong> כלי הניתוח חכם מספיק כדי לזרוק את כל התווים הקשיחים במרכאות (<code>&lt;</code>, <code>&gt;</code>, <code>(</code>, <code>)</code>). הוא שומר רק את המשתנים שאין להם מרכאות. לכן, הקופסה <code>cast-exp</code> תחזיק בתוכה בדיוק שני דברים: ה-<code>type</code> שהוא זיהה, וה-<code>expression</code> שהוא זיהה.</p>`,
            "step1_4": `<p>כאן אנחנו מגדירים משפחה (קטגוריה) חדשה לגמרי בדקדוק שלנו: <code>type</code> (טיפוס). עד עכשיו המפרש ידע רק מה זה <code>expression</code>. עכשיו הוא לומד שיש דבר כזה "טיפוסים".<br>אנחנו מוסיפים חוק ראשון לקטגוריה הזו: אם אתה רואה את המילה המדויקת <code>"int"</code>, תארוז אותה בקופסה קטנה שנקראת <code>int-type</code>. הקופסה הזו ריקה מתוכן נוסף, היא רק משמשת כ"תווית" שאומרת "זהו טיפוס של מספר שלם".</p>`,
            "step1_5": `<p>הוספת אפשרות שנייה לקטגוריית ה-<code>type</code>. אם אתה רואה את המילה המדויקת <code>"bool"</code>, תארוז אותה בקופסה קטנה שנקראת <code>bool-type</code> ("תווית" של טיפוס בוליאני).</p>`,

            "step2_1": `<p>הפקודה <code>define-datatype</code> היא כלי חזק מאוד (מקרו) שמשתמשים בו בקורס הזה כדי ליצור טיפוסי נתונים חדשים (Algebraic Data Types).<br>בשורה הזו אנחנו עושים שני דברים במכה אחת:</p><ol class="list-decimal list-inside ml-4 space-y-2 mb-4"><li><code>type</code>: אנחנו מכריזים על שם המשפחה/הקטגוריה החדשה של הנתונים.</li><li><code>type?</code>: אנחנו יוצרים פונקציית בדיקה (פקח). מעכשיו, נוכל לכתוב בקוד שלנו משהו כמו <code>(type? x)</code>. אם <code>x</code> הוא קופסה ששייכת למשפחת ה-<code>type</code>, הפקח יחזיר במקום <code>#t</code> (אמת). אם יביאו לפקח סתם מספר כמו 5 או רשימה, הוא יחזיר <code>#f</code> (שקר).</li></ol>`,
            "step2_2": `<p>כאן אנחנו מגדירים את <strong>האפשרות הראשונה (Variant)</strong> בתוך המשפחה. אנחנו אומרים: "אפשר לייצר קופסה שנקראת <code>int-type</code>".<br>שים לב למשהו קריטי: הסוגריים ריקים! בדרך כלל ב-<code>define-datatype</code>, כשמייצרים קופסה (כמו <code>cast-exp</code> מההסבר הקודם), שמים בתוכה שדות (למשל ביטוי, סביבה וכו'). כאן, לא צריך לשמור שום מידע נוסף בתוך הקופסה. עצם קיומה של הקופסה <code>int-type</code> הוא המידע עצמו. היא מתפקדת נטו כמו "תווית" (Tag) שאומרת "אני מייצגת את הטיפוס int".</p>`,

                    if (step.mentalModelAfter) {
                        stepAfterExplanation.innerHTML = `
                        <button onclick="toggleAccordion('after')" class="accordion-btn rounded-xl bg-indigo-50 text-indigo-900 border-indigo-200 hover:bg-indigo-100 flex items-center justify-between p-4 w-full font-bold mb-4 mt-8 border border-dashed border-indigo-300 shadow-sm">
                           <span><i class="fa-solid fa-lightbulb mr-2 ml-2"></i> סיכום לאחר הקוד</span>
                           <i id="acc-icon-after" class="fa-solid fa-chevron-down transition-transform"></i>
                        </button>
                        <div id="acc-content-after" class="hidden bg-white border border-indigo-100 p-6 rounded-xl shadow-sm mb-6 text-slate-700 leading-relaxed text-[1.05rem]">
                            ${step.mentalModelAfter}
                        </div>`;
                    }
                }
            }

            prevBtn.disabled = currentStep === 0;
            stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;

            if (currentStep === steps.length - 1) {
                nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
            } else {
                nextBtn.innerHTML = 'המשך <i class="fa-solid fa-arrow-left mr-2"></i>';
            }

            renderSidebar();

            setTimeout(() => {
                initTooltips();
            }, 50);

            contentContainer.classList.remove('fade-enter');
            contentContainer.classList.add('fade-enter-active');
        }

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-collapsed');
            const isCollapsed = document.body.classList.contains('sidebar-collapsed');
            localStorage.setItem('sidebarCollapsed', isCollapsed);

            // Update icon direction
            const icon = document.getElementById('sidebar-toggle-icon');
            if (isCollapsed) {
                icon.className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            } else {
                icon.className = 'fa-solid fa-chevron-right text-lg transition-transform duration-300';
            }
        }

        function init() {
            // Restore tooltip state from localStorage
            const savedState = localStorage.getItem('globalTooltipState');
            if (savedState) {
                tooltipState = parseInt(savedState);
            }
            updateCyclerUI();

            // Create and inject sidebar toggle button
            const toggleBtn = document.createElement('button');
            toggleBtn.id = 'sidebar-toggle-btn';
            toggleBtn.onclick = toggleSidebar;
            toggleBtn.innerHTML = '<i id="sidebar-toggle-icon" class="fa-solid fa-chevron-right text-lg transition-transform duration-300"></i>';
            document.body.appendChild(toggleBtn);

            // Load sidebar collapsed state from localStorage
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (isCollapsed) {
                document.body.classList.add('sidebar-collapsed');
                document.getElementById('sidebar-toggle-icon').className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            }

            updateUI();
        }

        init();
    </script>
    <script src="ai_widget.js"></script>
</body>

</html>
