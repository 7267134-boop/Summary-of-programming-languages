                    <p class="mb-4">בשאלה זו אנו מרחיבים את שפת <strong>Implicit-Refs</strong> עם תמיכה באירועים (Events).</p>

Expression ::= event.create()<br>
Expression ::= &lt;Identifier&gt; += { { Expression }+(;) }
                        </div>
                        <ul class="list-disc list-inside text-sm text-blue-900 space-y-2">
                            <li><code>event.create()</code>: יוצר אירוע חדש וריק. אירוע הוא טיפוס נתונים חדש בשפה (רשימת פרוצדורות).</li>
                            <li><code>&lt;id&gt; += { procs }</code>: מוסיף לאירוע קיים רשימה של פרוצדורות (לפחות אחת).</li>
                            <li><code>(rator rand)</code> (ביטוי call-exp הקיים): מורחב כך שיוכל להפעיל הן פרוצדורה והן אירוע. בהפעלת אירוע, מופעלות כל הפרוצדורות שנרשמו אליו לפי סדר רישומן, והאירוע מחזיר את תוצאת הפרוצדורה <strong>האחרונה</strong> שהופעלה.</li>

                    <h3 class="text-xl font-bold text-slate-800 mb-3 border-b pb-2">מה אנחנו מחפשים ומנתחים בשלב זה?</h3>
                    <ul class="space-y-3 text-slate-700">
                        <li>
                            <span class="font-semibold text-slate-900">1. זיהוי טיפוס ערך מבוטא (ExpVal) חדש:</span>

                        </li>
                        <li>
                            <span class="font-semibold text-slate-900">2. משמעות של Implicit-Refs (הפניות משתמעות):</span> 
                            הביטוי <code>&lt;id&gt; += { procs }</code> משנה אירוע קיים. מכיוון שהמשתנה שמור כ-Reference בזיכרון, אנו חייבים להשתמש ב-<strong>Mutation</strong> (שינוי תא קיים באמצעות <code>setref!</code>) ולא ליצור קשירה חדשה בסביבה.
                        </li>
                        <li>
                            <span class="font-semibold text-slate-900">3. רשימה מופרדת פסיק-נקודה:</span>

                    <div class="template-box">

                    <h3 class="text-lg font-bold text-slate-800 mb-2">נקודות חשובות להגדרת התחביר:</h3>
                    <ul class="list-disc list-inside text-sm text-slate-700 space-y-2 mb-4">

                        <li><strong>שימוש ב-separated-list:</strong> מאחר והפרוצדורות מופרדות בנקודה-פסיק, נשתמש במבנה התקין של <code>(separated-list expression ";")</code> כדי שהמנתח יזהה ויחלץ אותן כרשימה של ביטויי AST.</li>
                    </ul>
                `,
                code: `(define the-grammar
  '(
    ;; ... שאר הגדרות הדקדוק הקיימות ...

    (expression
      ("event.create()")
      event-create-exp)

    (expression
      ("<" identifier ">" "+=" "{" (separated-list expression ";") "}")
      event-add-exp)
  ))`
            },
            {
                id: 2,
                title: "שלב 2: עדכון מבני נתונים (data-structures.scm)",
                filename: "data-structures.scm",
                explanation: `
                    <p class="mb-4">מכיוון שאירוע הוא סוג מידע חדש המיוצג בזמן ריצה, חובה לעדכן את <code>expval</code>.</p>
                    
                    <div class="template-box">
                        <p class="text-emerald-900 font-medium">
                            "<strong>עדכון מבני הנתונים (data-structures.scm):</strong> נבחן האם התוספת לשפה דורשת יצירת טיפוס נתונים חדש המוערך בזמן ריצה (Expressed Value). בשאלה זו, אירוע מיוצג כערך מדרגה ראשונה בשפה, המכיל רשימה של פרוצדורות. לכן נוסיף קופסה חדשה ל-<code>expval</code> בשם <code>event-val</code>, וכן פונקציית חילוץ (extractor) בשם <code>expval->event</code>. בנוסף, נממש פרדיקט בדיקה <code>all-procs?</code> שיעבור רקורסיבית על רשימה ויוודא שכל איבריה הם פרוצדורות (proc-val)."

                    <h3 class="text-lg font-bold text-slate-800 mb-2">וולידציה מבנית על איברי האירוע:</h3>
                    <ul class="list-disc list-inside text-sm text-slate-700 space-y-1 mb-4">
                        <li><strong>פרדיקט הסינון של האירוע:</strong> נגדיר את השדה הפנימי של <code>event-val</code> כבעל הגבלה של <code>all-procs?</code>. הגבלה זו מוודא שלתוך האירוע ייכנסו אך ורק ערכים מטיפוס פרוצדורה.</li>
                        <li><strong>מימוש סינון האיברים:</strong> <code>all-procs?</code> עובר על כל איבר ברשימה ובודק אותו דינמית באמצעות <code>is-proc-val?</code> המבוסס על cases של expval.</li>
                    </ul>
                `,
                code: `;; 1. הוספת ה-clause לתוך expval datatype:
(define-datatype expval expval?
  ...
  (event-val
    (event all-procs?)))

;; 2. פונקציית החילוץ:
(define expval->event
  (lambda (v)
    (cases expval v
      (event-val (lst) lst)
      (else (expval-extractor-error 'event v)))))

;; 3. פונקציות העזר לסינון ובדיקה:
(define all-procs?
  (lambda (lst)
    (cond
      [(null? lst) #t]
      [(is-proc-val? (car lst)) (all-procs? (cdr lst))]
      [else #f])))

(define is-proc-val?
  (lambda (v)
    (cases expval v
      (proc-val (p) #t)
      (else #f))))`
            },
            {
                id: 3,

                filename: "interp.scm",
                explanation: `
                    <p class="mb-4">כעת נוסיף את המקרים החדשים ל-<code>value-of</code> בקובץ המפרש <code>interp.scm</code>.</p>
                    
                    <div class="template-box">

                        </p>
                    </div>

                    <h3 class="text-lg font-bold text-slate-800 mb-2">מנגנון ההוספה והשגיאות בזמן ריצה:</h3>
                    <ul class="list-disc list-inside text-sm text-slate-700 space-y-2 mb-4">
                        <li><strong>וולידציות מפורשות:</strong> אנו מבטיחים טיפול שגיאות הדוק על ידי בדיקת שלושה מצבי כשל: רשימת פרוצדורות ריקה להוספה, זיהוי איברים שאינם פרוצדורות, וניסיון להעמיס על משתנה שלא הוגדר כאירוע (אינו <code>event-val?</code>).</li>
                        <li><strong>שימוש ב-Mutation:</strong> כיוון שהאירוע נשמר כמשתנה קיים בסביבה, אנו משתמשים ב-<code>setref!</code> על מנת לעדכן את תא הזיכרון הקיים, ובכך תומכים בשינוי גלובלי שמופץ לכל חלקי התוכנית.</li>
                    </ul>
                `,
                code: `;; מתוך value-of בקובץ interp.scm:

(event-create-exp ()
  (event-val '()))

(event-add-exp (id1 procs)
  (let* [(id1-ref (apply-env env id1))
         (id1-val (deref id1-ref))
         (procs-lst (map (lambda (x) (value-of x env)) procs))]
    (cond
      [(null? procs)
       (eopl:error 'event-add-exp "an empty list is not allowed")]
      [(not (all-procs? procs-lst))
       (eopl:error 'event-add-exp "event cannot contain non-procedure elements")]
      [(not (is-event-val? id1-val))
       (eopl:error 'event-add-exp "~s is not an event" id1)]
      [else 
       (let* [(id1-event-val (expval->event id1-val))
              (new-lst (append id1-event-val procs-lst))]
         (begin 
           (setref! id1-ref (event-val new-lst))
           (num-val 27)))])))`

    (cases expval rator-val

        (cond

        let currentStep = 0;
        const stepTitle = document.getElementById('step-title');
        const stepNumberBadge = document.getElementById('step-number-badge');
        const stepExplanation = document.getElementById('step-explanation');
        const codeContainer = document.getElementById('code-container');
        const codeBlock = document.getElementById('code-block');
        const fileName = document.getElementById('file-name');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const stepList = document.getElementById('step-list');
        const stepCounter = document.getElementById('step-counter');
        const contentContainer = document.getElementById('content-container');

        function init() {
            renderSidebar();
            updateUI();
        }

        function renderSidebar() {
            stepList.innerHTML = '';
            steps.forEach((step, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${index === currentStep ? 'active-nav' : ''}`;
                btn.onclick = () => goToStep(index);
                btn.innerHTML = `<span>${index}: ${step.title}</span>`;
                stepList.appendChild(btn);
            });
        }

        function updateUI() {
            const step = steps[currentStep];

            // Fade out
            contentContainer.classList.remove('fade-enter-active');
            contentContainer.classList.add('fade-enter');

            setTimeout(() => {
                stepNumberBadge.textContent = "תחנה " + currentStep;
                stepTitle.textContent = step.title;
                stepExplanation.innerHTML = step.explanation;

                if (step.code && step.filename) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-regular fa-file-code ml-2"></i>${step.filename}`;
                    codeBlock.textContent = step.code;
                    if (window.Prism) {
                        Prism.highlightElement(codeBlock);
                    }
                } else {
                    codeContainer.classList.add('hidden');
                }

                prevBtn.disabled = currentStep === 0;
                stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;

                if (currentStep === steps.length - 1) {
                    nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
                } else {
                    nextBtn.innerHTML = 'המשך <i class="fa-solid fa-arrow-left mr-2"></i>';
                }

                renderSidebar();

                // Fade in
                contentContainer.classList.remove('fade-enter');
                contentContainer.classList.add('fade-enter-active');
            }, 150);
        }

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        // Start initialization
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
