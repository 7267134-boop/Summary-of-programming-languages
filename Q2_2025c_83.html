    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800&family=Assistant:wght@300;400;600;700&display=swap');

        body {

        }

        .mac-min {

        }

        .code-filename {

            letter-spacing: 0.5px;
            flex: 1;
            text-align: right;

        .code-body {

        pre[class*="language-"] {

            background: transparent !important;

        /* Interactive Code Tooltips - CLEAN and SUBTLE */

        /* Premium Cycler Button Animation */

    <script>
        let hoverCloseTimer = null;

        function clearCloseTimer() {
            if (hoverCloseTimer) {
                clearTimeout(hoverCloseTimer);
                hoverCloseTimer = null;
            }
        }

        function startCloseTimer() {
            if (tooltipState !== 3) return;
            clearCloseTimer();
            hoverCloseTimer = setTimeout(() => {
                closeModal(null, true);
            }, 300); // 300ms delay to allow mouse movement to modal
        }

        // Global click listener to close modal when clicking outside in click mode
        document.addEventListener('click', (event) => {
            const modal = document.getElementById('explanation-modal');
            const modalCard = document.getElementById('modal-card');

            if (!modal.classList.contains('hidden')) {
                // If the click is NOT inside the modal-card, and NOT on an interactive tooltip
                if (!modalCard.contains(event.target) && !event.target.closest('.interactive-tooltip')) {
                    closeModal(null, true);
                }
            }
        });
        const explanationsDict = {
            
            "step1_1": `כאן אנחנו מגדירים את התבנית הראשונה.<br><code>expression</code>: המילה הזו אומרת לנתח לאיזו <strong>משפחה תחבירית</strong> הביטוי הזה שייך. זה אומר שבכל מקום בקוד שבו מותר לכתוב ביטוי (כמו מספר, פעולת חיבור, או קריאה לפונקציה), מותר עכשיו לכתוב גם את התבנית הזו.<br><code>("event.create()")</code>: זהו <strong>התחביר הקונקרטי</strong> (Concrete Syntax). אלו המילים המדויקות (Tokens) שהמתכנת חייב להקליד תו אחרי תו. במקרה הזה – אין כאן חלקים משתנים, אלא פשוט המחרוזת המדויקת הזו.<br><code>event-create-exp</code>: זוהי <strong>התווית שעל הקופסה</strong>. אם הנתח ראה בדיוק את הטקסט שדרשנו, הוא אורז אותו ויוצר צומת בזיכרון (בעץ ה-AST) בשם <code>event-create-exp</code>. כשהמפרש שלנו (<code>value-of</code>) יפגוש את הצומת הזה בהמשך, הוא יידע שהוא צריך לגשת לזיכרון (Store) וליצור אירוע חדש.`,
            "step1_2": `זוהי התבנית השנייה והמורכבת יותר. זו התבנית שנועדה לרשום פעולות (מאזינים) לאירוע קיים.<br>שוב, זה שייך למשפחת ה-<code>expression</code>. אבל כאן <strong>התחביר הקונקרטי</strong> מורכב מערבוב של חלקים קבועים (טקסט מילולי) וחלקים משתנים (מידע שהנתח צריך לאסוף):<br><ul><li><code>"&lt;"</code> ו-<code>"&gt;"</code>: סימנים קבועים (Tokens) שהמתכנת חייב לכתוב. הנתח קורא אותם וזורק אותם לפח, הם רק נועדו לעשות סדר בטקסט.</li><li><code>identifier</code>: זהו חלק <strong>משתנה</strong>. הנתח מצפה לראות כאן שם חוקי של משתנה (למשל <code>onClick</code> או <code>my_event</code>). הנתח שומר את השם הזה כדי להכניס אותו מאוחר יותר לתוך הקופסה!</li><li><code>"+="</code> ו-<code>"{"</code>: עוד סימנים קבועים שמגדירים את מבנה הפקודה מבחינה ויזואלית למתכנת.</li><li><code>(separated-list expression ";")</code>: זהו מנגנון קסם חזק של הגדרת הדקדוק (כמו ב-sllgen). אנחנו אומרים לנתח: "תצפה לקבל כאן רשימה של ביטויים (<code>expression</code>), שיכולים להיות כל דבר (הדפסות, פונקציות, חישובים), וביניהם חייב להפריד הסימן <code>;</code> (נקודה ופסיק)". הנתח יעבור עליהם, יזהה כל ביטוי בנפרד, ויאסוף את כולם לתוך מבנה של רשימה מסודרת (List). אלו בעצם הפעולות שיקרו כשהאירוע יקפוץ.</li><li><code>"}"</code>: הסימן שסוגר את הבלוק של הפעולות.</li><li><code>event-add-exp</code>: אם הנתח זיהה את כל המבנה המורכב הזה מתחילתו ועד סופו ללא שגיאות, הוא לוקח את החלקים המעניינים שאסף (את ה-<code>identifier</code> שמייצג לאיזה אירוע אנחנו מוסיפים, ואת רשימת ה-<code>expression</code> שמייצגת את הפעולות שיתבצעו), ואורז אותם לתוך צומת חדש ב-AST שנקרא <code>event-add-exp</code>.</li></ul>`,
            "step2_1": `כאן מוגדרת תבנית ה-<code>event-val</code> בהקשר המלא שלה - בתוך הגדרת הטיפוסים הכללית של השפה (<code>define-datatype expval expval?</code>). הוספת השלוש נקודות (<code>...</code>) מסמלת שיש שם עוד טיפוסים קיימים (כמו <code>num-val</code>, <code>bool-val</code>, <code>proc-val</code> וכו').<br>אנחנו מלמדים את השפה להכיר סוג ערך חדש בזמן ריצה שנקרא <code>event-val</code>. הקופסה הזו מחזיקה שדה אחד בלבד שנקרא <code>event</code> (והוא מייצג את רשימת המאזינים שלנו).<br>החלק המעניין הוא ה-<code>all-procs?</code>: זהו תנאי שמובנה בתוך ה-datatype (מנגנון של EOPL). בכל פעם שהמפרש ינסה ליצור קופסה מסוג <code>event-val</code>, השפה תריץ באופן אוטומטי את פונקציית הבדיקה <code>all-procs?</code> על הרשימה. אם הבדיקה תיכשל (כלומר, יש ברשימה משהו שהוא לא פרוצדורה), השפה תזרוק שגיאה ולא תאפשר ליצור את הערך הזה.`,
            "step2_2": `פונקציית החילוץ (Extractor).<br>כאשר המפרש מחזיק ביד ערך כלשהו (<code>v</code>) והוא חושד שמדובר באירוע, הוא קורא לפונקציה הזו כדי "לפתוח את המעטפה".<br><ul><li><code>cases expval v</code>: אנחנו בודקים איזו מדבקה יש על הקופסה <code>v</code>.</li><li><code>(event-val (lst) lst)</code>: אם המדבקה היא <code>event-val</code>, אנחנו פותחים את הקופסה, מוציאים את הרשימה הפנימית (שנקראת כאן <code>lst</code>) ומחזירים אותה החוצה כדי שנוכל לעבוד איתה (למשל, כדי לרוץ על כל הפרוצדורות ולהפעיל אותן).</li><li><code>(else ...)</code>: אם פתחנו את הקופסה וגילינו שיש עליה מדבקה אחרת (למשל <code>num-val</code>), זה אומר שמישהו ניסה להתייחס למספר כאילו הוא אירוע. במצב כזה המערכת עוצרת ומפעילה פונקציית שגיאה מובנית שמדווחת על טיפוס לא תואם.</li></ul>`,
            "step2_3": `זהו שומר הסף הרקורסיבי שמוודא שרשימת המנויים מכילה <strong>רק</strong> פרוצדורות.<br><ul><li><code>[(null? lst) #t]</code>: תנאי העצירה. אם סרקנו את כל הרשימה והגענו לסופה (או אם הרשימה מלכתחילה ריקה, כלומר אירוע שאין לו עדיין מאזינים), הרשימה חוקית לחלוטין ואנחנו מחזירים אמת (<code>#t</code>).</li><li><code>[(is-proc-val? (car lst)) ...]</code>: אנחנו לוקחים את האיבר הראשון ברשימה (<code>car lst</code>) ובודקים אותו. אם הוא אכן פרוצדורה חוקית, אנחנו ממשיכים לבדוק ברקורסיה את שאר הרשימה (<code>cdr lst</code>).</li><li><code>[else #f]</code>: אם מצאנו אפילו איבר אחד שהוא <em>לא</em> פרוצדורה, אנחנו מפסיקים מיד ומחזירים שקר (<code>#f</code>) – הרשימה כולה פסולה.</li></ul>`,
            "step2_4": `פונקציית עזר קטנה שמיועדת לבדוק איבר בודד.<br>היא מקבלת ערך מבוטא <code>v</code>, ומסתכלת על המדבקה שלו באמצעות <code>cases</code>. אם ורק אם המדבקה היא <code>proc-val</code> (הייצוג של פונקציה/פרוצדורה בזמן ריצה בשפה שלנו), היא מחזירה <code>#t</code>. עבור כל סוג ערך אחר (מספר, בוליאני, או אפילו אירוע אחר), היא תחזיר <code>#f</code>.`,
            "step3_1": `המפרש פוגש בעץ התחביר את הפקודה <code>event.create()</code>. מכיוון שאין לה משתנים או מידע נוסף (הסוגריים ריקים), הוא פשוט יוצר ומחזיר מיד ערך מבוטא מסוג אירוע (<code>event-val</code>) שבתוכו יש רשימה ריקה (<code>'()</code>). הלוח הריק מוכן.`,
            "step3_2": `המפרש פוגש את פקודת ההוספה. יש לו שני משתנים ביד: <code>id1</code> שהוא השם של האירוע (למשל המילה <code>my_event</code>), ו-<code>procs</code> שהיא רשימה של ביטויים (AST Nodes) שעוד לא חושבו (למשל, קוד של פונקציות שהמתכנת כתב בתוך הבלוק).`,
            "step3_3": `שלב <strong>האיתור</strong>. אנחנו שואלים את הסביבה הנוכחית (<code>env</code>): "תגידי, איפה נמצא המשתנה שקוראים לו <code>id1</code>?". הפונקציה <code>apply-env</code> לא מחזירה את הערך עצמו, אלא את <strong>הכתובת בזיכרון</strong> (ה-Reference או ה"מגירה") שבה הוא שמור. ושומרים את הכתובת במשתנה <code>id1-ref</code>.`,
            "step3_4": `שלב <strong>השליפה</strong>. אנחנו הולכים לזיכרון (ה-Store) עם הכתובת שמצאנו, ושולפים משם את המידע הפיזי באמצעות <code>deref</code> (Dereference). עכשיו המשתנה <code>id1-val</code> מחזיק את מה שבאמת יש שם (בתקווה, קופסת <code>event-val</code> עם הרשימה הישנה).`,
            "step3_5": `שלב <strong>עיבוד הבקשה</strong>. הרשימה <code>procs</code> היא עדיין קוד "טיפש" (ביטויים). המפרש עובר על כל אחד מהביטויים האלה (<code>map</code>), ושולח אותו חזרה ל-<code>value-of</code> כדי לחשב אותו מול הסביבה. התוצאה, שתישמר ב-<code>procs-lst</code>, היא כבר לא קוד, אלא רשימה של ערכים מבוטאים מחושבים (Expressed Values), שאמורים להיות מסוג <code>proc-val</code>.`,
            "step3_6": `מתחילה <strong>בקרת האיכות</strong>. חוק ראשון: אם ניסית להוסיף רשימה ריקה של פעולות, המפרש זורק שגיאה וקוטס את התוכנית, כי אין לפעולה כזו שום משמעות.`,
            "step3_7": `חוק שני: זוכר את פונקציית העזר <code>all-procs?</code> שהסברנו קודם? כאן אנחנו משתמשים בה. המפרש בודק את הרשימה המחושבת שיצרנו. אם מישהו ניסה להכניס למאזינים ערך שהוא לא פונקציה (כמו מספר), המפרש צועק ועוצר הכל.`,
            "step3_8": `חוק שלישי: אנחנו בודקים את מה ששלפנו מהזיכרון בצעד השני (<code>id1-val</code>). האם זה באמת קופסה מסוג אירוע? אם המתכנת ניסה לעשות <code>+=</code> על משתנה שהוא בכלל מספר, אנחנו זורקים שגיאה כדי למנוע קריסה.`,
            "step3_9": `עברנו את כל הבדיקות בשלום! הגענו לשלב <strong>העדכון</strong>.<br>אנחנו משתמשים בפונקציית החילוץ שלנו (<code>expval-&gt;event</code>) כדי לפתוח את הקופסה החוקית של האירוע, ושולפים מתוכה את הרשימה הישנה של המאזינים אל תוך המשתנה <code>id1-event-val</code>.`,
            "step3_10": `אנחנו לוקחים את הרשימה הישנה, ומשרשרים אליה (<code>append</code>) את רשימת המאזינים החדשה. עכשיו <code>new-lst</code> היא הרשימה המלאה והמעודכנת.`,
            "step3_11": `רגע השיא של הפעולה – <strong>המוטציה (Mutation)</strong> בזיכרון.<br>אנחנו לא מסתפקים ביצירת הרשימה החדשה, אנחנו צריכים לשמור אותה. באמצעות <code>setref!</code> אנחנו ניגשים לאותה כתובת מדויקת בארכיון שמצאנו בהתחלה (<code>id1-ref</code>), דורסים את המידע הישן שהיה שם, ומכניסים במקומו קופסת אירוע חדשה (<code>event-val</code>) שמכילה את הרשימה המעודכנת. זה הופך את הפעולה לקבועה עבור כל המשך התוכנית. ה-<code>begin</code> פשוט מאפשר לנו להריץ שתי פקודות ברצף.`,
            "step3_12": `השורה המצחיקה והקלאסית של ספרי EOPL. המפרש תמיד חייב להחזיר <em>איזשהו</em> ערך מכל ביטוי שהוא מחשב. אבל פעולת ההוספה היא פעולה של תוצאת לוואי (Side Effect) – המטרה שלה הייתה לשנות את הזיכרון, לא לחשב מספר. לכן, כדי לעמוד בחוקים, אחרי שהזיכרון עודכן בהצלחה, אנחנו פשוט מחזירים ערך סתמי, במקרה הזה – את המספר 27. (זה אומר שאם תנסה להדפיס למסך את פעולת ה-<code>+=</code> עצמה, תראה 27).`,
            "step4_1": `זוהי תבנית ה-<code>cases</code> בתוך ה-<code>value-of</code>. המפרש נתקל בביטוי מסוג <code>call-exp</code> (ביטוי קריאה/הפעלה). הביטוי הזה מחזיק שני חלקים: <code>rator</code> (האופרטור - הישות שמפעילים אותה, למשל שם של פונקציה או שם של אירוע), ו-<code>rand</code> (האופרנד - הארגומנט/הערך שאנחנו מעבירים פנימה, למשל המספר 5).`,
            "step4_2": `שלב החישוב המקדים. לפני שאפשר להפעיל משהו, המפרש חייב להבין מה הערך האמיתי של שני החלקים בסביבה הנוכחית (<code>env</code>).<br><ul><li><code>rator-val</code> יחזיק את הערך המבוטא (הקופסה) של מה שמפעילים.</li><li><code>rand-val</code> יחזיק את הערך המבוטא (הקופסה) של הפרמטר שנשלח.</li></ul>`,
            "step4_3": `שלב הבדיקה והשליפה החכמה. המפרש מסתכל על המדבקה שעל הקופסה של המפעיל (<code>rator-val</code>) כדי להחליט איך להתנהג.`,
            "step4_4": `המקרה הקלאסי (פרוצדורה). אם המדבקה היא <code>proc-val</code>, המפרש מבין שמדובר בפונקציה רגילה. הוא שולף את הגוף והסביבה שלה (המיוצגים פה על ידי <code>p</code>) ומעביר אותם לפונקציה המובנית <code>apply-procedure</code>, שמריצה את הפונקציה יחד עם הפרמטר <code>rand-val</code>.`,
            "step4_5": `המקרה החדש והמרתק (אירוע). אם המדבקה היא <code>event-val</code>, המפרש מבין שהוא לא מפעיל פונקציה בודדת, אלא משגר אירוע. הוא פותח את הקופסה ושולף מתוכה את שדה המידע הפנימי שלה – רשימת הפרוצדורות המאזינות – ושומר אותה תחת השם <code>old-event</code> (זוהי רשימה של ערכי <code>proc-val</code>).`,
            "step4_6": `בקרת בטיחות לאירוע. המפרש בודק: "האם רשימת המאזינים שלי ריקה?". אם כן (<code>null?</code>), זה אומר שהמתכנת ניסה להפעיל אירוע שאיש עדיין לא נרשם אליו. השפה מונעת זאת וזורקת שגיאה ייעודית שמסיימת את ריצת התוכנית.`,
            "step4_7": `שיגור האירוע בפועל. אם יש מאזינים ברשימה, המפרש קורא לפונקציה המערכתית <code>apply-event</code> (שכנראה ממומשת במקום אחר בקובץ או ב-<code>data-structures</code>). הפונקציה הזו תיקח את רשימת הפרוצדורות ותריץ אותן אחת אחרי השנייה, כשכולן מקבלות כקלט את אותו <code>rand-val</code> בדיוק (למשל, עדכון כל רכיבי המערכת שהערך השתנה ל-5).`,
            "step4_8": `הגנת ברירת המחדל (ה-<code>else</code> של ה-<code>cases</code>). אם פתחנו את הקופסה של המפעיל וגילינו שאין עליה מדבקה של פרוצדורה וגם לא של אירוע (למשל, המתכנת כתב קוד כמו <code>(5 3)</code>, כלומר ניסה להפעיל את המספר 5 כאילו הוא פונקציה), המפרש עוצר הכל ומוציא הודעת שגיאה ברורה: "ניתן להפעיל אך ורק פרוצדורות או אירועים".`,
            "step5_1": `זוהי הגדרת הפונקציה שמבצעת את "השידור החי". היא מקבלת שני פרמטרים:<br><ol><li><code>events</code>: זהו שם קצת מטעה בתוך הקוד (היה מדויק יותר לקרוא לזה <code>procs</code>), אבל הכוונה היא ל<strong>רשימת הפרוצדורות</strong> ששלפנו מתוך האירוע בשלב הקודם.</li><li><code>rand</code>: הערך המבוטא (הארגומנט) שאנחנו רוצים להעביר לכל אותן פרוצדורות (למשל, המספר 5).</li></ol>`,
            "step5_2": `זוהי שורת המחץ שמבצעת את השידור.<br>אנחנו משתמשים בפונקציה המובנית <code>map</code>. הפונקציה הזו עוברת איבר-איבר על רשימת ה-<code>events</code>. בכל פעם שהיא תופסת איבר (נקרא לו <code>x</code>, שהוא למעשה קופסת <code>proc-val</code> של מאזין), היא מפעילה עליו את <code>apply-procedure</code> יחד עם הארגומנט <code>rand</code>.<br>מה ש-<code>map</code> עושה באופן אוטומטי, זה לאסוף את כל התוצאות של ההפעלות האלו וליצור מהן <strong>רשימה חדשה</strong> של תוצאות. הרשימה הזו נשמרת בתוך המשתנה המקומי <code>results</code>.<br>אם היו לנו 3 מאזינים, <code>results</code> תחזיק עכשיו רשימה של 3 ערכים (למשל: <code>(num-val 10)</code>, <code>(num-val 20)</code>, <code>(num-val 30)</code>).`,
            "step5_3": `כאן אנחנו פותרים את "בעיית הדו"ח הסופי". המפרש לא יכול להחזיר רשימה שלמה כתוצאה של <code>call-exp</code> (אלא אם כן השפה תוכננה במיוחד לכך). הוא צריך ערך אחד.<br>ההחלטה התכנותית (Design Decision) כאן היא להחזיר את התוצאה של הפונקציה האחרונה ברשימה.<br>איך עושים את זה ביעילות?<br><ol><li><code>(reverse results)</code>: לוקח את הרשימה והופך אותה. אם היא הייתה <code>(10 20 30)</code>, היא הופכת ל-<code>(30 20 10)</code>.</li><li><code>car</code>: שולף את האיבר הראשון מהרשימה ההפוכה (שהוא ה-30).</li></ol>זהו הערך הסופי שיחזור מהפעלת האירוע כולו!`,
            "step5_4": `זוהי פונקציית הבדיקה (הפרדיקט) שהשתמשנו בה קודם בתוך <code>event-add-exp</code> (כדי לוודא שאנחנו מנסים להוסיף מאזינים רק לאירוע אמיתי ולא למספר).<br>היא פשוטה מאוד: היא מקבלת ערך מבוטא <code>v</code> כלשהו. היא מציצה על המדבקה שלו באמצעות <code>cases</code>.<br><ul><li>אם המדבקה היא <code>event-val</code> – היא אפילו לא טורחת להסתכל מה יש בפנים (<code>old-event</code>), אלא מיד מחזירה אמת (<code>#t</code>).</li><li>אם המדבקה היא כל דבר אחר (<code>else</code>) – היא מחזירה שקר (<code>#f</code>).</li></ul>`

                mentalModelBefore: `<p>הקוד הזה סוגר לנו את המעגל. אחרי שראינו איך מגדירים אירוע בדקדוק, איך שומרים אותו בזיכרון, ואיך מנתבים את הקריאה אליו בזמן אמת, אנחנו מגיעים ל<strong>ביצוע עצמו</strong> (Execution) ולבדיקות הבטיחות שמאחורי הקלעים. הפונקציות האלו חיות מחוץ ללוגיקה המרכזית של <code>value-of</code> ומשמשות כ"קבלני ביצוע" שנקראים לעשות את העבודה השחורה.</p><p>כדי להבין מה קורה כאן, ובמיוחד את ההחלטה התכנותית המעניינת שבסוף <code>apply-event</code>, אנחנו חייבים לבנות את המודל המנטלי הנכון לפני שנצלול לשורות.</p><h4>המודל המנטלי: חדר המבצעים והדו"ח הסופי</h4><p>תאר לעצמך קצין בחדר מבצעים (הפונקציה <code>apply-event</code>). הוא מקבל פקודה לשדר הודעה חשובה (הארגומנט - <code>rand</code>) לצוות שלם של סוכני שטח (רשימת הפרוצדורות המאזינות).</p><p>הקצין לוקח מכשיר קשר ומשדר את אותה הודעה בדיוק לכל סוכן וסוכן, אחד אחרי השני. כל סוכן מבצע את המשימה שלו, ובסוף מדווח חזרה נתון כלשהו (תוצאת הפונקציה). הקצין רושם את כל התשובות על דף לפי הסדר (ה-<code>map</code>).</p><p>אבל יש בעיה: מנהל המערכת הגדול (המפרש של השפה) דורש לקבל מהקצין <strong>רק דו"ח אחד ויחיד</strong> בסוף הפעולה (כי כל ביטוי בשפה חייב להחזיר ערך בודד). מה עושה הקצין? הוא מחליט לקחת את הרשימה, להפוך אותה מהסוף להתחלה, ולשלוף רק את הפתק האחרון שנוסף אליה – הדו"ח של הסוכן האחרון שביצע את המשימה – ואותו הוא מגיש למנהל.</p>`,
                code: `<mark class="interactive-tooltip" data-key="step5_1">(define apply-event
  (lambda (events rand)</mark>
<mark class="interactive-tooltip" data-key="step5_2">    (let ((results (map (lambda (x) (apply-procedure x rand)) events)))</mark>
<mark class="interactive-tooltip" data-key="step5_3">      ;; חילוץ תוצאת הפרוצדורה האחרונה שהופעלה:
      (car (reverse results)))))</mark>

<mark class="interactive-tooltip" data-key="step5_4">(define is-event-val?
  (lambda (v)
    (cases expval v
      (event-val (old-event) #t)
      (else #f))))</mark>`,
                mentalModelAfter: `<p>הקטע הזה הוא "המנוע השקט" שגורם למערכת האירועים לעבוד. <code>apply-event</code> מנצלת את הכוח של פונקציות מסדר גבוה (<code>map</code>) כדי להפוך קוד שהיה יכול להיות מסורבל (לולאה שרצה על רשימה ומפעילה איברים) לשורת קוד אחת אלגנטית שמייצרת את אפקט ה-Broadcast. הבחירה להחזיר את האיבר האחרון (<code>car reverse</code>) היא אלגנטית ופותרת את אילוצי המפרש שמצפה לערך יחיד בסיום. יחד עם פונקציית הבדיקה הקטנה, המערכת סגורה, בטוחה ומוכנה להריץ את קוד השפה.</p>`
            },
            {
                id: "final",
                title: "הפתרון המלא ברצף",
                isFinal: true
            }

        ];

        let currentStep = 0;
        let tooltipState = 3; // 1 = none, 2 = click, 3 = hover

        const tooltipConfig = {
            1: { icon: "fa-code", text: "ללא הסברים", color: "text-slate-400", glow: "via-slate-500", glowOp: "opacity-30" },
            2: { icon: "fa-hand-pointer", text: "מופעל - בלחיצה", color: "text-emerald-400", glow: "via-emerald-400", glowOp: "opacity-70" },
            3: { icon: "fa-mouse-pointer", text: "מופעל - בריחוף", color: "text-primary", glow: "via-primary", glowOp: "opacity-70" }
        };

        const stepTitle = document.getElementById('step-title');
        const stepNumberBadge = document.getElementById('step-number-badge');
        const stepExplanation = document.getElementById('step-explanation');
        const codeContainer = document.getElementById('code-container');
        const codeBlock = document.getElementById('code-block');
        const fileName = document.getElementById('file-name');
        const stepAfterExplanation = document.getElementById('step-after-explanation');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const stepList = document.getElementById('step-list');
        const stepCounter = document.getElementById('step-counter');
        const contentContainer = document.getElementById('content-container');

        // Handle custom image upload for step 0
        document.addEventListener('change', function (e) {
            if (e.target && e.target.id === 'image-upload-input') {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (event) {
                        const img = document.getElementById('step-0-image');
                        img.src = event.target.result;
                        img.style.display = 'block';
                        document.getElementById('image-upload-fallback').style.display = 'none';
                        localStorage.setItem('q1_2025c_83_image', event.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            }
        });

        function updateCyclerUI() {
            const config = tooltipConfig[tooltipState];

            const btn = document.getElementById('tooltip-cycler');
            const icon = document.getElementById('cycler-icon');
            const text = document.getElementById('cycler-text');
            const glow = document.getElementById('cycler-glow');

            // Animation reset
            btn.classList.remove('cycler-anim');
            void btn.offsetWidth; // trigger reflow
            btn.classList.add('cycler-anim');

            icon.className = `fa-solid ${config.icon} text-3xl ${config.color} transition-transform group-hover:scale-110 drop-shadow-[0_0_8px_rgba(255,255,255,0.1)]`;
            text.textContent = config.text;

            glow.className = `absolute bottom-0 left-0 w-full h-[3px] bg-gradient-to-r from-transparent ${config.glow} to-transparent ${config.glowOp} transition-all duration-300`;

            initTooltips();
        }

        function cycleTooltipState() {
            tooltipState = tooltipState === 3 ? 1 : tooltipState + 1;
            localStorage.setItem('globalTooltipState', tooltipState);
            updateCyclerUI();
        }

        // Modal Functions
        function openModal(codeText, explanationHtml) {
            const modal = document.getElementById('explanation-modal');
            const modalCard = document.getElementById('modal-card');
            const modalCode = document.getElementById('modal-code');
            const modalExplanation = document.getElementById('modal-explanation');

            modalCode.textContent = codeText.replace(/^\n+|\n+$/g, '');
            Prism.highlightElement(modalCode);
            modalExplanation.innerHTML = explanationHtml;

            modal.classList.remove('hidden');
            // Trigger reflow for animation
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            modalCard.classList.remove('scale-95');
            modal.classList.add('flex');
        }

        function closeModal(event, force = false) {
            if (event && !force) {
                // If they clicked directly on the modal backdrop, close it.
                if (event.target !== document.getElementById('explanation-modal')) {
                    return;
                }
            }

            const modal = document.getElementById('explanation-modal');
            const modalCard = document.getElementById('modal-card');

            modal.classList.add('opacity-0');
            modalCard.classList.add('scale-95');

            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        function initTooltips() {
            // Reset state
            const marks = document.querySelectorAll('mark.interactive-tooltip');

            marks.forEach(m => {
                m.classList.remove('tooltip-active-style');
                m.style.pointerEvents = 'none';

                // Remove old listeners by cloning
                const newMark = m.cloneNode(true);
                m.parentNode.replaceChild(newMark, m);
            });

            if (tooltipState === 1) return;

            const freshMarks = document.querySelectorAll('mark.interactive-tooltip');
            freshMarks.forEach(m => {
                m.classList.add('tooltip-active-style');
                m.style.pointerEvents = 'auto';

                const explanationKey = m.getAttribute('data-key');
                const explanation = explanationsDict[explanationKey] || "הסבר חסר";
                const codeText = m.textContent;

                if (tooltipState === 2) {
                    m.addEventListener('click', () => openModal(codeText, explanation));
                } else if (tooltipState === 3) {
                    m.addEventListener('mouseenter', () => {
                        clearCloseTimer();
                        openModal(codeText, explanation);
                    });
                    m.addEventListener('mouseleave', () => {
                        startCloseTimer();
                    });
                }
            });
        }

        function toggleAccordion(id) {
            const content = document.getElementById('acc-content-' + id);
            const icon = document.getElementById('acc-icon-' + id);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                content.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        function renderSidebar() {
            stepList.innerHTML = '';
            steps.forEach((step, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${index === currentStep ? 'active-nav' : ''}`;
                btn.onclick = () => goToStep(index);
                btn.innerHTML = `<span>${step.id === 'final' ? '<i class="fa-solid fa-flag-checkered mr-2"></i> ' : (index) + ': '}${step.title}</span>`;
                stepList.appendChild(btn);
            });
        }

        function updateUI() {
            const step = steps[currentStep];

            stepNumberBadge.textContent = step.isFinal ? "שלב סופי" : ("תחנה " + currentStep);
            stepTitle.textContent = step.title;
            stepExplanation.innerHTML = '';
            stepAfterExplanation.innerHTML = '';
            codeContainer.classList.add('hidden');

            if (step.isImageOnly) {
                let imagesHtml = '';
                if (Array.isArray(step.imageSrc)) {
                    imagesHtml = step.imageSrc.map((src, i) => `<img id="step-0-image-${i}" src="${src}" class="max-w-full h-auto rounded-xl shadow-lg border border-slate-200 mx-auto mb-4">`).join('');
                } else {
                    const savedImg = localStorage.getItem('q1_2025c_83_image');
                    const imgSrc = savedImg ? savedImg : step.imageSrc;
                    imagesHtml = `<img id="step-0-image" src="${imgSrc}" class="max-w-full h-auto rounded-xl shadow-lg border border-slate-200 mx-auto" onerror="this.style.display='none'; document.getElementById('image-upload-fallback').style.display='block';">`;
                }

                stepExplanation.innerHTML = `
                <div class="text-center">
                    ${imagesHtml}
                    <div id="image-upload-fallback" class="hidden mt-4 p-8 border-2 border-dashed border-slate-300 rounded-xl bg-slate-50">
                        <i class="fa-regular fa-image text-4xl text-slate-400 mb-3"></i>
                        <p class="text-slate-500 mb-4 font-bold text-lg">תמונת השאלה חסרה</p>
                        <p class="text-slate-400 mb-6 text-sm">אנא בחר את קובץ התמונה שהורדת כדי להציג אותו כאן. (התמונה תישמר בדפדפן שלך לתמיד!)</p>
                        <input type="file" id="image-upload-input" accept="image/*" class="block w-full max-w-xs mx-auto text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-blue-50 file:text-primary hover:file:bg-blue-100 cursor-pointer">
                    </div>
                </div>`;
            } else if (step.isFinal) {
                let html = '<div class="space-y-12">';
                steps.forEach(s => {
                    if (s.code && !s.isFinal) {
                        html += `
                        <div>
                            <h3 class="text-xl font-bold text-slate-800 mb-4">${s.title}</h3>
                            <div class="code-window">
                                <div class="code-window-header ltr" dir="ltr">
                                    <div class="mac-buttons">
                                        <div class="mac-btn mac-close"></div>
                                        <div class="mac-btn mac-min"></div>
                                        <div class="mac-btn mac-max"></div>
                                    </div>
                                    <div class="code-filename"><i class="fa-solid fa-code mr-2"></i>${s.filename}</div>
                                </div>
                                <div class="code-body ltr text-left" dir="ltr">
                                    <pre><code class="language-scheme">${s.code}</code></pre>
                                </div>
                            </div>
                        </div>
                        `;
                    }
                });
                html += '</div>';
                stepExplanation.innerHTML = html;
                Prism.highlightAllUnder(stepExplanation);
            } else {
                if (step.mentalModelBefore) {
                    stepExplanation.innerHTML = `
                    <button onclick="toggleAccordion('before')" class="accordion-btn rounded-xl bg-purple-50 text-purple-900 border-purple-200 hover:bg-purple-100 flex items-center justify-between p-4 w-full font-bold mb-6 border border-dashed border-purple-300 shadow-sm">
                       <span><i class="fa-solid fa-brain mr-2 ml-2"></i> מודל מנטלי לפני הקוד</span>
                       <i id="acc-icon-before" class="fa-solid fa-chevron-down transition-transform"></i>
                    </button>
                    <div id="acc-content-before" class="hidden bg-white border border-purple-100 p-6 rounded-xl shadow-sm mb-6 text-slate-700 leading-relaxed text-[1.05rem]">
                        ${step.mentalModelBefore}
                    </div>`;
                }

                if (step.code) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-solid fa-code mr-2"></i>${step.filename}`;
                    codeBlock.innerHTML = step.code;
                    Prism.highlightElement(codeBlock);

                    if (step.mentalModelAfter) {
                        stepAfterExplanation.innerHTML = `
                        <button onclick="toggleAccordion('after')" class="accordion-btn rounded-xl bg-indigo-50 text-indigo-900 border-indigo-200 hover:bg-indigo-100 flex items-center justify-between p-4 w-full font-bold mb-4 mt-8 border border-dashed border-indigo-300 shadow-sm">
                           <span><i class="fa-solid fa-lightbulb mr-2 ml-2"></i> סיכום לאחר הקוד</span>
                           <i id="acc-icon-after" class="fa-solid fa-chevron-down transition-transform"></i>
                        </button>
                        <div id="acc-content-after" class="hidden bg-white border border-indigo-100 p-6 rounded-xl shadow-sm mb-6 text-slate-700 leading-relaxed text-[1.05rem]">
                            ${step.mentalModelAfter}
                        </div>`;
                    }
                }
            }

            prevBtn.disabled = currentStep === 0;
            stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;

            if (currentStep === steps.length - 1) {
                nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
            } else {
                nextBtn.innerHTML = 'המשך <i class="fa-solid fa-arrow-left mr-2"></i>';
            }

            renderSidebar();

            setTimeout(() => {
                initTooltips();
            }, 50);

            contentContainer.classList.remove('fade-enter');
            contentContainer.classList.add('fade-enter-active');
        }

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-collapsed');
            const isCollapsed = document.body.classList.contains('sidebar-collapsed');
            localStorage.setItem('sidebarCollapsed', isCollapsed);

            // Update icon direction
            const icon = document.getElementById('sidebar-toggle-icon');
            if (isCollapsed) {
                icon.className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            } else {
                icon.className = 'fa-solid fa-chevron-right text-lg transition-transform duration-300';
            }
        }

        function init() {
            // Restore tooltip state from localStorage
            const savedState = localStorage.getItem('globalTooltipState');
            if (savedState) {
                tooltipState = parseInt(savedState);
            }
            updateCyclerUI();

            // Create and inject sidebar toggle button
            const toggleBtn = document.createElement('button');
            toggleBtn.id = 'sidebar-toggle-btn';
            toggleBtn.onclick = toggleSidebar;
            toggleBtn.innerHTML = '<i id="sidebar-toggle-icon" class="fa-solid fa-chevron-right text-lg transition-transform duration-300"></i>';
            document.body.appendChild(toggleBtn);

            // Load sidebar collapsed state from localStorage
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (isCollapsed) {
                document.body.classList.add('sidebar-collapsed');
                document.getElementById('sidebar-toggle-icon').className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            }

            updateUI();
        }

        init();
    </script>
</body>

</html>
