    <script>
        let hoverCloseTimer = null;

        function clearCloseTimer() {
            if (hoverCloseTimer) {
                clearTimeout(hoverCloseTimer);
                hoverCloseTimer = null;
            }
        }

        function startCloseTimer() {
            if (tooltipState !== 3) return;
            clearCloseTimer();
            hoverCloseTimer = setTimeout(() => {
                closeModal(null, true);
            }, 300); // 300ms delay to allow mouse movement to modal
        }

        // Global click listener to close modal when clicking outside in click mode
        document.addEventListener('click', (event) => {
            const modal = document.getElementById('explanation-modal');
            const modalCard = document.getElementById('modal-card');

            if (!modal.classList.contains('hidden')) {
                // If the click is NOT inside the modal-card, and NOT on an interactive tooltip
                if (!modalCard.contains(event.target) && !event.target.closest('.interactive-tooltip')) {
                    closeModal(null, true);
                }
            }
        });
        const explanationsDict = {
            
            "step1_1": `<p>אנחנו אומרים למנתח התחבירי: "שים לב, אני עומד ללמד אותך על סוג חדש של ביטוי (expression) שאפשר לכתוב בשפה שלנו".</p>`,
            "step1_2": `<p>זהו ה"תחביר הקונקרטי" (Concrete Syntax) – איך שהמתכנת יקליד את הקוד בפועל. ספר ההוראות של השומר עובד כך:</p><ol class="list-decimal list-inside ml-4 space-y-2 mb-4"><li>חפש את המילה השמורה <code>"map"</code>.</li><li>אחריה, צפה לקבל <code>expression</code> (ביטוי כלשהו, שבזמן ריצה אנחנו נצפה שיהיה הפונקציה שאותה רוצים להפעיל).</li><li>לאחר מכן, חפש סוגר מרובע שמאלי <code>"["</code>.</li><li>עכשיו מגיע קסם מובנה: הפקודה <code>separated-list</code> אומרת לו: "כאן תגיע רשימה של <code>expression</code> (ביטויים), שמופרדים ביניהם באמצעות פסיקים <code>","</code>". הוא ימשיך לאסוף אותם עד שיעצר.</li><li>לבסוף, ודא שהרשימה נסגרת עם סוגר מרובע ימני <code>"]"</code>.</li></ol><p>אם המתכנת שכח פסיק או סוגר, השומר יזרוק שגיאת סינטקס (Syntax Error).</p>`,
            "step1_3": `<p>זוהי ה"תבנית" הסופית (Abstract Syntax). אחרי שהשומר קרא את כל המשפט, הוא לוקח פח אשפה וזורק לתוכו את המילה <code>"map"</code>, את הפסיקים ואת הסוגריים המרובעים. למה? כי הם רק "רעש" שעוזר לקריאות של בני אדם. הוא אוסף רק את <em>המהות</em> (הביטוי הראשון, ורשימת הביטויים שאחריו) ואורז אותם לתוך קופסה מסודרת בשם <code>map-exp</code>.</p>`,
            "step1_4": `<p>שוב, הגדרת חוק תחבירי נוסף עבור פעולה אחרת.</p>`,
            "step1_5": `<p>התחביר של שליפת איבר מרשימה. המתכנת נדרש להקליד את המילה <code>"listref"</code>, לפתוח סוגריים עגולים <code>"("</code>, לכתוב <code>expression</code> (שיניב את הרשימה עצמה), לשים פסיק <code>","</code>, לכתוב עוד <code>expression</code> (שיניב את האינדקס המספרי), ולסגור סוגריים <code>")"</code>.</p>`,
            "step1_6": `<p>ממש כמו קודם, השומר אוסף רק את שני הביטויים הרלוונטיים (הרשימה והאינדקס), זורק את המילים והסוגריים לפח, ואורז את הנתונים לתוך קופסה חדשה שנקראת <code>list-ref-exp</code>.</p>`,

            "step2_1": `<p>ה-<code>expval</code> (Expressed Value) הוא קופסת הפלסטיק הסטנדרטית של המפרש. כל דבר שנוצר בזמן ריצה (מספר, מחרוזת, פונקציה) <em>חייב</em> להיות ארוז בתוך <code>expval</code>. אנחנו פותחים את ההגדרה הקיימת כדי להוסיף לה סוגים חדשים של קופסאות.</p>`,
            "step2_2": `<p>יצרנו קופסה חדשה בשם <code>unevaluated-val</code> (ערך שטרם חושב). הקופסה הזו מחזיקה בתוכה אובייקט מסוג <code>lazy?</code> (זוהי הארוחה הקפואה שלנו שעליה נדבר מיד). ברגע שהמפרש נתקל בקופסה כזו, הוא יודע שיש פה חישוב שנדחה למועד מאוחר יותר.</p>`,
            "step2_3": `<p>הוספנו עוד קופסה בשם <code>list-val</code>. בניגוד למספר בודד, הקופסה הזו היא בעצם "מכולה" שמכילה בתוכה רשימה של קופסאות <code>expval</code> אחרות. זה מה שיאפשר לנו להחזיק רשימות אמיתיות בזמן הריצה של השפה שלנו (למשל, כדי להפעיל עליהן את פקודת ה-<code>map</code> מהשלב הקודם!).</p>`,
            "step2_4": `<p>זהו הלב של מנגנון ההערכה העצלה – כאן אנחנו מגדירים את תבנית הארוחה הקפואה עצמה. כשאנחנו רוצים לדחות חישוב של ביטוי (במקרה הזה, נראה שמדובר בדחייה של הפעלת פונקציה <code>exp1</code> על רשימת פרמטרים <code>exps</code>), אנחנו חייבים לשמור שלושה דברים במבנה שנקרא <code>laziness</code>:</p><ol class="list-decimal list-inside ml-4 space-y-2 mb-4"><li><code>exp1</code>: הפונקציה או הביטוי הראשי (ה"מתכון").</li><li><code>exps</code>: רשימת הביטויים הנלווים שצריך להעביר אליו.</li><li><code>saved-env</code>: <strong>זה החלק הכי קריטי.</strong> אנחנו שומרים את הסביבה (Environment) המדויקת שקיימת <em>עכשיו</em>. למה? כי כשהמפרש יחליט להריץ את הביטויים האלה בעתיד, הסביבה החיצונית כבר עלולה להשתנות. אם הביטוי כולל את המשתנה <code>x</code>, אנחנו חייבים שהמפרש יידע מה היה הערך של <code>x</code> ברגע שבו הקפאנו את החישוב, ולא ברגע ההפשרה.</li></ol>`,
            "step2_5": `<p>המפרש חייב דרך לפתוח את הקופסאות שהוא מקבל. הפונקציה הזו היא "פותחן קופסאות" ספציפי לערכים קפואים. היא לוקחת ערך כללי <code>v</code>, ובודקת את התווית עליו באמצעות <code>cases</code>.</p><ul class="list-disc list-inside ml-4 space-y-2 mb-4"><li><strong>אם</strong> זו אכן קופסת <code>unevaluated-val</code>, היא קורעת את העטיפה, שולפת מתוכה את האובייקט הקפוא הטהור (<code>uneval</code> מסוג <code>lazy</code>) ומחזירה אותו.</li><li><strong>אחרת</strong> (למשל, אם ניסינו לחלץ ערך קפוא מתוך קופסה שמכילה בכלל מספר), היא זורקת שגיאת ריסוק למסך (Extractor Error).</li></ul>`,
            "step2_6": `<p>בדיוק אותו הגיון, רק עבור רשימות. כשהמפרש שלנו ירצה לשלוף איבר מתוך רשימה (למשל, בגלל שהוא נתקל ב-<code>list-ref-exp</code> שראינו קודם במנתח התחבירי), הוא ישתמש בפונקציה הזו כדי לפתוח את מכולת ה-<code>list-val</code> ולשלוף מתוכה את הרשימה הטהורה של הנתונים (<code>vals</code>). אם הוא ינסה להשתמש ב"פותחן הרשימות" על מספר או על ארוחה קפואה – התוכנית תקרוס עם שגיאה.</p>`,

            "step3_1": `<p>זוהי תבנית ה-<code>cases</code> בתוך ה-<code>value-of</code>. המפרש מטייל על עץ התחביר (ה-AST) ונתקל בקופסת <code>map-exp</code> (אותה קופסה ששומר הסף שלנו ארז בשלב הראשון). המפרש פותח אותה ומחלץ מתוכה שני דברים: את <code>exp1</code> (הביטוי של הפונקציה שנרצה להפעיל) ואת <code>exps</code> (הביטוי שמייצג את רשימת האיברים).</p>`,
            "step3_2": `<p>שים לב למה ש<strong>אין</strong> פה – אין פה לולאה, אין פה רקורסיה שעוברת על הרשימה, ואין פה שום הפעלה של פונקציה. יש פה שורת קוד אחת שעושה שני דברים קריטיים ביחד:</p><ol class="list-decimal list-inside ml-4 space-y-2 mb-4"><li><code>(laziness exp1 exps env)</code>: אנחנו יוצרים את ה-ADT של ה-Lazy (הארוחה הקפואה שהגדרנו בקובץ המבנים). אנחנו מוסרים לו את <code>exp1</code> ואת <code>exps</code> כפי שהם – כביטויים גולמיים שלא חושבו עדיין! והכי חשוב: אנחנו מצרפים אליהם את ה-<code>env</code> הנוכחי. זו "לכידת הסביבה". המפרש מקפיא את מצב המשתנים הנוכחי כדי שאם נפעיל את ה-map בעתיד, הוא יזכור בדיוק למה המשתנים היו שווים ברגע זה.</li><li><code>(unevaluated-val ...)</code>: אנחנו לוקחים את אובייקט ה-<code>laziness</code> שייצרנו הרגע, ואורזים אותו בתוך קופסת ה-<code>expval</code> הכללית של השפה תחת התווית <code>unevaluated-val</code>.</li></ol><p>הערך הזה הוא מה שחוזר כתוצאה הרשמית של הפונקציה <code>value-of</code>.</p>`,

            "step4_1": `<p>אנחנו מגדירים פונקציה חיצונית ל-<code>value-of</code> שמקבלת ערך כלשהו בשם <code>uneval</code> (קיצור של unevaluated). השורה הראשונה משתמשת ב-<code>cases</code> כדי לבדוק איזו תווית מודבקת על קופסת ה-<code>expval</code> הזו.</p>`,
            "step4_2": `<p>המפרש מזהה: "בינגו! מדובר פה בערך עצל שעוד לא חושב". הוא פותח את קופסת ה-<code>expval</code> ומחלץ מתוכה את האובייקט הפנימי (ה-Thunk) שנקרא כאן <code>unevaluated</code> (שהוא מסוג <code>lazy</code>).</p>`,
            "step4_3": `<p>כעת אנחנו צוללים שכבה אחת פנימה. אנחנו פותחים את אובייקט ה-<code>lazy</code> ומחלצים ממנו את שלושת המרכיבים שהקפאנו בזמן ההמתנה: <code>exp1</code> (הביטוי של הפונקציה), <code>exps</code> (רשימת הביטויים של איברי הרשימה), ו-<code>saved-env</code> (צילום המצב של הסביבה הישנה).</p>`,
            "step4_4": `<p>כאן מתחילה הריצה האמיתית בזמן הריצה (Runtime). אנחנו משתמשים ב-<code>let*</code> כדי לבצע סדרת פעולות מדורגת:</p><ol class="list-decimal list-inside ml-4 space-y-2 mb-4"><li><code>(value-of exp1 saved-env)</code>: אנחנו שולחים את ביטוי הפונקציה לחישוב. שים לב שאנחנו מעריכים אותו <strong>בתוך הסביבה השמורה (<code>saved-env</code>)</strong> ולא בסביבה הנוכחית של השפה עכשיו! זה מבטיח שאם הפונקציה הסתמכה על משתנים חסומים מהעבר, הם יילקחו בחשבון.</li><li><code>expval-&gt;proc</code>: אנחנו מחלצים את הפרוצדורה האמיתית מתוך קופסת ה-<code>expval</code> שחזרה אלינו, ושומרים אותה תחת השם <code>proc1</code>.</li></ol>`,
            "step4_5": `<p>עכשיו צריך לטפל באיברי הרשימה. המשתנה <code>exps</code> מחזיק רשימה של <em>ביטויים גולמיים</em> (למשל, התרגיל <code>+(1, 1)</code>). בשורה הזו, אנחנו משתמשים בפונקציית ה-<code>map</code> המובנית של שפת Scheme כדי לעבור על כל ביטוי <code>e</code> ברשימה, ולהריץ עליו את <code>value-of</code> בתוך הסביבה השמורה. בסוף השורה הזו, המשתנה <code>eval-exps</code> יחזיק רשימה של ערכים מחושבים סופית (למשל, המספר <code>2</code>).</p>`,
            "step4_6": `<p>זהו שלב הקיפול הסופי והגשת המנה.</p><ol class="list-decimal list-inside ml-4 space-y-2 mb-4"><li>אנחנו משתמשים שוב ב-<code>map</code> של Scheme כדי לקחת את הפרוצדורה המוכנה שלנו <code>proc1</code>, ולהפעיל אותה על כל אחד מהערכים המחושבים ב-<code>eval-exps</code> בעזרת הפונקציה <code>apply-procedure</code>.</li><li>את רשימת התוצאות שמתקבלת, אנחנו אורזים בתוך הקופסה הרשמית של השפה לרשימות: <code>list-val</code> (אותה קופסה שהגדרנו בקובץ מבני הנתונים בשלב 2). זה הערך הטהור שיוחזר לתוכנית.</li></ol>`,
            "step4_7": `<p>סגירת ה-<code>cases</code> החיצוני. מה קורה אם מישהו שלח לפונקציה הזו ערך שכבר עבר הפשרה בעבר, או מספר פשוט כמו <code>5</code>? התנאי מגיע ל-<code>else</code>, ומחזיר את <code>uneval</code> בדיוק כפי שהוא, בלי לגעת בו ובלי לבצע שום חישוב מיותר. זהו מנגנון הגנה חיוני שמונע חישוב כפול.</p>`,

            "step5_1": `<p>שוב, אנחנו בתוך פונקציית <code>value-of</code>. המפרש מטייל על עץ התחביר ונתקל בקופסת הנתונים של פעולת השליפה – <code>list-ref-exp</code> (זו ששומר הסף יצר בשלב הראשון). הוא שולף מתוכה את שני תתי-הביטויים: <code>e1</code> (שאמור לייצר את הרשימה) ו-<code>e2</code> (שאמור לייצר את האינדקס).</p>`,
            "step5_2": `<p>המפרש מבקש להעריך את הביטוי <code>e1</code>. שים לב: אם <code>e1</code> הוא פעולת <code>map</code>, הרי שבשלב הזה <code>eval1</code> יקבל את ערך ה-<code>unevaluated-val</code> העצלן שיצרנו קודם! בשלב הזה, בזיכרון של המפרש, <code>eval1</code> הוא עדיין ארוחה קפואה.</p>`,
            "step5_3": `<p>המפרש מעריך את הביטוי השני <code>e2</code> (האינדקס). הפעם הוא לא יכול להיות סלחן. כדי לשלוף איבר אנחנו צריכים מספר אמיתי. לכן, הוא מיד עוטף את התוצאה בפונקציה <code>expval-&gt;num</code>, שקורעת את קופסת ה-<code>expval</code> ומשאירה למפרש מספר טהור של שפת Scheme ביד (למשל, 2).</p>`,
            "step5_4": `<p><strong>זהו רגע הקסם וחיבור המערכות!</strong> המפרש לוקח את <code>eval1</code> וזורק אותו לתוך <code>evaluate-map</code> (מנגנון ההפשרה מההודעה הקודמת).</p><ul class="list-disc list-inside ml-4 space-y-2 mb-4"><li>אם <code>eval1</code> היה עצל - הוא יחושב כעת במלואו ויהפוך ל-<code>list-val</code>.</li><li>אם הוא כבר היה רשימה רגילה - הוא פשוט יוחזר כמו שהוא.</li></ul><p>לאחר מכן, הפונקציה <code>expval-&gt;list</code> קורעת את עטיפת ה-<code>list-val</code> ומעבירה למשתנה <code>lst</code> רשימה טהורה ואמיתית של ערכים מוכנים.</p>`,
            "step5_5": `<p>הסלקטור של המערכת (Bounds Checking). המפרש מגן על עצמו מקריסה (Crash) לא מבוקרת. הוא בודק שני תנאים של שגיאה (שימוש ב-<code>or</code>):</p><ol class="list-decimal list-inside ml-4 space-y-2 mb-4"><li><code>(negative? eval2)</code>: אינדקס לא יכול להיות במינוס (אי אפשר לבקש איבר במיקום 1-).</li><li><code>(&gt;= eval2 (length lst))</code>: חריגה מהאורך (אינדקסים מתחילים מ-0 ולכן האינדקס המקסימלי האפשרי קטן באחד מאורך הרשימה).</li></ol>`,
            "step5_6": `<p>אם עברנו את בדיקת הגבולות בשלום, מתבצעת המסירה. המפרש משתמש בפקודת <code>list-ref</code> המובנית של שפת הרקע (Scheme) כדי לשלוף מתוך הרשימה הטהורה <code>lst</code> את האיבר שנמצא במיקום <code>eval2</code>. מכיוון שהאיברים בתוך <code>lst</code> כבר ארוזים בקופסאות <code>expval</code>, התוצאה שחוזרת היא <code>expval</code> חוקי ומוכן.</p>`,

            "step6_1": `<p><strong>תחנת המכס של המשתנים.</strong> המפרש ניגש לסביבה (<code>env</code>), מחפש את המשתנה <code>var</code>, ושולף את הערך שלו מתוך הזיכרון בעזרת <code>deref</code>. אבל רגע! בגלל שאנחנו תומכים בעצלנות ב-<code>map</code>, יכול להיות שהערך ששמור שם הוא בכלל קופסה קפואה (<code>unevaluated-val</code>). אנחנו עוטפים את השליפה ב-<code>evaluate-map</code>.</p><ul class="list-disc list-inside ml-4 space-y-2 mb-4"><li>אם זה ערך רגיל (כמו מספר 5), <code>evaluate-map</code> יחזיר אותו מיד.</li><li>אם זה שובר קפוא של <code>map</code>, הוא יופשר כעת ורק התוצאה המחושבת תחזור.</li></ul>`,
            "step6_2": `<p><strong>תחנת המכס של בלוק ה-<code>let</code>.</strong> המפרש מחשב את המשתנה החדש, מרחיב את הסביבה, ומריץ את ה-<code>body</code>. אבל מה קורה אם ה-<code>body</code> עצמו מחזיר פעולת <code>map</code> עצלה? אנחנו לא רוצים שבלוק ה-<code>let</code> "ידליף" שוברים החוצה. לכן, על התוצאה הסופית של ה-<code>body</code>, אנחנו מפעילים <code>evaluate-map</code> כדי להבטיח שהבלוק יחזיר נתון מוגמר ואמיתי.</p>`,
            "step6_3": `<p><strong>תחנת המכס של פיצולי הדרך (<code>if</code>).</strong><br>המפרש בודק את התנאי <code>exp1</code>. לאחר שהוא מחליט לאיזה ענף ללכת, הוא מחשב את הענף הרלוונטי (<code>exp2</code> או <code>exp3</code>). שוב, עטפנו כל אחד מהענפים ב-<code>evaluate-map</code>. זה מבטיח שלא משנה באיזה מסלול התוכנית בחרה, משפט ה-<code>if</code> יפלוט החוצה אך ורק נתון מחושב ולא הבטחה לחישוב.</p>`,
            "step6_4": `<p><strong>תחנת המכס של הפונקציות.</strong> פונקציות הן קופסאות שחורות: אתה מכניס קלט, ומקבל פלט. אם הפונקציה הזו במקרה מחזירה <code>map</code> כתוצאה שלה, הקריאה לפונקציה (<code>apply-procedure</code>) תחזיר לנו ארוחה קפואה. העטיפה ב-<code>evaluate-map</code> מוודאת שכל קריאה לפונקציה בשפה שלנו תסתיים תמיד כשהערך מופשר ומוכן לעבודה.</p>`,
            "step6_5": `<p>זוהי תחנת המכס <strong>החשובה ביותר במערכת</strong>, והסיבה שהבוחן הדגיש אותה בדיו אדום.<br>הפונקציה <code>value-of-program</code> היא "המעטפת החיצונית" של המפרש. היא זו שלוקחת את הקוד של המשתמש, מתחילה את הריצה מהסביבה הריקה, ובסוף <strong>מדפיסה את התוצאה למסך</strong>.<br>תאר לעצמך שמתכנת כתב תוכנית שלמה, והשורה האחרונה בתוכנית שלו הייתה בקשה לעשות <code>map</code>. אם לא היינו שמים כאן <code>evaluate-map</code>, התוכנית הייתה מסתיימת, והמפרש היה מדפיס למסך של המתכנת: <code>&lt;unevaluated-val&gt;</code>.<br>מבחינת המתכנת – זו שגיאה נוראית או באג. הוא ציפה לראות רשימה של מספרים! לכן, ההוראה כאן היא קריטית: רגע לפני שאתה מגיש את הפלט הסופי של התוכנית כולה בחזרה למתכנת, אתה <strong>חייב</strong> לפדות את כל השוברים ולהציג לו את התוצאה האמיתית והמוחשית.</p>`

                    <div id="image-upload-fallback" class="hidden mt-4 p-8 border-2 border-dashed border-slate-300 rounded-xl bg-slate-50">
                        <i class="fa-regular fa-image text-4xl text-slate-400 mb-3"></i>
                        <p class="text-slate-500 mb-4 font-bold text-lg">תמונת השאלה חסרה</p>
                        <p class="text-slate-400 mb-6 text-sm">אנא בחר את קובץ התמונה שהורדת כדי להציג אותו כאן. (התמונה תישמר בדפדפן שלך לתמיד!)</p>
                        <input type="file" id="image-upload-input" accept="image/*" class="block w-full max-w-xs mx-auto text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-blue-50 file:text-primary hover:file:bg-blue-100 cursor-pointer">
                    </div>
                </div>`;
            } else if (step.isFinal) {
                let html = '<div class="space-y-12">';
                steps.forEach(s => {
                    if (s.code && !s.isFinal) {
                        html += `
                        <div>
                            <h3 class="text-xl font-bold text-slate-800 mb-4">${s.title}</h3>
                            <div class="code-window">
                                <div class="code-window-header ltr" dir="ltr">
                                    <div class="mac-buttons">
                                        <div class="mac-btn mac-close"></div>
                                        <div class="mac-btn mac-min"></div>
                                        <div class="mac-btn mac-max"></div>
                                    </div>
                                    <div class="code-filename"><i class="fa-solid fa-code mr-2"></i>${s.filename}</div>
                                </div>
                                <div class="code-body ltr text-left" dir="ltr">
                                    <pre><code class="language-scheme">${s.code}</code></pre>
                                </div>
                            </div>
                        </div>
                        `;
                    }
                });
                html += '</div>';
                stepExplanation.innerHTML = html;
                Prism.highlightAllUnder(stepExplanation);
            } else {
                if (step.mentalModelBefore) {
                    stepExplanation.innerHTML = `
                    <button onclick="toggleAccordion('before')" class="accordion-btn rounded-xl bg-purple-50 text-purple-900 border-purple-200 hover:bg-purple-100 flex items-center justify-between p-4 w-full font-bold mb-6 border border-dashed border-purple-300 shadow-sm">
                       <span><i class="fa-solid fa-brain mr-2 ml-2"></i> מודל מנטלי לפני הקוד</span>
                       <i id="acc-icon-before" class="fa-solid fa-chevron-down transition-transform"></i>
                    </button>
                    <div id="acc-content-before" class="hidden bg-white border border-purple-100 p-6 rounded-xl shadow-sm mb-6 text-slate-700 leading-relaxed text-[1.05rem]">
                        ${step.mentalModelBefore}
                    </div>`;
                }

                if (step.code) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-solid fa-code mr-2"></i>${step.filename}`;
                    codeBlock.innerHTML = step.code;
                    Prism.highlightElement(codeBlock);

                    if (step.mentalModelAfter) {
                        stepAfterExplanation.innerHTML = `
                        <button onclick="toggleAccordion('after')" class="accordion-btn rounded-xl bg-indigo-50 text-indigo-900 border-indigo-200 hover:bg-indigo-100 flex items-center justify-between p-4 w-full font-bold mb-4 mt-8 border border-dashed border-indigo-300 shadow-sm">
                           <span><i class="fa-solid fa-lightbulb mr-2 ml-2"></i> סיכום לאחר הקוד</span>
                           <i id="acc-icon-after" class="fa-solid fa-chevron-down transition-transform"></i>
                        </button>
                        <div id="acc-content-after" class="hidden bg-white border border-indigo-100 p-6 rounded-xl shadow-sm mb-6 text-slate-700 leading-relaxed text-[1.05rem]">
                            ${step.mentalModelAfter}
                        </div>`;
                    }
                }
            }

            prevBtn.disabled = currentStep === 0;
            stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;

            if (currentStep === steps.length - 1) {
                nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
            } else {
                nextBtn.innerHTML = 'המשך <i class="fa-solid fa-arrow-left mr-2"></i>';
            }

            renderSidebar();

            setTimeout(() => {
                initTooltips();
            }, 50);

            contentContainer.classList.remove('fade-enter');
            contentContainer.classList.add('fade-enter-active');
        }

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-collapsed');
            const isCollapsed = document.body.classList.contains('sidebar-collapsed');
            localStorage.setItem('sidebarCollapsed', isCollapsed);

            // Update icon direction
            const icon = document.getElementById('sidebar-toggle-icon');
            if (isCollapsed) {
                icon.className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            } else {
                icon.className = 'fa-solid fa-chevron-right text-lg transition-transform duration-300';
            }
        }

        function init() {
            // Restore tooltip state from localStorage
            const savedState = localStorage.getItem('globalTooltipState');
            if (savedState) {
                tooltipState = parseInt(savedState);
            }
            updateCyclerUI();

            // Create and inject sidebar toggle button
            const toggleBtn = document.createElement('button');
            toggleBtn.id = 'sidebar-toggle-btn';
            toggleBtn.onclick = toggleSidebar;
            toggleBtn.innerHTML = '<i id="sidebar-toggle-icon" class="fa-solid fa-chevron-right text-lg transition-transform duration-300"></i>';
            document.body.appendChild(toggleBtn);

            // Load sidebar collapsed state from localStorage
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (isCollapsed) {
                document.body.classList.add('sidebar-collapsed');
                document.getElementById('sidebar-toggle-icon').className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            }

            updateUI();
        }

        init();
    </script>
    <script src="ai_widget.js"></script>
