    <script>
        let hoverCloseTimer = null;

        function clearCloseTimer() {
            if (hoverCloseTimer) {
                clearTimeout(hoverCloseTimer);
                hoverCloseTimer = null;
            }
        }

        function startCloseTimer() {
            if (tooltipState !== 3) return;
            clearCloseTimer();
            hoverCloseTimer = setTimeout(() => {
                closeModal(null, true);
            }, 300); // 300ms delay to allow mouse movement to modal
        }

        // Global click listener to close modal when clicking outside in click mode
        document.addEventListener('click', (event) => {
            const modal = document.getElementById('explanation-modal');
            const modalCard = document.getElementById('modal-card');

            if (!modal.classList.contains('hidden')) {
                // If the click is NOT inside the modal-card, and NOT on an interactive tooltip
                if (!modalCard.contains(event.target) && !event.target.closest('.interactive-tooltip')) {
                    closeModal(null, true);
                }
            }
        });
        const explanationsDict = {
            
            "step1_1": `<div class="space-y-3">
                <p>אנחנו אומרים למחולל הדקדוק (ה-Parser): "אני הולך להגדיר לך עכשיו סוג חדש של <strong>ביטוי</strong> (expression) שמעכשיו השפה שלנו תדע לזהות".</p>
            </div>`,
            
            "step1_2": `<div class="space-y-3">
                <p>זוהי תחילת תבנית הזיהוי. המפרש יחפש בטקסט את המילה השמורה <code>"for/sum"</code>, אחריה סוגריים מסולסלים פותחים <code>{"</code>, בתוכם הוא יחפש <strong>מזהה</strong> (identifier - כלומר, שם של משתנה, למשל <code>x</code> או <code>i</code> שיהיה המשתנה הרץ של הלולאה), ואז סוגריים סוגרים <code>"}"</code>.</p>
            </div>`,
            
            "step1_3": `<div class="space-y-3">
                <p>המפרש ממשיך לקרוא את הטקסט ומצפה למצוא עכשיו רשימה של ביטויים (<code>expression</code>), שמופרדים ביניהם בפסיקים (זה מה ש-<code>separated-list</code> עושה). אלו בעצם האיברים שהלולאה שלנו תעבור עליהם.</p>
                <p>מיד אחרי הרשימה, המפרש מחפש סימני פיסוק ספציפיים שהוגדרו מראש בתחביר של השפה: <code>")"</code> ו-<code>"}"</code>. אלה "עוגנים" שעוזרים למפרש להבין שהרשימה נגמרה.</p>
            </div>`,
            
            "step1_4": `<div class="space-y-3">
                <p>פה מגיע החלק של השומרים. המפרש מחפש סוגר פותח <code>"{"</code>, ואז יש פקודה מיוחדת: <code>arbno</code> (קיצור של Arbitrary Number - מספר שרירותי). זה אומר למפרש: "מעכשיו, תחפש תבניות של שומרים. יכול להיות שיהיו 0 שומרים, יכול להיות שיהיו 5 שומרים. תאסוף את כולם לרשימה אחת". כל שומר כזה צריך להיות עטוף גם הוא בתוך <code>{ }</code>.</p>
            </div>`,
            
            "step1_5": `<div class="space-y-3">
                <p>לסיום התבנית, המפרש מצפה לביטוי נוסף (<code>expression</code>) - זהו "גוף" הלולאה, החישוב שיתבצע על כל איבר וייסכם בסוף. מיד לאחריו הוא חייב לראות את המילה <code>"for/end"</code>, שחותמת את הלולאה.</p>
            </div>`,
            
            "step1_6": `<div class="space-y-3">
                <p>זו שורת התוצאה. אם המפרש קרא את הטקסט וראה שהוא מתאים לכל התבנית המורכבת שהגדרנו למעלה - הוא לוקח את כל המידע שחולץ (המשתנה, רשימת האיברים, רשימת השומרים, וגוף הלולאה), ואורז אותם לתוך קופסה חדשה בעץ התחביר שנקראת (Node בשם <code>forsum-exp</code>). מאוחר יותר, ה-<code>value-of</code> ישתמש ב-<code>cases</code> בדיוק על הקופסה הזו.</p>
            </div>`,
            
            "step1_7": `<div class="space-y-3">
                <p>אנחנו מגדירים משפחה תחבירית חדשה בשם <code>guard</code>. התבנית הראשונה שלה אומרת: אם מצאת את המילה <code>"skip"</code>, אחריה נקודתיים <code>":"</code>, ואז ביטוי מתמטי/לוגי כלשהו (<code>expression</code> - למשל <code>(&gt; x 10)</code>), תארוז את זה לקופסה מסוג <code>skip-guard</code>. הקופסה הזו תחזיק בתוכה את התנאי שהמתכנת כתב.</p>
            </div>`,
            
            "step1_8": `<div class="space-y-3">
                <p>התבנית השנייה מאותה משפחה. אם מצאת את המילה <code>"break"</code>, אחריה <code>":"</code> ואז ביטוי, תארוז את התנאי הזה לתוך קופסה מסוג <code>break-guard</code>.</p>
            </div>`,

            "step2_1": `<div class="space-y-3">
                <p>אנחנו מצהירים על יצירת "משפחה" (Type) חדשה של נתונים בשפה שלנו, וקוראים לה <code>guard</code>.</p>
                <p>המילה השנייה, <code>guard?</code>, היא בונוס שהמערכת מייצרת עבורנו אוטומטית: זוהי פונקציית שאילתה (Predicate). מעכשיו, נוכל לשאול את המפרש על כל חפץ בעולם: <code>(guard? x)</code>. אם x הוא אחת מקופסאות השומרים שנייצר מיד, התשובה תהיה <code>#t</code> (אמת), ואם לא, התשובה תהיה <code>#f</code> (שקר). זה חיוני כדי לוודא שאנחנו עובדים עם הנתונים הנכונים.</p>

            "step2_3": `<div class="space-y-3">
                <p>אנחנו מגדירים את ה<strong>שדות (Fields)</strong> שבתוך קופסת ה-<code>skip-guard</code>.<br>
                אנחנו אומרים שיש פה תא אחד בשם <code>cond-exp</code> (קיצור של Condition Expression - ביטוי התנאי).</p>
                <div class="bg-indigo-50 p-3 rounded border border-indigo-100 text-indigo-900">
                    המילה <code>expression?</code> היא <strong>חוזה ההגנה</strong> של התא הזה: אי אפשר להכניס לפה סתם טקסט או מספר, אלא רק משהו שכבר עבר תהליך ונארז כקופסה ממשפחת ה-<code>expression</code> (למשל, ביטוי מתמטי כמו פעולת חיבור או בדיקת גדול/קטן). אם ננסה לדחוף לשם משהו אחר, השפה תזרוק שגיאה מיד. זה מבטיח שהעץ שלנו תקין (Type-safe).
                </div>
            </div>`,

            "step2_4": `<div class="space-y-3">
                <p>אנחנו מגדירים את <strong>הווריאנט השני</strong> במשפחת ה-<code>guard</code>. המבנה הפנימי שלו זהה לחלוטין לזה של ה-<code>skip</code> – גם הוא דורש תא אחד מסוג <code>expression?</code> בשם <code>cond-exp</code>.</p>
                <div class="bg-indigo-50 p-3 rounded border border-indigo-100 text-indigo-900">
                    <em>אז למה אנחנו צריכים אותו אם הוא נראה אותו דבר?</em><br>
                    כי ה<strong>שם</strong> שלו שונה (<code>break-guard</code>). כשהקופסה הזו תגיע בסופו של דבר לפונקציית ה-<code>value-of</code> (בזמן הריצה האמיתי), המפרש יפתח אותה בעזרת פקודת <code>cases</code>. שם הפקודה <code>cases</code> תסתכל על התווית: אם כתוב עליה <code>skip-guard</code>, המפרש יבצע לוגיקה של דילוג לאיבר הבא. אם כתוב עליה <code>break-guard</code>, המפרש יפעיל לוגיקה שונה לגמרי שתעצור את כל לולאת ה-<code>for/sum</code> ותצא החוצה.
                </div>
            </div>`,

            "step3_1": `<div class="space-y-3">
                <p>זוהי שורת תבנית בתוך פקודת ה-<code>cases</code> של הפונקציה <code>value-of</code>. המפרש מחזיק עכשיו ביד קופסה מסוג <code>forsum-exp</code> (אותה קופסה שהגדרנו ב-<code>lang.scm</code>). השורה הזו <strong>פותחת את הקופסה</strong> ושולפת מתוכה את ארבעת הרכיבים ששמרנו בה לתוך משתנים מקומיים:</p>
                <ol class="list-decimal list-inside ml-4 space-y-1">
                    <li><code>id</code> - שם המשתנה (למשל <code>x</code>).</li>
                    <li><code>exps</code> - רשימת הביטויים שהלולאה תעבור עליהם.</li>
                    <li><code>guards</code> - רשימת קופסאות השומרים שלנו (<code>skip</code> ו-<code>break</code>).</li>
                    <li><code>body</code> - הביטוי שמחשב את הערך שנוסיף לסכום בכל איטרציה.</li>
                </ol>
            </div>`,

            "step3_2": `<div class="space-y-3">
                <p>זוהי בדיקת השפיות שלנו. המפרש שואל תנאי: "האם רשימת הביטויים (<code>exps</code>) ריקה?".</p>
                <p>בשפה שמעצב הקוד החליט לבנות, לולאת <code>for/sum</code> על רשימה ריקה היא פעולה לא חוקית (בניגוד לשפות אחרות שבהן זה אולי פשוט היה מחזיר 0).</p>
            </div>`,

            "step3_3": `<div class="space-y-3">
                <p>אם הרשימה אכן ריקה (מקרה ה-True של ה-<code>if</code>), אנחנו מפעילים את הפקודה <code>eopl:error</code>. הפקודה הזו <strong>עוצרת מיד את כל ריצת התוכנית</strong> וזורקת שגיאה למסך של המתכנת.</p>
                <p>היא אומרת לו: "היי, בתוך <code>forsum-exp</code>, הרשימה שסיפקת עבור המשתנה שלך (ה-<code>~s</code> יוחלף בשם המשתנה ששמור ב-<code>id</code>) היא ריקה!". זוהי דרך מצוינת למנוע באגים מוזרים בהמשך הריצה.</p>
            </div>`,

            "step3_4": `<div class="space-y-3">
                <p>זהו ה-Else של תנאי ה-<code>if</code>. אם הרשימה <strong>לא</strong> ריקה, יש לנו עבודה לעשות. יש כאן שתי פעולות שקורות מהפנים החוצה:</p>
                <ol class="list-decimal list-inside ml-4 space-y-2">
                    <li><code>(eval-forsum ...)</code>: המפרש קורא לפונקציית עזר (Helper Function) חיצונית בשם <code>eval-forsum</code>. הוא מעביר אליה את כל החלקים ששלפנו מהקופסה, ומוסיף עוד משהו קריטי: את ה-<code>env</code> (הסביבה הנוכחית - Environment). למה הסביבה חשובה? כי כדי לחשב את גוף הלולאה או לבדוק את התנאים של השומרים, המפרש חייב לדעת אילו משתנים קיימים כרגע בזיכרון. פונקציית העזר הזו תעשה את כל הרקורסיה המסובכת ותחזיר לנו בסוף מספר טהור (Scheme Number).</li>
                    <li><code>(num-val ...)</code>: המפרש לא יכול פשוט להחזיר מספר טהור. בתוך <code>value-of</code>, כל תוצאה חייבת להיות מסוג <code>expval</code> (ערך ביטוי חוקי של השפה שלנו). לכן, אנחנו לוקחים את המספר שחזר מפונקציית העזר ואורזים אותו בקופסה התקנית של השפה שלנו למספרים – <code>num-val</code>.</li>
                </ol>
            </div>`,

            "step4_1": `<div class="space-y-3">
                <p>תנאי העצירה של הרקורסיה. אם אין יותר איברים לסכום (<code>exps</code> ריקה), התוצאה היא 0 (האלמנט הניטרלי של חיבור).</p>
            </div>`,

            "step4_2": `<div class="space-y-3">
                <p>אנחנו מכינים את הקרקע עבור האיבר הנוכחי (<code>car exps</code>):</p>
                <ul class="list-disc list-inside ml-4 space-y-1">
                    <li><code>val</code>: מחשבים את הערך שלו.</li>
                    <li><code>new-env</code>: מייצרים סביבה חדשה שבה המשתנה <code>id</code> מקבל את הערך הזה (כדי שבתוך גוף הלולאה, המשתנה הרץ יהיה מעודכן).</li>
                    <li><code>action</code>: קוראים לפונקציית העזר <code>check-guards</code> כדי לקבל החלטה – האם לחשב את הגוף, לדלג, או לעצור הכל?</li>
                </ul>
            </div>`,

            "step4_3": `<div class="space-y-3">
                <p>אם הפעולה היא 0 (המשך רגיל): אנחנו מחשבים את ערך ה-<code>body</code> (החישוב שהמשתמש ביקש), ומחברים אותו לתוצאה של הרקורסיה על שאר הרשימה (<code>cdr exps</code>).</p>
            </div>`,

            "step4_4": `<div class="space-y-3">
                <ul class="list-disc list-inside ml-4 space-y-2">
                    <li>פעולה 1 (<code>skip</code>): אנחנו פשוט ממשיכים ל-<code>eval-forsum</code> של שאר הרשימה, בלי להוסיף כלום לסכום.</li>
                    <li>פעולה 2 (<code>break</code>): אנחנו מחזירים 0. זה "קוצר" את הרקורסיה ומסיים את כל הלולאה באופן מיידי.</li>
                </ul>
            </div>`,

            "step4_5": `<div class="space-y-3">
                <p>אם אין יותר שומרים לבדוק, הפעולה חוזרת להיות 0 (מצב תקין).</p>
            </div>`,

            "step4_6": `<div class="space-y-3">
                <p>זו לוגיקת הסלקציה:</p>
                <ol class="list-decimal list-inside ml-4 space-y-1">
                    <li>שולפים את ביטוי התנאי מתוך השומר (<code>guard-&gt;exp</code>).</li>
                    <li>מעריכים את התנאי בסביבה הנוכחית.</li>
                    <li>אם התנאי אמת (<code>result</code> הוא <code>#t</code>): בודקים בעזרת <code>cases</code> איזה סוג שומר זה. אם זה <code>skip-guard</code> – מחזירים 1. אם זה <code>break-guard</code> – מחזירים 2.</li>
                    <li>אם התנאי שקר: ממשיכים לבדוק את השומר הבא בתור (<code>cdr guards</code>).</li>
                </ol>
            </div>`,

            "step4_7": `<div class="space-y-3">
                <p>פונקציית עזר פשוטה שמקבלת את קופסת ה-<code>guard</code> (שזכרנו מהקובץ הקודם), פותחת אותה, ושולפת רק את הביטוי התנאי (<code>e</code>) שנמצא בתוכה.</p>
            </div>`

            toggleBtn.id = 'sidebar-toggle-btn';
            toggleBtn.onclick = toggleSidebar;
            toggleBtn.innerHTML = '<i id="sidebar-toggle-icon" class="fa-solid fa-chevron-right text-lg transition-transform duration-300"></i>';
            document.body.appendChild(toggleBtn);

            // Load sidebar collapsed state from localStorage
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (isCollapsed) {
                document.body.classList.add('sidebar-collapsed');
                document.getElementById('sidebar-toggle-icon').className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            }

            updateUI();
        }

        init();
    </script>
</body>

</html>
