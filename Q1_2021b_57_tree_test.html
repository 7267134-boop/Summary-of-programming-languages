    <style>

        body {

        .code-window-header {

        .mac-buttons {
            display: flex;

        }

        .mac-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .mac-close {
            background-color: #ff5f56;
        }

        .mac-min {
            background-color: #ffbd2e;
        }

        .mac-max {
            background-color: #27c93f;
        }

        .code-filename {
            color: #98c379;
            font-family: monospace;
            font-size: 0.85rem;

            letter-spacing: 0.5px;
            flex: 1;
            text-align: right;
            padding-right: 1rem;
        }

        .code-body {
            padding: 1.25rem;
            overflow-x: auto;
        }

        pre[class*="language-"] {
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
            font-size: 0.95rem;
            line-height: 1.7;
            text-shadow: none !important;
        }

        /* Interactive Code Tooltips - CLEAN and SUBTLE */
        .interactive-tooltip {
            transition: all 0.2s;
            border-radius: 4px;
            color: inherit;
            background-color: transparent;
            padding: 2px 0;
        }

        .interactive-tooltip.tooltip-active-style {
            cursor: pointer;
        }

        /* Very subtle gray background only on hover */
        .interactive-tooltip.tooltip-active-style:hover {
            background-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08);
        }

        /* Premium Cycler Button Animation */
        @keyframes pulse-soft {

    <!-- Prism JS and KeepMarkup Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-scheme.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/keep-markup/prism-keep-markup.min.js"></script>

    <script>
        let hoverCloseTimer = null;

        function clearCloseTimer() {
            if (hoverCloseTimer) {
                clearTimeout(hoverCloseTimer);
                hoverCloseTimer = null;
            }
        }

        function startCloseTimer() {
            if (tooltipState !== 3) return;
            clearCloseTimer();
            hoverCloseTimer = setTimeout(() => {
                closeModal(null, true);
            }, 300); // 300ms delay to allow mouse movement to modal
        }

        // Global click listener to close modal when clicking outside in click mode
        document.addEventListener('click', (event) => {
            const modal = document.getElementById('explanation-modal');
            const modalCard = document.getElementById('modal-card');

            if (!modal.classList.contains('hidden')) {
                // If the click is NOT inside the modal-card, and NOT on an interactive tooltip
                if (!modalCard.contains(event.target) && !event.target.closest('.interactive-tooltip')) {
                    closeModal(null, true);
                }
            }
        });
        const explanationsDict = {
            
            "step1_1": `<div class="space-y-3"><p>אנחנו משדרגים את פקודת ה-<code>let</code> המוכרת. במקום לכתוב <code>let identifier = expression</code>, שמאפשר רק משתנה אחד, החלפנו את המילה <code>identifier</code> במושג חדש שקראנו לו <code>temps</code> (קיצור של זמניים - temporaries). זה אומר למפרש: "בצד השמאלי של ההשמה, אל תצפה בהכרח רק למילה אחת, אלא למה שמוגדר תחת המושג <code>temps</code>". המבנה הזה יישמר בעץ בתור צומת מסוג <code>let-exp</code>.</p></div>`,
            "step1_2": `<div class="space-y-3"><p>כאן אנחנו מגדירים יצירה של אובייקט חדש בשפה – הטאפל (ה"מגש"). המפרש לומד שאם הוא רואה סוגר שמאלי עוקצני <code>&lt;</code> , ואחריו רשימה של ביטויים שמופרדים בפסיקים, ואז סוגר ימני <code>&gt;</code>, עליו לארוז את כולם יחד. בעץ התחביר שלנו (AST), הדבר הזה ייוצג על ידי קופסה שנקראת <code>tuple-exp</code>.</p></div>`,
            "step1_3": `<div class="space-y-3"><p>עכשיו אנחנו מסבירים למפרש מה זה ה-<code>temps</code> הזה שביקשנו ממנו לחפש ב-<code>let</code>. זוהי האפשרות הראשונה: קבלת משלוח רגיל. אם מתכנת פשוט כותב שם של משתנה (מזהה - <code>identifier</code>), כמו <code>x</code>, המפרש מזהה את זה כמקרה הבסיסי ומייצר קופסת AST מסוג <code>one-temp</code>.</p></div>`,
            "step1_4": `<div class="space-y-3"><p>זוהי האפשרות השנייה והמתקדמת עבור <code>temps</code> – <strong>הפירוק (Destructuring)</strong>. אם המפרש רואה סוגריים מרובעים <code>[</code>, ובתוכם רשימה מופרדת בפסיקים, הוא מבין שהמתכנת רוצה לחלץ נתונים מתוך טאפל. במקרה כזה, נוצרת קופסת AST מסוג <code>many-temp</code>.</p></div>`,
            "step1_5": `<div class="space-y-3"><p>מה קורה כשיש לנו טאפל עם הרבה איברים, אבל אנחנו צריכים רק חלק מהם? כדי לא לזהם את הזיכרון, הוספנו את "המגרסה". אם המפרש רואה קו תחתון <code>_</code>, הוא מייצר קופסה מסוג <code>ignore</code> שמנחה אותו לדלג על הערך הזה.</p></div>`,
            "step1_6": `<div class="space-y-3"><p>זוהי האפשרות הרגילה בתוך רשימת פירוק. אם זה משתנה אמיתי (כמו <code>x</code> או <code>my-val</code>), המפרש ייצר קופסה מסוג <code>id</code>.</p></div>`,

            "step2_1": `<div class="space-y-3"><p>כאן אנחנו ממנים את "מפקח האיכות" שלנו, הפונקציה (פרדיקט) <code>tuple?</code>. תפקידה הוא לקבל נתון ולוודא שהוא אכן טאפל חוקי של השפה שלנו.</p></div>`,
            "step2_2": `<div class="space-y-3"><p>המפקח שואל קודם כל: "האם קיבלתי זוג (Pair)?" אם לא, זה בטוח לא טאפל חוקי והוא יחזיר שקר.</p></div>`,
            "step2_3": `<div class="space-y-3"><p>אם זה כן זוג, המפקח שולף את האיבר הראשון ובודק שהוא ארוז ב-<code>expval</code> תקני.</p></div>`,
            "step2_4": `<div class="space-y-3"><p>לאחר מכן הוא בודק את שאר האיברים ברקורסיה כדי לוודא שכל איבר בשרשרת הוא <code>expval</code> חוקי.</p></div>`,
            "step2_5": `<div class="space-y-3"><p>אנחנו מוסיפים טיפוס חדש ל-<code>expval</code>: <code>tuple-val</code>, שישמור בזיכרון את הטאפל בזמן ריצה.</p></div>`,
            "step2_6": `<div class="space-y-3"><p>כעת אנו מייצרים את "הפותחן" (פונקציית חילוץ - Extractor). המפרש מקבל קופסה ושואל איזה סוג קופסה זו.</p></div>`,
            "step2_7": `<div class="space-y-3"><p>אם הקופסה היא <code>tuple-val</code>, פותחים אותה ומשולפים את הרשימה הפנימית (ה-<code>tuple</code>).</p></div>`,
            "step2_8": `<div class="space-y-3"><p>מערכת הגנה: אם המפרש ציפה לטאפל אבל קיבל מספר, תזרק שגיאה.</p></div>`,

            "step3_1": `<div class="space-y-3"><p>זמן הריצה של <code>tuple-exp</code>: מקבלים רשימה של ביטויים שטרם חושבו.</p></div>`,
            "step3_2": `<div class="space-y-3"><p>מפעילים <code>value-of</code> על כל ביטוי בנפרד ואוספים לתוך רשימת הערכים <code>vals</code>.</p></div>`,
            "step3_3": `<div class="space-y-3"><p>בדיקת תקינות - טאפל ריק לא חוקי בשפה.</p></div>`,
            "step3_4": `<div class="space-y-3"><p>אורזים את הכל לתוך <code>tuple-val</code> חדש ושומרים בזיכרון.</p></div>`,
            "step3_5": `<div class="space-y-3"><p>זמן הריצה של <code>let-exp</code>.</p></div>`,
            "step3_6": `<div class="space-y-3"><p>מחשבים את הביטוי בצד ימין ושומרים ב-<code>val1</code>.</p></div>`,

        // Modal Functions
        function openModal(codeText, explanationHtml) {
            const modal = document.getElementById('explanation-modal');
            const modalCard = document.getElementById('modal-card');
            const modalCode = document.getElementById('modal-code');
            const modalExplanation = document.getElementById('modal-explanation');

            modalCode.textContent = codeText.replace(/^\n+|\n+$/g, '');
            Prism.highlightElement(modalCode);
            modalExplanation.innerHTML = explanationHtml;

            modal.classList.remove('hidden');
            // Trigger reflow for animation
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            modalCard.classList.remove('scale-95');
            modal.classList.add('flex');
        }

        function closeModal(event, force = false) {
            if (event && !force) {
                // If they clicked directly on the modal backdrop, close it.
                if (event.target !== document.getElementById('explanation-modal')) {
                    return;
                }
            }

            const modal = document.getElementById('explanation-modal');
            const modalCard = document.getElementById('modal-card');

            modal.classList.add('opacity-0');
            modalCard.classList.add('scale-95');

            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        function initTooltips() {
            // Reset state
            const marks = document.querySelectorAll('mark.interactive-tooltip');

            marks.forEach(m => {
                m.classList.remove('tooltip-active-style');
                m.style.pointerEvents = 'none';

                // Remove old listeners by cloning
                const newMark = m.cloneNode(true);
                m.parentNode.replaceChild(newMark, m);
            });

            if (tooltipState === 1) return;

            const freshMarks = document.querySelectorAll('mark.interactive-tooltip');
            freshMarks.forEach(m => {
                m.classList.add('tooltip-active-style');
                m.style.pointerEvents = 'auto';

                const explanationKey = m.getAttribute('data-key');
                const explanation = explanationsDict[explanationKey] || "הסבר חסר";
                const codeText = m.textContent;

                if (tooltipState === 2) {
                    m.addEventListener('click', () => openModal(codeText, explanation));
                } else if (tooltipState === 3) {
                    m.addEventListener('mouseenter', () => {
                        clearCloseTimer();
                        openModal(codeText, explanation);
                    });
                    m.addEventListener('mouseleave', () => {
                        startCloseTimer();
                    });
                }
            });
        }

                        code: `(define expval->tuple\n  (lambda (v)\n    (cases expval v\n      (tuple-val (tuple) tuple)\n      (else (expval-extractor-error 'tuple v)))))`, 
                        details: "יצירת 'פותחן הקופסאות' הייעודי עבור טאפלים. בדיוק כפי שיש לנו פונקציות חילוץ למספרים (expval->num) בזיכרון, זו הפונקציה שמקבלת ערך מסוים מזיכרון הריצה, פותחת את קופסת ה-'tuple-val' המגנה, ושולפת מתוכה את הרשימה הפנימית במידה והיא אכן טאפל. פונקציה זו היא כלי חיוני לשלב פירוק המבנים בהמשך." },

                        code: `(tuple-exp (exps)\n  (let ((vals (map (lambda (x) (value-of x env)) exps)))\n    (if (= (length vals) 0)\n        (eopl:error 'value-of "tuple can't be empty")\n        (tuple-val vals))))`, 
                        details: "הגענו לזמן הריצה (Runtime). כאן אנחנו מגדירים איך המפרש מבצע בפועל את יצירת הטאפל. הפונקציה מקבלת את רשימת הביטויים שטרם חושבו. היא עוברת עליהם במקביל (עם map), מפעילה עליהם באופן רקורסיבי את 'value-of' כדי לחשב כל אחד לערך סופי, ואוספת את התוצאות. אם הטאפל לא ריק, היא אורזת הכל במרוכז לתוך 'tuple-val' ומוחזרת אובייקט רשמי שיישמר בזיכרון." },
            'tagnode_3_2': { title: "let-exp (one)", desc: "השמת משתנה בודד", icon: "fa-arrow-right-to-bracket", step: 3,

                        code: `(let-exp (var exp1 body)\n  (let* ((val1 (value-of exp1 env))\n         (body-env (cases temps var\n                     (one-temp (id) (extend-env id val1 env))\n                     ;; ...\n                     )))\n    (value-of body body-env)))`, 
                        details: "החצי הראשון של שדרוג ה-let (פקודת ההשמה) בזמן ריצה. לאחר שהמפרש מחשב את הביטוי בצד ימין (הטאפל שלנו), הוא מסתכל מה כתוב לו בצד השמאלי. אם הצד השמאלי זוהה כתבנית 'one-temp' (כלומר משתנה בודד ורגיל), הוא פשוט קורא ל-extend-env המסורתי ושומר את קופסת הטאפל בשלמותה לתוך אותו משתנה בודד בזיכרון (ה-Environment)." },
            'tagnode_3_3': { title: "let-exp (many)", desc: "השמת פירוק", icon: "fa-network-wired", step: 3,
                        location: "interp.scm -> פונקציית הערכת הביטויים (value-of)",
                        code: `(let-exp (var exp1 body)\n  (let* ((val1 (value-of exp1 env))\n         (body-env (cases temps var\n                     ;; ...\n                     (many-temp (opt-ids) (apply-let opt-ids (expval->tuple val1) env)))))\n    (value-of body body-env)))`, 
                        details: "החצי השני והסופר-מתקדם של פקודת ה-let! במידה וצד שמאל זוהה כתבנית פירוק מרובה ('many-temp' עם סוגריים מרובעים), המפרש לוקח את הערך שחושב, מפעיל עליו מיד את 'פותחן הקופסאות' (expval->tuple) כדי לשלוף מתוכו את רשימת הערכים הטהורה, ואז משגר את רשימת השמות יחד עם רשימת הערכים לפונקציית העזר 'apply-let' - שמטרתה לחלק את השלל אחד-אחד." },

            // Level 4: interp.scm (B)
            'tagnode_4_1': { title: "apply-let", desc: "לולאת הרוכסן", icon: "fa-file-zipper", step: 4,
                        location: "interp.scm -> פונקציית עזר להשמה (Helper function)",
                        code: `(define (apply-let vars vals env)\n  (define (apply-let-impl vars vals env count)\n    (if (= (length vars) (length vals))\n        (if (null? vars)\n            (if (zero? count)\n                (eopl:error 'apply-let "Empty tmps in let is disallowed")\n                env)\n            (cases optional-identifier (car vars)\n              (ignore () (apply-let-impl (cdr vars) (cdr vals) env count))\n              (id (var) (apply-let-impl (cdr vars) (cdr vals) \n                                       (extend-env var (car vals) env) \n                                       (+ count 1)))))\n        (eopl:error 'apply-let "mismatch")))\n  (apply-let-impl vars vals env 0))`, 
                        details: "לב ליבו של מנגנון פירוק המבנים (Destructuring). זוהי פונקציית העזר (ה'רוכסן') שעוברת בלולאה במקביל על רשימת המשתנים הנדרשים (vars) ועל רשימת הערכים שבפועל יש בטאפל (vals). היא מדלגת באלגנטיות על ערכים שסומנו במגרסה ('ignore'), שומרת בעזרת 'extend-env' אך ורק משתנים רגילים ('id') לסביבת הזיכרון, מתחזקת 'קליקר' (count) כדי לוודא שלפחות השמה אחת בוצעה בפועל, וזורקת שגיאות במקרים של אי-התאמה באורכי הרשימות." }

        let isModalOpen = false;

        function openTreeModal() {
            try {
                if(!isModalOpen) {
                    renderGraphNodes();
                    isModalOpen = true;
                }
                const modal = document.getElementById('tree-modal');
                const modalCard = document.getElementById('tree-modal-card');
                modal.classList.remove('hidden');
                void modal.offsetWidth; 
                modal.classList.remove('opacity-0');
                modalCard.classList.remove('scale-95');
                modal.classList.add('flex');
                
                // Draw lines initially
                setTimeout(drawLines, 350); 
            } catch(e) {
                console.error("openTreeModal failed", e);
            }
        }

        function closeTreeModal() {
            closeNodeModal(); // Close child modal if open
            const modal = document.getElementById('tree-modal');
            const modalCard = document.getElementById('tree-modal-card');
            modal.classList.add('opacity-0');
            modalCard.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        function renderGraphNodes() {
            try {
                const pane = document.getElementById('graph-pane');
                const oldLevels = pane.querySelectorAll('.graph-level-wrapper');
                oldLevels.forEach(e => e.remove());
                
                const levels = [
                    { label: "", nodes: ['tagnode_0'] },
                    { label: "1. lang.scm (התחביר / Parsing)", nodes: ['tagnode_1_1', 'tagnode_1_2', 'tagnode_1_3', 'tagnode_1_4', 'tagnode_1_5', 'tagnode_1_6'] },
                    { label: "2. data-structures.scm (מבני הנתונים / Data Types)", nodes: ['tagnode_2_1', 'tagnode_2_2', 'tagnode_2_3'] },
                    { label: "3. interp.scm חלק א (אריזה והכנה להשמה)", nodes: ['tagnode_3_1', 'tagnode_3_2', 'tagnode_3_3'] },
                    { label: "4. interp.scm חלק ב (ביצוע ההשמה בפועל)", nodes: ['tagnode_4_1'] }
                ];
                                
                levels.forEach((levelObj) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'graph-level-wrapper w-full flex flex-col items-center mb-12 relative z-10';
                    
                    if (levelObj.label) {
                        const labelEl = document.createElement('div');
                        labelEl.className = 'text-slate-500 font-bold text-[12px] uppercase tracking-widest mb-4 bg-white/90 px-4 py-1.5 rounded-full border border-slate-200 shadow-sm backdrop-blur-sm';
                        labelEl.textContent = levelObj.label;
                        wrapper.appendChild(labelEl);
                    }

                    const row = document.createElement('div');
                    row.className = 'flex justify-center w-full gap-4';
                    
                    levelObj.nodes.forEach(nodeId => {
                        const data = graphNodes[nodeId];
                        if(!data) return;
                        
                        const nodeEl = document.createElement('div');
                        nodeEl.id = nodeId;
                        nodeEl.className = 'node-container relative group cursor-pointer';
                        
                        nodeEl.addEventListener('click', function() {
                            showNodeDetails(nodeId);
                        });
                        
                        let cardClass = 'bg-white border shadow-sm rounded-[1rem] p-3 w-[140px] h-[120px] flex flex-col items-center text-center relative z-10 transition-all hover:-translate-y-1 hover:shadow-lg border-slate-200';
                        let iconColorClass = 'text-slate-500 bg-slate-50 border-slate-100';
                        let titleClass = 'font-black text-[14px] text-slate-800 leading-tight mt-3 mb-1.5';
                        let descClass = 'text-slate-500 text-[11px] font-medium leading-tight px-1';

                        if (nodeId === 'tagnode_0') {
                            cardClass = 'bg-slate-800 border-slate-700 shadow-md rounded-[1.2rem] p-4 w-[180px] h-[125px] flex flex-col items-center text-center relative z-10 transition-all hover:-translate-y-1 hover:shadow-lg text-white';
                            iconColorClass = 'text-slate-800 bg-white border-white';
                            titleClass = 'font-black text-[16px] text-white leading-tight mt-3 mb-1.5';
                            descClass = 'text-slate-300 text-[12px] font-medium leading-tight';
                        }

                        nodeEl.innerHTML = `
                            <div class="graph-card-el ${cardClass}">
                                <div class="selection-ring absolute -inset-1 border-[2px] border-transparent rounded-[1.2rem] transition-colors pointer-events-none"></div>
                                <div class="w-10 h-10 min-h-[40px] rounded-full ${iconColorClass} shadow-inner flex items-center justify-center border">
                                    <i class="fa-solid ${data.icon} text-[15px]"></i>
                                </div>
                                <h3 class="${titleClass}" dir="ltr">${data.title}</h3>
                                <span class="${descClass}">${data.desc}</span>
                            </div>
                        `;
                        row.appendChild(nodeEl);
                    });
                    wrapper.appendChild(row);
                    pane.appendChild(wrapper);
                });
            } catch(e) {
                console.error("renderGraphNodes failed", e);
            }
        }

        let activeSelectedNode = null;

        function showNodeDetails(nodeId) {
            try {
                const data = graphNodes[nodeId];
                if(!data) return;
                
                if (activeSelectedNode) {
                    const prev = document.getElementById(activeSelectedNode);
                    if(prev) {
                        const ring = prev.querySelector('.selection-ring');
                        if(ring) ring.classList.remove('border-blue-500', 'bg-blue-50/50');
                    }
                }
                activeSelectedNode = nodeId;
                const currentEl = document.getElementById(nodeId);
                if(currentEl) {
                    const ring = currentEl.querySelector('.selection-ring');
                    if(ring) ring.classList.add('border-blue-500', 'bg-blue-50/50');
                }
                
                try { drawLines(); } catch(e) {}
                
                // Open Popup Modal
                const modal = document.getElementById('node-details-modal');
                const modalCard = document.getElementById('node-details-card');
                modal.classList.remove('hidden');
                void modal.offsetWidth;
                modal.classList.remove('opacity-0');
                modalCard.classList.remove('scale-95');
                modal.classList.add('flex');
                
                document.getElementById('ndm-title').textContent = data.title;
                document.getElementById('ndm-location').textContent = data.location;
                document.getElementById('ndm-details').textContent = data.details;
                
                const iconEl = document.getElementById('ndm-icon');
                iconEl.className = `fa-solid ${data.icon} text-xl`;
                
                const codeEl = document.getElementById('ndm-code');
                codeEl.textContent = data.code;
                if (window.Prism) {
                    Prism.highlightElement(codeEl);
                }
                
                const btn = document.getElementById('ndm-jump-btn');
                if (data.step !== undefined && data.step >= 0) {
                    btn.classList.remove('hidden');
                    btn.onclick = () => {
                        goToStep(data.step);
                        closeNodeModal();
                        closeTreeModal();
                    };
                } else {
                    btn.classList.add('hidden');
                }
                
            } catch(e) {
                console.error("showNodeDetails failed", e);
            }
        }

        function closeNodeModal(e) {
            if (e && e.target.id !== 'node-details-modal' && e.target.id !== 'close-btn') return;
            const modal = document.getElementById('node-details-modal');
            const modalCard = document.getElementById('node-details-card');
            modal.classList.add('opacity-0');
            modalCard.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        function drawLines() {
            try {
                const svg = document.getElementById('lines-svg');
                if(!svg) return;
                
                svg.innerHTML = `
                    <defs>
                        <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
                            <polygon points="0 0, 6 2, 0 4" fill="#cbd5e1" />
                        </marker>
                        <marker id="arrowhead-active" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
                            <polygon points="0 0, 6 2, 0 4" fill="#3b82f6" />
                        </marker>
                    </defs>
                `;
                const pane = document.getElementById('graph-pane');
                const svgRect = svg.getBoundingClientRect();
                
                if (svgRect.width === 0 || svgRect.height === 0) return;
                
                const edges = [
                    ['tagnode_0', 'tagnode_1_1'], ['tagnode_0', 'tagnode_1_2'], ['tagnode_0', 'tagnode_1_3'], ['tagnode_0', 'tagnode_1_4'], ['tagnode_0', 'tagnode_1_5'], ['tagnode_0', 'tagnode_1_6'],
                    ['tagnode_1_1', 'tagnode_2_1'], ['tagnode_1_1', 'tagnode_3_1'],
                    ['tagnode_2_1', 'tagnode_2_2'], 
                    ['tagnode_2_2', 'tagnode_3_1'], ['tagnode_2_2', 'tagnode_2_3'],
                    ['tagnode_1_2', 'tagnode_3_2'], ['tagnode_1_2', 'tagnode_3_3'],
                    ['tagnode_1_3', 'tagnode_3_2'],
                    ['tagnode_1_4', 'tagnode_3_3'],
                    ['tagnode_2_3', 'tagnode_3_3'],
                    ['tagnode_1_5', 'tagnode_4_1'], ['tagnode_1_6', 'tagnode_4_1'],
                    ['tagnode_3_3', 'tagnode_4_1']
                ];
                
                edges.forEach(([id1, id2]) => {
                    const el1 = document.getElementById(id1);
                    const el2 = document.getElementById(id2);
                    if (!el1 || !el2) return;
                    
                    const card1 = el1.querySelector('.graph-card-el');
                    const card2 = el2.querySelector('.graph-card-el');
                    if (!card1 || !card2) return;
                    
                    const rect1 = card1.getBoundingClientRect();
                    const rect2 = card2.getBoundingClientRect();
                    
                    if (rect1.width === 0 || rect2.width === 0) return;
                    
                    const x1 = rect1.left - svgRect.left + (rect1.width / 2);
                    const y1 = rect1.bottom - svgRect.top;
                    
                    const x2 = rect2.left - svgRect.left + (rect2.width / 2);
                    const y2 = rect2.top - svgRect.top;
                    
                    const dy = y2 - y1;
                    
                    const cp1x = x1;
                    const cp1y = y1 + dy * 0.45;
                    const cp2x = x2;
                    const cp2y = y2 - dy * 0.45;
                    
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', `M ${x1} ${y1} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${x2} ${y2}`);
                    path.setAttribute('fill', 'none');
                    
                    let isActiveEdge = false;
                    if (activeSelectedNode && (activeSelectedNode === id1 || activeSelectedNode === id2)) {
                        isActiveEdge = true;
                    }
                    
                    path.setAttribute('stroke', isActiveEdge ? '#3b82f6' : '#cbd5e1');
                    path.setAttribute('stroke-width', isActiveEdge ? '3' : '2');
                    path.setAttribute('marker-end', isActiveEdge ? 'url(#arrowhead-active)' : 'url(#arrowhead)');
                    
                    if (isActiveEdge) {
                        path.style.strokeDasharray = '1000';
                        path.style.strokeDashoffset = '1000';
                        path.style.animation = 'dashAnim 0.8s ease-out forwards';
                        svg.appendChild(path);
                    } else {
                        if (svg.firstChild) {
                            svg.insertBefore(path, svg.firstChild);
                        } else {
                            svg.appendChild(path);
                        }
                    }
                });
            } catch(e) {
                console.error("drawLines failed", e);
            }
        }
        
        window.addEventListener('resize', () => { if(isModalOpen) drawLines(); });
        document.getElementById('graph-scroll-container').addEventListener('scroll', () => { if(isModalOpen) drawLines(); });
    
        function updateUI() {

            stepNumberBadge.textContent = step.isFinal ? "שלב סופי" : ("תחנה " + currentStep);
            stepTitle.textContent = step.title;
            stepExplanation.innerHTML = '';
            stepAfterExplanation.innerHTML = '';
            codeContainer.classList.add('hidden');

            if (step.isImageOnly) {
                let imagesHtml = '';
                if (Array.isArray(step.imageSrc)) {
                    imagesHtml = step.imageSrc.map((src, i) => `<img id="step-0-image-${i}" src="${src}" class="max-w-full h-auto rounded-xl shadow-lg border border-slate-200 mx-auto mb-4">`).join('');
                } else {
                    const savedImg = localStorage.getItem('q1_2021b_57_image') || localStorage.getItem('q1_2025c_83_image');
                    const imgSrc = savedImg ? savedImg : step.imageSrc;
                    imagesHtml = `<img id="step-0-image" src="${imgSrc}" class="max-w-full h-auto rounded-xl shadow-lg border border-slate-200 mx-auto" onerror="this.style.display='none'; document.getElementById('image-upload-fallback').style.display='block';">`;
                }

                stepExplanation.innerHTML = `
                <div class="text-center">
                    ${imagesHtml}
                    <div id="image-upload-fallback" class="hidden mt-4 p-8 border-2 border-dashed border-slate-300 rounded-xl bg-slate-50">

                        <p class="text-slate-500 mb-4 font-bold text-lg">תמונת השאלה חסרה</p>
                        <p class="text-slate-400 mb-6 text-sm">אנא בחר את קובץ התמונה שהורדת כדי להציג אותו כאן. (התמונה תישמר בדפדפן שלך לתמיד!)</p>
                        <input type="file" id="image-upload-input" accept="image/*" class="block w-full max-w-xs mx-auto text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-blue-50 file:text-primary hover:file:bg-blue-100 cursor-pointer">
                    </div>
                </div>`;
            } else if (step.isFinal) {
                let html = '<div class="space-y-12">';
                steps.forEach(s => {

                        html += `
                        <div>

                                <div class="code-window-header ltr" dir="ltr">
                                    <div class="mac-buttons">
                                        <div class="mac-btn mac-close"></div>
                                        <div class="mac-btn mac-min"></div>
                                        <div class="mac-btn mac-max"></div>
                                    </div>
                                    <div class="code-filename"><i class="fa-solid fa-code mr-2"></i>${s.filename}</div>
                                </div>
                                <div class="code-body ltr text-left" dir="ltr">
                                    <pre><code class="language-scheme">${s.code}</code></pre>
                                </div>
                            </div>
                        </div>
                        `;
                    }
                });
                html += '</div>';
                stepExplanation.innerHTML = html;
                Prism.highlightAllUnder(stepExplanation);
            } else {
                if (step.mentalModelBefore) {
                    stepExplanation.innerHTML = `
                    <button onclick="toggleAccordion('before')" class="accordion-btn rounded-xl bg-purple-50 text-purple-900 border-purple-200 hover:bg-purple-100 flex items-center justify-between p-4 w-full font-bold mb-6 border border-dashed border-purple-300 shadow-sm">
                       <span><i class="fa-solid fa-brain mr-2 ml-2"></i> מודל מנטלי לפני הקוד</span>
                       <i id="acc-icon-before" class="fa-solid fa-chevron-down transition-transform"></i>
                    </button>
                    <div id="acc-content-before" class="hidden bg-white border border-purple-100 p-6 rounded-xl shadow-sm mb-6 text-slate-700 leading-relaxed text-[1.05rem]">
                        ${step.mentalModelBefore}
                    </div>`;
                }

                if (step.code) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-solid fa-code mr-2"></i>${step.filename}`;
                    codeBlock.innerHTML = step.code;
                    Prism.highlightElement(codeBlock);

                    if (step.mentalModelAfter) {
                        stepAfterExplanation.innerHTML = `
                        <button onclick="toggleAccordion('after')" class="accordion-btn rounded-xl bg-indigo-50 text-indigo-900 border-indigo-200 hover:bg-indigo-100 flex items-center justify-between p-4 w-full font-bold mb-4 mt-8 border border-dashed border-indigo-300 shadow-sm">
                           <span><i class="fa-solid fa-lightbulb mr-2 ml-2"></i> סיכום לאחר הקוד</span>
                           <i id="acc-icon-after" class="fa-solid fa-chevron-down transition-transform"></i>
                        </button>
                        <div id="acc-content-after" class="hidden bg-white border border-indigo-100 p-6 rounded-xl shadow-sm mb-6 text-slate-700 leading-relaxed text-[1.05rem]">
                            ${step.mentalModelAfter}
                        </div>`;
                    }
                }
            }

            prevBtn.disabled = currentStep === 0;

            if (currentStep === steps.length - 1) {
                nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-collapsed');
            const isCollapsed = document.body.classList.contains('sidebar-collapsed');
            localStorage.setItem('sidebarCollapsed', isCollapsed);

            // Update icon direction
            const icon = document.getElementById('sidebar-toggle-icon');
            if (isCollapsed) {
                icon.className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            } else {
                icon.className = 'fa-solid fa-chevron-right text-lg transition-transform duration-300';
            }
        }

        function init() {
            // Restore tooltip state from localStorage
            const savedState = localStorage.getItem('globalTooltipState');
            if (savedState) {
                tooltipState = parseInt(savedState);
            }
            updateCyclerUI();

            // Create and inject sidebar toggle button
            const toggleBtn = document.createElement('button');
            toggleBtn.id = 'sidebar-toggle-btn';
            toggleBtn.onclick = toggleSidebar;
            toggleBtn.innerHTML = '<i id="sidebar-toggle-icon" class="fa-solid fa-chevron-right text-lg transition-transform duration-300"></i>';
            document.body.appendChild(toggleBtn);

            // Load sidebar collapsed state from localStorage
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (isCollapsed) {
                document.body.classList.add('sidebar-collapsed');
                document.getElementById('sidebar-toggle-icon').className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            }

            updateUI();
        }

        init();
    </script>

    <!-- Tree Modal -->
    <div id="tree-modal" class="fixed inset-0 z-[110] bg-slate-900/60 hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300 backdrop-blur-md" dir="rtl">
        <div class="bg-slate-50 rounded-[2rem] shadow-2xl w-full h-full max-w-7xl max-h-[95vh] relative transform scale-95 transition-transform duration-300 flex flex-col overflow-hidden border border-slate-300/50" id="tree-modal-card">
            
            <div class="absolute top-0 left-0 right-0 p-5 z-50 flex justify-between items-center pointer-events-none">
                <div class="bg-white/80 backdrop-blur-md px-5 py-2 rounded-xl shadow-sm border border-slate-200 pointer-events-auto">
                    <h3 class="font-black text-slate-800"><i class="fa-solid fa-sitemap text-blue-500 ml-2"></i> מפת הקשרים הלוגיים - פירוק מבנים (DAG)</h3>
                </div>
                <button onclick="closeTreeModal()" class="pointer-events-auto text-slate-400 hover:text-red-500 hover:bg-red-50 transition-colors w-12 h-12 flex items-center justify-center rounded-full text-2xl bg-white shadow-md border border-slate-200"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Full Width Graph Pane -->
            <div class="w-full h-full overflow-auto relative dark-scroll bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:20px_20px]" id="graph-scroll-container">
                <div id="graph-pane" class="relative min-w-max min-h-max flex flex-col items-center py-24 px-16">
                    <svg id="lines-svg" class="absolute inset-0 w-full h-full pointer-events-none z-0"></svg>
                    <!-- Render Levels here via JS -->
                </div>
            </div>
            
        </div>
    </div>

    <!-- Node Details Popup Modal -->
    <div id="node-details-modal" class="fixed inset-0 z-[120] bg-slate-900/40 hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300 backdrop-blur-sm" onclick="closeNodeModal(event)" dir="rtl">
        <div class="bg-white rounded-[1.5rem] shadow-2xl w-full max-w-2xl transform scale-95 transition-transform duration-300 flex flex-col overflow-hidden border border-slate-200" id="node-details-card" onclick="event.stopPropagation()">
            
            <div class="p-6 pb-4 bg-slate-50 border-b border-slate-200 flex justify-between items-start">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 min-w-[48px] rounded-xl bg-white text-blue-600 flex items-center justify-center shadow-sm border border-slate-200">
                        <i id="ndm-icon" class="fa-solid fa-cube text-xl"></i>
                    </div>
                    <div>
                        <h2 id="ndm-title" class="text-2xl font-black text-slate-800" dir="ltr"></h2>
                        <p id="ndm-location" class="text-blue-700 font-bold text-[11px] tracking-wide bg-blue-100/50 inline-block px-3 py-1 rounded-full border border-blue-200 mt-2 font-mono uppercase"></p>
                    </div>
                </div>
                <button onclick="closeNodeModal()" class="text-slate-400 hover:text-slate-600 bg-white hover:bg-slate-100 transition-colors w-8 h-8 flex items-center justify-center rounded-full border border-slate-200 shadow-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="p-6 flex flex-col gap-5 overflow-auto max-h-[70vh]">
                <div class="bg-blue-50/50 p-5 rounded-xl border border-blue-100 shadow-inner">
                    <h3 class="text-[13px] font-bold text-blue-800 mb-2 flex items-center gap-2 uppercase tracking-wide"><i class="fa-solid fa-lightbulb text-blue-500"></i> ההסבר הרעיוני המורחב</h3>
                    <p id="ndm-details" class="text-slate-700 leading-relaxed font-medium text-[14px]"></p>
                </div>
                
                <div class="bg-[#282c34] rounded-xl flex-1 overflow-hidden border border-[#3e4451] shadow-lg flex flex-col">
                    <div class="bg-[#21252b] border-b border-[#3e4451] px-4 py-2 flex items-center justify-between">
                        <span class="text-slate-400 text-[11px] font-mono uppercase tracking-wider font-bold">הקוד הספציפי שהוסף:</span>
                    </div>
                    <div dir="ltr" class="text-left overflow-auto p-5 dark-scroll max-h-72">
                        <pre style="margin:0; padding:0; background:transparent;"><code id="ndm-code" class="language-scheme text-[13px] font-mono leading-relaxed"></code></pre>
                    </div>
                </div>
            </div>
            
            <div class="p-4 border-t border-slate-100 bg-slate-50 flex justify-end">
                <button id="ndm-jump-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-[13px] font-bold px-5 py-2.5 rounded-xl shadow-sm transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> קפוץ לשלב הרלוונטי
                </button>
            </div>
        </div>
    </div>
