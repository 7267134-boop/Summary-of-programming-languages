                    </div>

                    <h3 class="text-lg font-bold text-slate-800 mb-2">דיוקים בהגדרת הדקדוק:</h3>

                    </ul>
                `,
                code: `;; בקובץ lang.scm בתוך הגדרת the-grammar:

(expression
  ("event.create()")
  event-create-exp)

;; [תיקון שגיאת תלמיד]: התלמיד רשם שגוי: ("<" identifier ">" "+=" ...)
(expression
  (identifier "+=" "{" (separated-list expression ";") "}")
  event-add-exp)`
            },
            {
                id: 2,
                title: "שלב 2: עדכון מבני הנתונים (data-structures.scm)",

                    <ul class="list-disc list-inside text-sm text-slate-700 space-y-1 mb-4">

                    </ul>
                `,
                code: `;; בקובץ data-structures.scm בתוך הגדרת expval datatype:
  (event-val
    (procs (list-of proc?)))

(define expval->event
  (lambda (v)

      (event-val (procs) procs)
      (else (eopl:error 'expval->event "not an event: ~s" v)))))`

            {

                `,
                code: `;; בקובץ interp.scm בתוך ה-cases של value-of:

(event-create-exp ()
  (event-val '()))

(event-add-exp (evnt procs)
  (let ((ref (apply-env env evnt))) ; שליפת הרפרנס מהסביבה הלקסיקלית
    (let ((old-procs (expval->event (deref ref))) ; שליפת הפרוצדורות הקיימות
          (new-vals (map (lambda (exp) (value-of exp env)) procs))) ; הערכת הביטויים החדשים
      (begin
        (validate-add-input new-vals) ; בדיקה שכולם מסוג proc-val
        (let ((new-procs (map expval->proc new-vals))) ; חילוץ ה-proc הפנימי
          (let ((all-procs (append old-procs new-procs))) ; מיזוג הרשימות
            (begin
              (setref! ref (event-val all-procs)) ; עדכון המחסן
              (num-val 23)))))))) ; החזרת ערך דאמי תקין

(call-exp (rator rand)
  (let ((v (value-of rator env))
        (arg (value-of rand env)))
    (cases expval v
      (proc-val (proc)
        (apply-procedure proc arg))
      (event-val (procs)
        (if (null? procs)
            (eopl:error 'value-of "cant invoke empty event")
            (apply-multi-proc procs arg)))
      (else (eopl:error 'value-of "only procedure or event can be invoked")))))`

(define apply-multi-proc

      (if (null? (cdr procs))
          res
          (apply-multi-proc (cdr procs) arg)))))

(define validate-add-input

  (lambda (vals)

        #t
        (cases expval (car vals)

            (check-all-procs (cdr vals)))

        let currentStep = 0;
        const stepTitle = document.getElementById('step-title');
        const stepNumberBadge = document.getElementById('step-number-badge');
        const stepExplanation = document.getElementById('step-explanation');
        const codeContainer = document.getElementById('code-container');
        const codeBlock = document.getElementById('code-block');
        const fileName = document.getElementById('file-name');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const stepList = document.getElementById('step-list');
        const stepCounter = document.getElementById('step-counter');
        const contentContainer = document.getElementById('content-container');

        function init() {
            renderSidebar();
            updateUI();
        }

        function renderSidebar() {
            stepList.innerHTML = '';
            steps.forEach((step, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${index === currentStep ? 'active-nav' : ''}`;
                btn.onclick = () => goToStep(index);
                btn.innerHTML = `<span>${index}: ${step.title}</span>`;
                stepList.appendChild(btn);
            });
        }

        function updateUI() {
            const step = steps[currentStep];

            // Fade out
            contentContainer.classList.remove('fade-enter-active');
            contentContainer.classList.add('fade-enter');

            setTimeout(() => {
                stepNumberBadge.textContent = "תחנה " + currentStep;
                stepTitle.textContent = step.title;
                stepExplanation.innerHTML = step.explanation;

                if (step.code && step.filename) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-regular fa-file-code ml-2"></i>${step.filename}`;
                    codeBlock.textContent = step.code;
                    if (window.Prism) {
                        Prism.highlightElement(codeBlock);
                    }
                } else {
                    codeContainer.classList.add('hidden');
                }

                prevBtn.disabled = currentStep === 0;
                stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;

                if (currentStep === steps.length - 1) {
                    nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
                } else {
                    nextBtn.innerHTML = 'המשך <i class="fa-solid fa-arrow-left mr-2"></i>';
                }

                renderSidebar();

                // Fade in
                contentContainer.classList.remove('fade-enter');
                contentContainer.classList.add('fade-enter-active');
            }, 150);
        }

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        // Start initialization
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
