    <script>
        let hoverCloseTimer = null;

        function clearCloseTimer() {
            if (hoverCloseTimer) {
                clearTimeout(hoverCloseTimer);
                hoverCloseTimer = null;
            }
        }

        function startCloseTimer() {
            if (tooltipState !== 3) return;
            clearCloseTimer();
            hoverCloseTimer = setTimeout(() => {
                closeModal(null, true);
            }, 300); // 300ms delay to allow mouse movement to modal
        }

        // Global click listener to close modal when clicking outside in click mode
        document.addEventListener('click', (event) => {
            const modal = document.getElementById('explanation-modal');
            const modalCard = document.getElementById('modal-card');

            if (!modal.classList.contains('hidden')) {
                // If the click is NOT inside the modal-card, and NOT on an interactive tooltip
                if (!modalCard.contains(event.target) && !event.target.closest('.interactive-tooltip')) {
                    closeModal(null, true);
                }
            }
        });
        const explanationsDict = {
            
            "step1_1": `<p>אנחנו אומרים ל-SLLGEN: "אני עומד להגדיר לך עכשיו תבנית חדשה של קוד, והתבנית הזו שייכת למשפחה הכללית שנקראת <code>expression</code> (ביטוי)". כלומר, בכל מקום בשפה שמותר לכתוב בו ביטוי כלשהו, מותר יהיה לכתוב גם את התבנית שנציג כעת.</p>`,
            "step1_2": `<p>זוהי תבנית הזיהוי של פקיד המכס. המרכאות הן קריטיות: הן אומרות לפארסר לחפש בטקסט את הרצף המדויק, אות לאות, של <code>event.create()</code>. בגלל ש*הכל* נמצא בתוך מרכאות כליטרל, המשמעות היא שאין פה שום "תוכן אמיתי" לשמור. כל המחרוזת הזו היא "אריזה" בלבד המשמשת כפקודה.</p>`,
            "step1_3": `<p>זוהי התווית של "קופסת הפלסטיק" (צומת ה-AST). אנחנו אומרים ל-SLLGEN: "אם זיהית את התבנית הקודמת, תייצר לי צומת בעץ בשם <code>event-create-exp</code>". בגלל שבתבנית הזיהוי לא היו נתונים (אלא רק מחרוזת במרכאות שמושלכת לפח), הקופסה הזו תהיה ריקה מנתונים פנימיים. היא פשוט אומרת למפרש בהמשך: "היי, המתכנת ביקש לייצר אירוע!".</p>`,
            "step1_4": `<p>התחלנו תבנית זיהוי חדשה, והיא מורכבת ומרתקת. פקיד המכס מתבקש לחפש רצף כזה:</p><ol class="list-decimal list-inside ml-4 space-y-2 mb-4"><li><code>identifier</code> (ללא מרכאות): זהו טרמינל (Terminal) מובנה של ה-Scanner. הפארסר מצפה לראות פה שם חוקי של משתנה (למשל <code>myEvent</code>). מכיוון שזה *לא* במרכאות – זה מידע שיקר לי! הפארסר ישמור את שם המשתנה שנקרא.</li><li><code>"+="</code> (במרכאות): חפש בדיוק את שני התווים הללו. זו רק אריזה/סימן היכר, אל תשמור אותם.</li><li><code>"{"</code> (במרכאות): חפש סוגר מסולסל פותח. זרוק אותו לפח אחר כך.</li></ol>`,
            "step1_5": `<p>פה נכנס אחד מ"כלי העבודה" החזקים ביותר של SLLGEN. אנחנו מבקשים מהפארסר לצפות ל**רשימה** של ביטויים (כלומר, סוגים אחרים של <code>expression</code>), שמופרדים ביניהם בדיוק בתו <code>";"</code>.<br>מתחת לפני השטח, SLLGEN מריץ פה לולאה חכמה: הוא קורא ביטוי, שומר אותו, בודק אם יש נקודה-פסיק, אם כן הוא קורא עוד ביטוי, ושומר אותו, וכן הלאה. בסוף התהליך, הוא לוקח את כל הביטויים שנקראו (וזורק לפח את כל הנקודה-פסיק), ואורז אותם לתוך רשימה אחת (List של Scheme).</p>`,
            "step1_6": `<p>סוף תבנית הזיהוי. אנחנו מצפים לסוגר מסולסל סוגר (במרכאות - כלומר, נדרש לזיהוי, אך מושלך לאשפה לאחר מכן).</p>`,
            "step1_7": `<p>שלב האריזה הסופי. אנחנו אומרים ל-SLLGEN: "בנה קופסה בשם <code>event-add-exp</code>".<br>אבל בניגוד לכלל הראשון, הקופסה הזו **לא ריקה**. בגלל שבתבנית הקודמת היו שני רכיבים ללא מרכאות (<code>identifier</code> ו-<code>separated-list</code>), SLLGEN באופן אוטומטי ייצר את הקופסה <code>event-add-exp</code> עם שני שדות פנימיים:</p><ol class="list-decimal list-inside ml-4 space-y-2 mb-4"><li>השדה הראשון יחזיק את המשתנה שנמצא.</li><li>השדה השני יחזיק רשימה של כל הביטויים שנמצאו.</li></ol><p>כשנגיע בהמשך הקורס לכתוב את פונקציית ה-<code>value-of</code> שלנו, נוכל בקלות לחלץ את הנתונים האלו בעזרת <code>cases</code>.</p>`,

            "step2_1": `<p>שורה זו מתווספת להגדרת ה-<code>define-datatype</code> של <code>expval</code>. אנחנו מייצרים כאן וריאנט (Variant) חדש, מעין תבנית למעטפת חדשה בשפה שלנו שנקראת <code>event-val</code>.<br>התבנית הזו מגדירה שכל מעטפת כזו תחזיק בתוכה שדה פנימי אחד בשם <code>procs</code>.<br>הביטוי <code>(list-of proc?)</code> הוא פונקציית בדיקה (Predicate) של EOPL שמבטיחה הגנה כפולה: היא מוודאת שהמידע שנכנס למעטפת הזו הוא אכן רשימה (List) של Scheme, ושכל איבר ואיבר בתוך הרשימה הזו הוא פרוצדורה חוקית (<code>proc?</code>) של המפרש שלנו (ולא סתם מספרים או אותיות).</p>`,
            "step2_2": `<p>כאן אנחנו מגדירים את הפקח שלנו – פונקציית חילוץ גלובלית בשם <code>expval-&gt;event</code>. היא מקבלת כארגומנט משתנה <code>v</code>, שהוא ערך מבוטא (<code>expval</code>) כלשהו שהמפרש מחזיק ביד באותו רגע, ושתפקידה "לקלף" ממנו את המעטפת.</p>`,
            "step2_3": `<p>שימוש במנגנון ה-<code>cases</code> המוכר של EOPL. זוהי פקודת התאמת תבניות (Pattern Matching) על הטיפוס <code>expval</code>. אנחנו אומרים למפרש: "קח את המעטפת <code>v</code>, ותבדוק לאיזו תבנית מהגדרת הטיפוסים היא מתאימה".</p>`,
            "step2_4": `<p>זהו מקרה ההצלחה. המפרש בודק ומגלה ש-<code>v</code> הוא אכן מעטפת מסוג <code>event-val</code>.<br>באותו רגע, המנגנון פותח את המעטפה, שולף את התוכן שלה, ומצמיד אותו לשם המשתנה המקומי שכתבנו בסוגריים – <code>procs</code>.<br>מצד ימין של הסוגריים, אנחנו פשוט מחזירים את המשתנה <code>procs</code> הזה החוצה. כעת, מי שקרא לפונקציה הזו מחזיק ביד רשימת פרוצדורות נקייה וגולמית של Scheme, חופשייה מהמעטפת של המפרש.</p>`,
            "step2_5": `<p>זהו מנגנון ההגנה (Defensive Programming). מה קורה אם המתכנת שכתב קוד בשפה שלנו ניסה בטעות להפעיל אירוע, אבל המשתנה שהוא השתמש בו בכלל מכיל את המספר <code>5</code>? במצב כזה, <code>v</code> יהיה <code>num-val</code>.<br>התבנית של <code>event-val</code> לא תתאים, והמפרש ייפול לתוך ה-<code>else</code>.<br>כאן אנחנו מפעילים את פונקציית השגיאה הרשמית של EOPL, שעוצרת מייד את ריצת התוכנית ומדפיסה הודעה ברורה למשתמש: "שגיאה בפונקציה <code>expval-&gt;event</code>: המידע ששלחת איננו אירוע, אלא הערך הבא...". זה מונע מהמפרש להמשיך לרוץ במצב לא תקין ולהתרסק בצורה לא מבוקרת.</p>`,

            "step3_1": `<p>המפרש נתקל בפקודה ליצירת אירוע. הוא לא צריך לחשב שום דבר מורכב. הוא פשוט משתמש ב"מעטפת" שהגדרנו בשלב הקודם (<code>event-val</code>), ומכניס לתוכה רשימה ריקה <code>'()</code>. הערך המבוטא הזה (הקבוצה הריקה) מוחזר כדי שהמפרש יוכל לשמור אותו באיזה משתנה שהמתכנת ביקש.</p>`,
            "step3_2": `<p>קיבלנו את שם האירוע (<code>evnt</code>). הפונקציה <code>apply-env</code> מחפשת את השם הזה בסביבה הלקסיקלית (ה-Environment) שלנו. אבל שימו לב! היא לא מחזירה את הערך עצמו, אלא את ה**רפרנס (ref)** – הכתובת המדויקת בזיכרון (Store) שבה האירוע הזה שמור.</p>`,
            "step3_3": `<p>אנחנו ניגשים לזיכרון עצמו עם הפקודה <code>deref</code> (מביאים את התוכן שנמצא בכתובת), ואז משתמשים בפונקציית ה"פקח" מהשלב הקודם שלנו: <code>expval-&gt;event</code>. היא מוודאת שהערך בזיכרון הוא אכן אירוע, ומקלפת ממנו את המעטפת כדי לתת לנו את <code>old-procs</code> – רשימת הפרוצדורות שכבר קיימות בו.</p>`,
            "step3_4": `<p>כאן המפרש מעריך את כל הביטויים שהמתכנת רצה להוסיף. <code>procs</code> היא רשימה של עצי תחביר (ביטויים), ולכן אנחנו עוברים עליהם אחד-אחד עם <code>map</code> וקוראים ל-<code>value-of</code> כדי להפוך אותם לערכים מבוטאים (expvals) של זמן ריצה.</p>`,
            "step3_5": `<p>בלוק ה-<code>begin</code> מאפשר לנו לבצע שרשרת של פעולות. תחילה, אבטחת איכות: מוודאים שכל הביטויים שחישבנו כרגע הם אכן מעטפות של פרוצדורות (<code>proc-val</code>).</p>`,
            "step3_6": `<p>שני שלבי עיבוד:</p><ol class="list-decimal list-inside ml-4 space-y-2 mb-4"><li>אנחנו "מקלפים" את המעטפת מכל הפרוצדורות החדשות שלנו בעזרת הפקח של הפרוצדורות (<code>expval-&gt;proc</code>), ונשארים עם הרכיבים הפנימיים.</li><li>אנחנו משתמשים ב-<code>append</code> כדי להדביק את הרשימה הישנה עם הרשימה החדשה לכדי רשימה אחת ארוכה בשם <code>all-procs</code>.</li></ol>`,
            "step3_7": `<p>**זוהי שורת המחץ של הבלוק הזה.**<br>הפקודה <code>setref!</code> אומרת למפרש: "תחזור לכתובת ההיא בזיכרון (<code>ref</code>), תמחק את מה שהיה שם, ותכניס לשם מעטפת אירוע חדשה (<code>event-val</code>) שמכילה את הרשימה המאוחדת".<br>אחרי שביצענו את תופעת הלוואי הזו בזיכרון, המפרש שלנו בנוי ככה שכל ביטוי חייב להחזיר *משהו*. לכן אנחנו פשוט מחזירים ערך דאמי "סתמי" כמו המספר 23 במעטפת. זו מסורת ידועה בשפות מבוססות EoPL עבור פעולות השמה (Mutation) שלא באמת צריכות להחזיר תוצאה משמעותית.</p>`,
            "step3_8": `<p>מתכנת הקליד פקודת הפעלה (לרוב משהו כמו סוגריים עם פרמטרים). אנחנו קודם כל מקפיאים את המצב ומחשבים את הערך של ה-<code>rator</code> (ה"מפעיל" – הקבוצה או הפונקציה) ואת ה-<code>rand</code> (ה"מופעל" – הארגומנט/ההודעה שנעביר).</p>`,
            "step3_9": `<p>זהו פולימורפיזם יפהפה של המפרש. אנחנו מסתכלים על המעטפת של המפעיל (<code>v</code>). אם המפעיל הוא פרוצדורה רגילה, אנחנו מחלצים אותה ופשוט מריצים אותה עם הארגומנט (התנהגות רגילה וקלאסית של השפה).</p>`,
            "step3_10": `<p>אם גילינו שהמפעיל הוא בכלל אירוע (קבוצת ווטסאפ), אנחנו משנים אסטרטגיה.<br>תחילה נוודא שהרשימה לא ריקה (כי אם לא הוסיפו מאזינים, אי אפשר להפעיל את האירוע וניזרק לשגיאה במערכת).<br>אם יש מאזינים, אנחנו שולחים את רשימת הפרוצדורות הפנימית (<code>procs</code>) יחד עם הארגומנט (<code>arg</code>) לפונקציית-עזר חדשה שכנראה כתבתם, <code>apply-multi-proc</code>, שהתפקיד שלה הוא לייצר לולאה ולרוץ על כל אחת מהפרוצדורות ברשימה ולהפעיל אותה.</p>`,
            "step3_11": `<p>שוב, הגנה (Defensive Programming). אם המתכנת ניסה "להפעיל" מספר או בוליאני במקום פונקציה או אירוע (למשל <code>(5 3)</code>), אנחנו עוצרים הכל ומודיעים לו שיש לו טעות בהבנת השפה.</p>`,

            "step4_1": `<p>זוהי הפונקציה שנקראה מתוך <code>call-exp</code> כאשר זיהינו שהמשתמש מנסה להפעיל אירוע (Event). היא מקבלת רשימה של פרוצדורות חלצות (<code>procs</code>) ואת הארגומנט (<code>arg</code>) שעלינו להעביר לכולן.</p>`,
            "step4_2": `<p>אנחנו לוקחים את הפרוצדורה הראשונה ברשימה (<code>car procs</code>) ומפעילים אותה מיד עם הארגומנט שלנו באמצעות <code>apply-procedure</code> (המנוע הרגיל של המפרש להפעלת פונקציות). את התוצאה של ההפעלה אנחנו שומרים באופן זמני במשתנה <code>res</code>. בשלב הזה, הפרוצדורה כבר רצה במציאות (הדפיסה משהו, שינתה זיכרון וכו').</p>`,
            "step4_3": `<p>אנחנו שואלים: "האם הרשימה שנותרה (<code>cdr procs</code>) היא ריקה?". במילים אחרות: "האם הפרוצדורה שהרצנו הרגע הייתה האחרונה ברשימה?".<br>אם התשובה היא כן (תנאי העצירה), אנחנו פשוט מחזירים את התוצאה שלה (<code>res</code>) החוצה. זה יהיה הערך שכל בלוק קריאת האירוע יחזיר.</p>`,
            "step4_4": `<p>המקרה הרקורסיבי. אם נשארו עוד פרוצדורות ברשימה, אנחנו פשוט קוראים לפונקציה שוב עם שאר הרשימה (<code>cdr procs</code>) ואותו ארגומנט בדיוק.<br>שים לב למשהו קריטי: אנחנו **לא עושים כלום** עם <code>res</code> במקרה הזה! הוא פשוט נזרק ונשכח. זה מוכיח שהמטרה של אירועים היא תופעות לוואי, ולא איסוף התוצאות של כל המאזינים. אנחנו פשוט רצים עליהם כדי שיעבדו, ומחזירים רק את האחרון.</p>`,
            "step4_5": `<p>כזכור, ב-<code>event-add-exp</code> (כשעשינו <code>+=</code>), עברנו על רשימת הביטויים וחישבנו אותם. עכשיו אנחנו שולחים אותם לבדיקה.<br>הדבר הראשון שאנחנו מוודאים: האם המתכנת ניסה לכתוב <code>myEvent += {}</code>? כלומר, רשימה ריקה. בשפה שלנו החלטנו שזה לא חוקי וחסר היגיון להוסיף רשימה ריקה לאירוע, ולכן אנחנו עוצרים מיד עם שגיאה.</p>`,
            "step4_6": `<p>אם הרשימה לא ריקה, אנחנו מעבירים את השרביט לפונקציית הבדיקה היסודית שעוברת איבר-איבר.</p>`,
            "step4_7": `<p>זוהי פונקציה רקורסיבית. תנאי העצירה שלנו הוא רשימה ריקה. אם הגענו לסוף הרשימה וכלום לא קרס בדרך, זה אומר שכל האיברים היו תקינים! אנחנו מחזירים <code>#t</code> (אמת) כסוג של אישור סופי.</p>`,
            "step4_8": `<p>כמו בכל רקורסיה על רשימה, אנחנו מסתכלים על האיבר הראשון (<code>car vals</code>). מכיוון שהוא חייב להיות ערך מבוטא של השפה (<code>expval</code>), אנחנו משתמשים ב-<code>cases</code> כדי לבחון את המעטפת שלו.</p>`,
            "step4_9": `<p>זה המקרה הטוב. אם המעטפת היא מסוג <code>proc-val</code> (כלומר, זו אכן פונקציה), אנחנו בכלל לא צריכים את התוכן שלה עכשיו. אנחנו פשוט נאנחים לרווחה, וקוראים לעצמנו שוב (רקורסיה) כדי לבדוק את המשך הרשימה (<code>cdr vals</code>).</p>`,
            "step4_10": `<p>מקרה הכישלון. אם האיבר הראשון התגלה כמשהו שאינו <code>proc-val</code> (למשל <code>num-val</code> שהכיל את המספר 5), אנחנו נופלים ל-<code>else</code>. הפונקציה עוצרת מיד את כל המפרש וזורקת שגיאה שמתריעה כי לא ניתן לדחוף אלמנטים שאינם פרוצדורות לתוך אירוע. הבדיקה נכשלה לחלוטין.</p>`

                    <div id="image-upload-fallback" class="hidden mt-4 p-8 border-2 border-dashed border-slate-300 rounded-xl bg-slate-50">
                        <i class="fa-regular fa-image text-4xl text-slate-400 mb-3"></i>
                        <p class="text-slate-500 mb-4 font-bold text-lg">תמונת השאלה חסרה</p>
                        <p class="text-slate-400 mb-6 text-sm">אנא בחר את קובץ התמונה שהורדת כדי להציג אותו כאן. (התמונה תישמר בדפדפן שלך לתמיד!)</p>
                        <input type="file" id="image-upload-input" accept="image/*" class="block w-full max-w-xs mx-auto text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-blue-50 file:text-primary hover:file:bg-blue-100 cursor-pointer">
                    </div>
                </div>`;
            } else if (step.isFinal) {
                let html = '<div class="space-y-12">';
                steps.forEach(s => {
                    if (s.code && !s.isFinal) {
                        html += `
                        <div>
                            <h3 class="text-xl font-bold text-slate-800 mb-4">${s.title}</h3>
                            <div class="code-window">
                                <div class="code-window-header ltr" dir="ltr">
                                    <div class="mac-buttons">
                                        <div class="mac-btn mac-close"></div>
                                        <div class="mac-btn mac-min"></div>
                                        <div class="mac-btn mac-max"></div>
                                    </div>
                                    <div class="code-filename"><i class="fa-solid fa-code mr-2"></i>${s.filename}</div>
                                </div>
                                <div class="code-body ltr text-left" dir="ltr">
                                    <pre><code class="language-scheme">${s.code}</code></pre>
                                </div>
                            </div>
                        </div>
                        `;
                    }
                });
                html += '</div>';
                stepExplanation.innerHTML = html;
                Prism.highlightAllUnder(stepExplanation);
            } else {
                if (step.mentalModelBefore) {
                    stepExplanation.innerHTML = `
                    <button onclick="toggleAccordion('before')" class="accordion-btn rounded-xl bg-purple-50 text-purple-900 border-purple-200 hover:bg-purple-100 flex items-center justify-between p-4 w-full font-bold mb-6 border border-dashed border-purple-300 shadow-sm">
                       <span><i class="fa-solid fa-brain mr-2 ml-2"></i> מודל מנטלי לפני הקוד</span>
                       <i id="acc-icon-before" class="fa-solid fa-chevron-down transition-transform"></i>
                    </button>
                    <div id="acc-content-before" class="hidden bg-white border border-purple-100 p-6 rounded-xl shadow-sm mb-6 text-slate-700 leading-relaxed text-[1.05rem]">
                        ${step.mentalModelBefore}
                    </div>`;
                }

                if (step.code) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-solid fa-code mr-2"></i>${step.filename}`;
                    codeBlock.innerHTML = step.code;
                    Prism.highlightElement(codeBlock);

                    if (step.mentalModelAfter) {
                        stepAfterExplanation.innerHTML = `
                        <button onclick="toggleAccordion('after')" class="accordion-btn rounded-xl bg-indigo-50 text-indigo-900 border-indigo-200 hover:bg-indigo-100 flex items-center justify-between p-4 w-full font-bold mb-4 mt-8 border border-dashed border-indigo-300 shadow-sm">
                           <span><i class="fa-solid fa-lightbulb mr-2 ml-2"></i> סיכום לאחר הקוד</span>
                           <i id="acc-icon-after" class="fa-solid fa-chevron-down transition-transform"></i>
                        </button>
                        <div id="acc-content-after" class="hidden bg-white border border-indigo-100 p-6 rounded-xl shadow-sm mb-6 text-slate-700 leading-relaxed text-[1.05rem]">
                            ${step.mentalModelAfter}
                        </div>`;
                    }
                }
            }

            prevBtn.disabled = currentStep === 0;
            stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;

            if (currentStep === steps.length - 1) {
                nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
            } else {
                nextBtn.innerHTML = 'המשך <i class="fa-solid fa-arrow-left mr-2"></i>';
            }

            renderSidebar();

            setTimeout(() => {
                initTooltips();
            }, 50);

            contentContainer.classList.remove('fade-enter');
            contentContainer.classList.add('fade-enter-active');
        }

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-collapsed');
            const isCollapsed = document.body.classList.contains('sidebar-collapsed');
            localStorage.setItem('sidebarCollapsed', isCollapsed);

            // Update icon direction
            const icon = document.getElementById('sidebar-toggle-icon');
            if (isCollapsed) {
                icon.className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            } else {
                icon.className = 'fa-solid fa-chevron-right text-lg transition-transform duration-300';
            }
        }

        function init() {
            // Restore tooltip state from localStorage
            const savedState = localStorage.getItem('globalTooltipState');
            if (savedState) {
                tooltipState = parseInt(savedState);
            }
            updateCyclerUI();

            // Create and inject sidebar toggle button
            const toggleBtn = document.createElement('button');
            toggleBtn.id = 'sidebar-toggle-btn';
            toggleBtn.onclick = toggleSidebar;
            toggleBtn.innerHTML = '<i id="sidebar-toggle-icon" class="fa-solid fa-chevron-right text-lg transition-transform duration-300"></i>';
            document.body.appendChild(toggleBtn);

            // Load sidebar collapsed state from localStorage
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (isCollapsed) {
                document.body.classList.add('sidebar-collapsed');
                document.getElementById('sidebar-toggle-icon').className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            }

            updateUI();
        }

        init();
    </script>
    <script src="ai_widget.js"></script>
