      (bool-val (bool) (type-val (BoolType)))
      (proc-val (proc) (type-val (ProcType)))
      (else (eopl:error "unsupported type")))))

(isBool?-exp (ex)
  (let ((ex-type (value-of ex env)))
    (cases expval ex-type
      (type-val (typ)
        (cases type typ
          (BoolType () (bool-val #t))
          (else (bool-val #f))))
      (else (eopl:error "expression should be type")))))

(isNum?-exp (ex)

(isProc?-exp (ex)

        (cases type typ
          (ProcType () (bool-val #t))
          (else (bool-val #f))))
      (else (eopl:error "expression should be type")))))`

                            <div class="bg-white p-3 rounded-lg border border-red-100">
                                <strong class="text-red-950 block mb-1">❌ מלכודת 3: דילוג על הגדרת Datatype ייעודי לטיפוסים</strong>
                                הימנעו מלהחזיר סמלים פשוטים כמו <code>'int</code> או <code>'bool</code> בתוך <code>type-val</code>. 
                                במבחנים מקפידים מאוד על הגדרת <code>define-datatype type</code> ייעודי כדי להוכיח הבנה במבנה המונחה של EOPL.
                            </div>
                        </div>
                    </div>
                    <p class="mt-6 text-slate-700">
                        שמירה על הכללים האלו תבטיח לכם פתרון מושלם ללא איבוד נקודות מיותר!
                    </p>
                `,
                code: `;; שאלת Reflection - פתרון רשמי ומלא.`
            }
        ];

        let currentStep = 0;
        const stepTitle = document.getElementById('step-title');
        const stepNumberBadge = document.getElementById('step-number-badge');
        const stepExplanation = document.getElementById('step-explanation');
        const codeContainer = document.getElementById('code-container');
        const codeBlock = document.getElementById('code-block');
        const fileName = document.getElementById('file-name');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const stepList = document.getElementById('step-list');
        const stepCounter = document.getElementById('step-counter');
        const contentContainer = document.getElementById('content-container');

        function init() {
            renderSidebar();
            updateUI();
        }

        function renderSidebar() {
            stepList.innerHTML = '';
            steps.forEach((step, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${index === currentStep ? 'active-nav' : ''}`;
                btn.onclick = () => goToStep(index);
                btn.innerHTML = `<span>${index}: ${step.title}</span>`;
                stepList.appendChild(btn);
            });
        }

        function updateUI() {
            const step = steps[currentStep];
            
            // Fade out
            contentContainer.classList.remove('fade-enter-active');
            contentContainer.classList.add('fade-enter');
            
            setTimeout(() => {
                stepNumberBadge.textContent = "תחנה " + currentStep;
                stepTitle.textContent = step.title;
                stepExplanation.innerHTML = step.explanation;
                
                if (step.code && step.filename) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-regular fa-file-code ml-2"></i>${step.filename}`;
                    codeBlock.textContent = step.code;
                    if (window.Prism) {
                        Prism.highlightElement(codeBlock);
                    }
                } else {
                    codeContainer.classList.add('hidden');
                }

                prevBtn.disabled = currentStep === 0;
                stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;
                
                if (currentStep === steps.length - 1) {
                    nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
                } else {
                    nextBtn.innerHTML = 'המשך <i class="fa-solid fa-arrow-left mr-2"></i>';
                }

                renderSidebar();
                
                // Fade in
                contentContainer.classList.remove('fade-enter');
                contentContainer.classList.add('fade-enter-active');
            }, 150);
        }

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        // Start initialization
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
