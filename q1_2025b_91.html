    <script>

        function clearCloseTimer() {
            if (hoverCloseTimer) {

                hoverCloseTimer = null;

        function startCloseTimer() {
            if (tooltipState !== 3) return;
            clearCloseTimer();
            hoverCloseTimer = setTimeout(() => {
                closeModal(null, true);

        }

        // Global click listener to close modal when clicking outside in click mode
        document.addEventListener('click', (event) => {

            const modalCard = document.getElementById('modal-card');

            if (!modal.classList.contains('hidden')) {
                // If the click is NOT inside the modal-card, and NOT on an interactive tooltip
                if (!modalCard.contains(event.target) && !event.target.closest('.interactive-tooltip')) {
                    closeModal(null, true);
                }
            }
        });
        const explanationsDict = {
            
            "step1_1": `<div class="space-y-3">
                <p><strong>מה קורה פה:</strong> כאן אנחנו מגדירים למחולל הפרסר (מנגנון כמו SLLGEN בקורס) כלל חדש למשפחה של "ביטויים" תחת הקטגוריה <code>expression</code>. אנחנו אומרים למפרש: "אם אתה רואה בטקסט את המחרוזת המדויקת <code>"get-type"</code>, ואחריה סוגר שמאלי <code>"("</code>, ואחריו מופיע <strong>שם של משתנה</strong> בלבד (<code>identifier</code> - למשל <code>x</code>, <code>y</code>, <code>my-var</code>), ולבסוף סוגר ימני <code>")"</code> - תארוז לי את כל זה לתוך צומת (Node) חדש בעץ התחביר ותקרא לו <code>get-type-exp</code>".</p>

                </div>

                <div class="bg-blue-50 p-3 rounded border border-blue-100 text-blue-900">

            </div>`,

            "step3_1": `<div class="space-y-3">
                <p><strong>מה קורה פה:</strong> המפרש פוגש את הצומת <code>get-type-exp</code> (תפקיד השמאי). שים לב ש-<code>id</code> הוא רק "שם" (סמל), ולכן המפרש לא מפעיל עליו רקורסיה של <code>value-of</code>. במקום זאת, הוא הולך ישירות לסביבה הנוכחית (<code>env</code>) ומושך משם את הערך השמור תחת השם הזה בעזרת <code>apply-env</code>. המשתנה <code>val</code> מחזיק כעת את הערך האמיתי (למשל, <code>(num-val 5)</code>).</p>
            </div>`,

            "step3_2": `<div class="space-y-3">
                <p><strong>מה קורה פה:</strong> כאן המפרש "מסתכל בתוך הקופסה" שיצאה מהסביבה. הוא עושה התאמת תבניות (<code>cases</code>) על הערך. הקסם האמיתי נמצא בצד ימין של כל שורה: אם הוא גילה שהערך הוא מספר (<code>num-val</code>), הוא לא מחזיר את המספר! הוא זורק את המספר הצידה, ומייצר במקומו קופסה חדשה לגמרי מסוג <code>type-val</code>, שבתוכה נמצאת התווית <code>NumType</code>. כעת הבנו למה היה לנו כל כך חשוב להגדיר את ה-<code>type-val</code> בקובץ הקודם: זו הדרך של השמאי להעביר הלאה את התשובה שלו.</p>
            </div>`,

            "step3_3": `<div class="space-y-3">
                <p><strong>מה קורה פה:</strong> אנחנו בפקודה <code>isBool?-exp</code>. הפקודה הזו כן מקבלת ביטוי מלא (<code>ex</code>), ולכן השלב הראשון הוא לחשב אותו בעזרת קריאה רקורסיבית ל-<code>value-of</code>. התוצאה נשמרת ב-<code>ex-type</code>.</p>
            </div>`,

            "step3_4": `<div class="space-y-3">
                <div class="bg-red-50 p-3 rounded border border-red-100 text-red-900">
                    <strong>מה קורה פה (הנקודה הקריטית ביותר!):</strong> כאן הפקיד דורש לראות תעודה. המפרש בודק האם התוצאה שחזרה מהחישוב הקודם (<code>ex-type</code>) היא עטופה ב-<code>type-val</code>.<br><br>
                    אם המתכנת ניסה לכתוב קוד כזה: <code>(isBool? 5)</code>, אז <code>value-of</code> של 5 יחזיר <code>(num-val 5)</code>. במצב כזה, ה-<code>cases</code> הזה יקפוץ מיד לשורת ה-<code>else</code> למטה ויזרוק שגיאה: <code>"expression should be type"</code>. הפקיד סירב לקבל מוצר פיזי.
                </div>
                <p>כדי שהקוד יעבוד, המתכנת <em>חייב</em> להזין ביטוי שמייצר <code>type-val</code>, למשל: <code>(isBool? (get-type x))</code>.</p>
            </div>`,

            "step3_5": `<div class="space-y-3">
                <p><strong>מה קורה פה:</strong> אם אכן קיבלנו <code>type-val</code> תקני, אנחנו פותחים אותו, שולפים מתוכו את הטיפוס המופשט (<code>typ</code> - התווית עצמה שהוגדרה ב-<code>define-datatype type</code>), ועושים עליה <code>cases</code> פנימי.</p>
                <p>היות ואנחנו כרגע בתוך פונקציית <code>isBool?</code>, אנחנו בודקים רק דבר אחד: האם התווית היא <code>BoolType</code>? אם כן, נחזיר למתכנת "אמת" עטופה ב-<code>bool-val</code>. אם זו כל תווית אחרת (כמו <code>NumType</code> או <code>ProcType</code>), נחזיר למתכנת "שקר" (<code>#f</code>).</p>
            </div>`

                    <p class="mb-4">הקוד הזה לוקח אותנו אל "דלת הכניסה" של המפרש (Interpreter) – אל תוך מנגנון הגדרת התחביר (Syntax) והפרסר (Parser). בשונה מהקוד שדנו בו קודם (שהתעסק בלוגיקה של זמן הריצה, ה-<code>value-of</code>), כאן אנחנו נמצאים בשלב הרבה יותר מוקדם: השלב שבו המפרש "לומד" לקרוא, לזהות מילים ומשפטים חדשים בשפה, ולהפוך טקסט רגיל למבנה נתונים חכם שנקרא עץ תחביר מופשט (AST - Abstract Syntax Tree).</p>
                    <p class="mb-4">הקוד הזה מוסיף לשפה שלנו יכולת שנקראת <strong>אינטרוספקציה (Introspection)</strong> – היכולת של השפה (ושל המתכנת שכותב בה) לשאול שאלות על סוגי הנתונים (Types) של עצמה תוך כדי ריצה.</p>
                    <p class="mb-6">כדי להבין מה קורה כאן, ולמה יש הבדל דק אך קריטי בין השורות, נבנה את המודל המנטלי.</p>
                    <h4 class="font-bold text-purple-900 text-lg mb-3">המודל המנטלי: עמדת הבידוק והמכס</h4>
                    <p class="mb-3">תאר לעצמך מפעל עם מסוע ועמדת בידוק.</p>
                    <p class="mb-3">לפעמים, מגיעה לעמדה קופסה סגורה שיש עליה מדבקה עם שם (זהו משתנה - <code>identifier</code>). הפקח בעמדה לא פותח את הקופסה, אלא מסתכל במסוף שלו על שם המדבקה, ובודק ברישומים: "איזה סוג של מוצר רשום תחת השם הזה במחסן?". הוא מברר את ה*סוג* רק על סמך השם שלו.</p>
                    <p class="mb-3">לעומת זאת, לפעמים מגיעה לעמדה מכונה קטנה שצריך קודם להפעיל אותה כדי לראות מה היא מייצרת (זהו ביטוי - <code>expression</code>). הפקח מפעיל את המכונה (כלומר, מחשב את הביטוי), מחכה שהיא תפלוט את התוצר הסופי שלה (הערך), ורק אז הוא בודק את התוצר בידיים ושואל: "האם זה ברזל? האם זה עץ?".</p>
                    <p>ההבדל הזה, בין "בדיקת המדבקה" לבין "הפעלת המכונה ובדיקת התוצר", הוא הלב של חוקי התחביר ששלחת.</p>

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-collapsed');
            const isCollapsed = document.body.classList.contains('sidebar-collapsed');
            localStorage.setItem('sidebarCollapsed', isCollapsed);

            // Update icon direction
            const icon = document.getElementById('sidebar-toggle-icon');
            if (isCollapsed) {
                icon.className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            } else {
                icon.className = 'fa-solid fa-chevron-right text-lg transition-transform duration-300';
            }
        }

        function init() {
            // Restore tooltip state from localStorage
            const savedState = localStorage.getItem('globalTooltipState');
            if (savedState) {
                tooltipState = parseInt(savedState);
            }
            updateCyclerUI();

            // Create and inject sidebar toggle button
            const toggleBtn = document.createElement('button');
            toggleBtn.id = 'sidebar-toggle-btn';
            toggleBtn.onclick = toggleSidebar;
            toggleBtn.innerHTML = '<i id="sidebar-toggle-icon" class="fa-solid fa-chevron-right text-lg transition-transform duration-300"></i>';
            document.body.appendChild(toggleBtn);

            // Load sidebar collapsed state from localStorage
            const isCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
            if (isCollapsed) {
                document.body.classList.add('sidebar-collapsed');
                document.getElementById('sidebar-toggle-icon').className = 'fa-solid fa-chevron-left text-lg transition-transform duration-300';
            }

            updateUI();
        }

        init();
    </script>
    <script src="ai_widget.js"></script>
</body>
