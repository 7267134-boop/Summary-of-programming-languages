                    <p class="mb-4">בתוך <code>value-of</code>, נממש את יצירת המערך ואת הגישה לתאים שלו תוך תיקון שני הבאגים של הסטודנט.</p>

                            <strong>כשל 2: חוסר אימות אינדקס שלילי:</strong> הסטודנט בדק רק <code>(&lt; i size)</code>. אינדקס שלילי היה מפיל את המערכת. הוספנו בדיקה דו-כיוונית <code>(and (&gt;= i 0) (&lt; i size))</code>. <br>
                            <strong>כשל 3: תאימות והחזרת ref-val:</strong> אנו מחזירים את ההפניה עצמה <code>(ref-val ref)</code> כדי שנוכל לבצע <code>deref</code> ו-<code>setref!</code> על התא.

                code: `;; בקובץ interp.scm בתוך ה-cases של value-of:

(arr-exp (typ size first-exp more-exps)
  (let ((vals (map (lambda (exp) (value-of exp env)) (cons first-exp more-exps)))
        (arr-size (expval->num (value-of size env))))
    (if (= (length vals) arr-size)
        (let ((refs (create-array-refs typ vals))) ; הקצאת הפניות במחסן
          (array-val typ arr-size refs))
        (eopl:error 'arr-exp "size doesn't match initialization elements length"))))

(index-exp (arrexp index)
  (let ((arr (value-of arrexp env)) ; [תיקון שגיאת סטודנט - הערכת ביטוי המערך]
        (i (expval->num (value-of index env))))
    (cases expval arr
      (array-val (typ size refs)
        (if (and (>= i 0) (< i size)) ; [תיקון שגיאת סטודנט - בדיקת אינדקס שלילי]
            (let ((ref (list-ref refs i)))
              (ref-val ref)) ; [החזרת ref-val לשמירה על תאימות עם deref ו-setref!]
            (eopl:error 'index-exp "index out of bounds: ~s" i)))
      (else (eopl:error 'index-exp "must be an array: ~s" arr)))))`

                code: `;; פונקציות עזר מחוץ ל-value-of בקובץ interp.scm:

(define verify-type
  (lambda (typ val)
    (cases type typ
      (type-pound ()
        (cases expval val
          (num-val (num) #t)
          (else (eopl:error 'verify-type "type mismatch: expected number, got ~s" val))))
      (type-question ()
        (cases expval val
          (bool-val (bool) #t)
          (else (eopl:error 'verify-type "type mismatch: expected boolean, got ~s" val))))
      (type-at ()
        (cases expval val
          (proc-val (proc) #t)
          (else (eopl:error 'verify-type "type mismatch: expected procedure, got ~s" val)))))))

(define create-array-refs
  (lambda (typ vals)
    (if (null? vals)
        '()
        (let ((val (car vals)))
          (begin
            (verify-type typ val) ; וולידציית טיפוס הערך
            (let ((ref (newref val))) ; הקצאה במחסן
              (cons ref (create-array-refs typ (cdr vals)))))))))`

                                <strong class="text-red-950 block mb-1">❌ מלכודת 1: שכחת הערכת ביטוי ה-arrexp ב-index-exp (כשל קלאסי)</strong>
                                <code>arrexp</code> הוא ביטוי תחבירי (AST Node). 
                                שליחתו ישירות ל-<code>(cases expval arrexp ...)</code> תגרום לקריסת המפרש. 
                                חובה לבצע קודם <code>(value-of arrexp env)</code> ורק אז להתאים Cases על התוצאה.
                            </div>
                            
                            <div class="bg-white p-3 rounded-lg border border-red-100">
                                <strong class="text-red-950 block mb-1">❌ מלכודת 2: תאימות הפניות (ref-val) לשמירה על שינויים (Mutation)</strong>
                                תאי המערך צריכים להיות ניתנים לשינוי. 
                                החזרת הערך הגולמי של התא ב-<code>index-exp</code> תהפוך את המערך לקבוע (Read-only). 
                                <strong>הפתרון:</strong> החזרת הפניה עטופה ב-<code>ref-val</code> מאפשרת לקורא להשתמש ב-<code>setref!</code> של השפה ישירות על התא, ללא צורך בכתיבת קוד מוטציה חדש.
                            </div>
                            
                            <div class="bg-white p-3 rounded-lg border border-red-100">
                                <strong class="text-red-950 block mb-1">❌ מלכודת 3: דילוג על בדיקת גבולות שליליים באינדקס</strong>
                                בדיקת <code>(&lt; i size)</code> בלבד אינה מספקת. 
                                אינדקסים שליליים יגרמו לשגיאות פנימיות ב-Scheme. 
                                הקפידו תמיד לבצע <code>(and (&gt;= i 0) (&lt; i size))</code>.
                            </div>
                        </div>
                    </div>
                    <p class="mt-6 text-slate-700 font-medium">
                        שמירה על עטיפת הפניות (ref-val) היא הדרך הנכונה לעבוד עם מערכים משתנים ב-EXPLICIT-REFS!
                    </p>
                `,
                code: `;; --- ריכוז נקודות תורפה וטיפים למבחן ---
;; 1. תמיד להעריך ביטויים תחביריים לפני Cases.
;; 2. להחזיר ref-val מביטוי הגישה כדי לאפשר מוטציה באמצעות setref!.
;; 3. לבצע בדיקת גבולות שלמה (אי-שליליות ואורך).
;; 4. וולידציית טיפוסים מלאה לכל ענפי ה-Type.`
            }
        ];

        let currentStep = 0;
        const stepTitle = document.getElementById('step-title');
        const stepNumberBadge = document.getElementById('step-number-badge');
        const stepExplanation = document.getElementById('step-explanation');
        const codeContainer = document.getElementById('code-container');
        const codeBlock = document.getElementById('code-block');
        const fileName = document.getElementById('file-name');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const stepList = document.getElementById('step-list');
        const stepCounter = document.getElementById('step-counter');
        const contentContainer = document.getElementById('content-container');

        function init() {
            renderSidebar();
            updateUI();
        }

        function renderSidebar() {
            stepList.innerHTML = '';
            steps.forEach((step, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn ${index === currentStep ? 'active-nav' : ''}`;
                btn.onclick = () => goToStep(index);
                btn.innerHTML = `<span>${index}: ${step.title}</span>`;
                stepList.appendChild(btn);
            });
        }

        function updateUI() {
            const step = steps[currentStep];
            
            // Fade out
            contentContainer.classList.remove('fade-enter-active');
            contentContainer.classList.add('fade-enter');
            
            setTimeout(() => {
                stepNumberBadge.textContent = "תחנה " + currentStep;
                stepTitle.textContent = step.title;
                stepExplanation.innerHTML = step.explanation;
                
                if (step.code && step.filename) {
                    codeContainer.classList.remove('hidden');
                    fileName.innerHTML = `<i class="fa-regular fa-file-code ml-2"></i>${step.filename}`;
                    codeBlock.textContent = step.code;
                    if (window.Prism) {
                        Prism.highlightElement(codeBlock);
                    }
                } else {
                    codeContainer.classList.add('hidden');
                }

                prevBtn.disabled = currentStep === 0;
                stepCounter.textContent = `${currentStep + 1} / ${steps.length}`;
                
                if (currentStep === steps.length - 1) {
                    nextBtn.innerHTML = 'סיום <i class="fa-solid fa-flag-checkered mr-2"></i>';
                } else {
                    nextBtn.innerHTML = 'המשך <i class="fa-solid fa-arrow-left mr-2"></i>';
                }

                renderSidebar();
                
                // Fade in
                contentContainer.classList.remove('fade-enter');
                contentContainer.classList.add('fade-enter-active');
            }, 150);
        }

        function nextStep() { if (currentStep < steps.length - 1) { currentStep++; updateUI(); } }
        function prevStep() { if (currentStep > 0) { currentStep--; updateUI(); } }
        function goToStep(index) { currentStep = index; updateUI(); }

        // Start initialization
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
